<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON LINES</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#111;touch-action:none}body{display:grid;place-items:center}canvas{background:#fafafa;max-width:100vw;max-height:100vh}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:10;padding:18px}.card{width:min(92vw,480px);padding:24px;border:2px solid #111;border-radius:24px;background:#fff;text-align:center}.hidden{display:none!important}h1{margin:0;font-size:42px;letter-spacing:4px}.sub{color:#666;margin:8px 0 18px}.input,.btn{width:100%;padding:13px 14px;margin:5px 0;border:2px solid #111;border-radius:12px;font-size:16px}.btn{background:#111;color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#fff;color:#111}.row{display:flex;gap:8px}.row>*{flex:1}.rooms{display:grid;gap:8px;max-height:28vh;overflow:auto;text-align:left}.room,.player{padding:11px;border:2px solid #ddd;border-radius:12px;display:flex;justify-content:space-between}.room button{width:auto;margin:0}.status{min-height:22px;color:#b00020;font-weight:700}.players{display:grid;gap:7px;margin:14px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}.hint{font-size:13px;color:#777;line-height:1.4}#hud{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#ffffe8;border:2px solid #111;border-radius:11px;padding:8px 11px;font-weight:900}.centerMsg{position:absolute;top:9%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #111;border-radius:12px;padding:8px 12px;font-weight:900;opacity:0;white-space:nowrap}.centerMsg.show{opacity:1}.controls{position:absolute;bottom:12px;left:14px;pointer-events:auto}.pad{width:126px;height:126px;position:relative}.pad button{position:absolute;width:42px;height:42px;border:2px solid #111;border-radius:10px;background:#fffc;font-size:20px;font-weight:900}.up{left:42px;top:0}.down{left:42px;bottom:0}.left{left:0;top:42px}.right{right:0;top:42px}.mobileOnly{display:none}@media(max-width:700px){.mobileOnly{display:block}.card{padding:19px}h1{font-size:32px}}</style></head><body><canvas id="game" width="1000" height="700"></canvas><div id="menu" class="screen"><div class="card"><h1>NEON LINES</h1><div class="sub">ONLINE · ОДИНОЧНАЯ ИГРА</div><input id="nick" class="input" maxlength="18" value="Игрок" placeholder="Твоё имя"><input id="roomName" class="input" maxlength="26" value="Неоновая арена" placeholder="Название комнаты"><div class="row"><button class="btn count" data-n="2">2 игрока</button><button class="btn count active" data-n="4">4 игрока</button></div><button id="bot" class="btn">ИГРАТЬ С БОТОМ</button><button id="create" class="btn">СОЗДАТЬ ОНЛАЙН-КОМНАТУ</button><div class="row"><button id="refresh" class="btn alt">↻ Обновить</button><button id="quick" class="btn alt">Быстрая игра</button></div><div id="rooms" class="rooms"><div class="sub">Загрузка комнат…</div></div><div id="status" class="status"></div><div class="hint">Каждое нажатие = ровно один ход. После твоего хода ходит следующий игрок или бот.<br>WASD / стрелки или кнопки снизу.</div></div></div><div id="lobby" class="screen hidden"><div class="card"><h2>ЛОББИ</h2><div id="lobbyTitle" class="sub"></div><div id="code" style="font-size:34px;font-weight:900;letter-spacing:6px">------</div><div id="playerList" class="players"></div><button id="start" class="btn">НАЧАТЬ РАУНД</button><button id="leave" class="btn alt">ВЫЙТИ</button><div id="lobbyStatus" class="status"></div></div></div><div id="hud" class="hidden"><div class="top"><div id="turnHud" class="pill">Ход: —</div><div id="scoreHud" class="pill">Победы: 0</div></div><div id="message" class="centerMsg"></div><div class="controls mobileOnly"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),lobby=document.getElementById('lobby'),hud=document.getElementById('hud');const colors=['#1687ff','#18ad67','#e33b4f','#e2aa08'];const grid={cols:11,rows:15},target={x:5,y:7};let ws=null,me=-1,players=[],segments=[],turn=-1,running=false,solo=false,botBusy=false,scores=[0,0,0,0],botTimer=0,roomCode='';
function show(e,on){e.classList.toggle('hidden',!on)}function msg(t,ms=900){const e=document.getElementById('message');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),ms)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function socket(){if(ws&&ws.readyState<=1)return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>setStatus('Соединение установлено');ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>{if(!solo)running=false};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)}}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function setStatus(t){document.getElementById('status').textContent=t||''}
function handle(m){if(m.type==='created'){me=m.player;roomCode=m.room;show(menu,false);show(lobby,true);document.getElementById('code').textContent=roomCode}if(m.type==='lobby'){roomCode=m.room;document.getElementById('code').textContent=m.room;document.getElementById('lobbyTitle').textContent=m.roomName+' · '+m.players.filter(Boolean).length+' / '+m.maxPlayers;document.getElementById('playerList').innerHTML=m.players.map((p,i)=>p?`<div class="player"><span><i class="dot" style="background:${colors[i]}"></i>${esc(p.name)} ${p.host?'★':''}</span><b>${i===me?'ты':''}</b></div>`:'<div class="player" style="opacity:.35">свободное место</div>').join('')}if(m.type==='error'){setStatus(m.message);document.getElementById('lobbyStatus').textContent=m.message}if(m.type==='start'){me=m.player>=0?m.player:me;solo=false;running=true;players=m.players||[];turn=m.turn;show(menu,false);show(lobby,false);show(hud,true);draw();updateHud()}if(m.type==='snapshot'){players=m.players||[];segments=m.segments||[];turn=m.turn;running=true;draw();updateHud()}if(m.type==='round'){running=false;scores=m.scores||scores;document.getElementById('scoreHud').textContent='Победы: '+(scores[me]||0);msg(m.winner===me?'ПОБЕДА! 🎉':m.winner<0?'Ничья!':'Победитель: '+(players[m.winner]?.name||'Игрок'),1400)}if(m.type==='opponent_left')msg('Игрок вышел',1000)}
function updateHud(){const p=players[turn];document.getElementById('turnHud').textContent='Ход: '+(p?(turn===me?'ТЫ':p.name):'—');document.getElementById('scoreHud').textContent='Победы: '+(scores[me]||0)}
function draw(){const W=canvas.width,H=canvas.height,cw=W/grid.cols,ch=H/grid.rows;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafafa';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let x=0;x<=grid.cols;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,H);ctx.stroke()}for(let y=0;y<=grid.rows;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(W,y*ch);ctx.stroke()}ctx.lineWidth=8;[[colors[0],[5,5,W-5,5]],[colors[1],[5,5,5,H-5]],[colors[2],[W-5,5,W-5,H-5]],[colors[3],[5,H-5,W-5,H-5]]].forEach(([co,p])=>{ctx.strokeStyle=co;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);ctx.stroke()});const tx=(target.x+.5)*cw,ty=(target.y+.5)*ch;ctx.strokeStyle=colors[3];ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(tx-cw*.27,ty-ch*.27,cw*.54,ch*.54,10);ctx.stroke();for(const s of segments){ctx.strokeStyle=colors[s.p%4];ctx.lineWidth=Math.max(7,Math.min(cw,ch)*.13);ctx.lineCap='round';ctx.beginPath();ctx.moveTo((s.a.x+.5)*cw,(s.a.y+.5)*ch);ctx.lineTo((s.b.x+.5)*cw,(s.b.y+.5)*ch);ctx.stroke()}players.forEach((p,i)=>{if(!p||p.alive===false)return;const x=(p.x+.5)*cw,y=(p.y+.5)*ch;ctx.fillStyle=colors[i%4];ctx.beginPath();ctx.arc(x,y,Math.min(cw,ch)*.17,0,7);ctx.fill();if(i===me){ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,Math.min(cw,ch)*.21,0,7);ctx.stroke()}})}
function resize(){const r=Math.min(innerWidth/canvas.width,innerHeight/canvas.height);canvas.style.width=canvas.width*r+'px';canvas.style.height=canvas.height*r+'px';draw()}addEventListener('resize',resize);resize();
function direction(dx,dy){if(!running)return;if(solo){if(turn!==0||botBusy)return;soloMove(0,dx,dy);return}if(turn!==me){msg('Сейчас ходит '+(players[turn]?.name||'другой игрок'));return}send({type:'move',dx,dy})}
const keys={};addEventListener('keydown',e=>{if(keys[e.key])return;keys[e.key]=1;const k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')direction(0,-1);if(k==='s'||e.key==='ArrowDown')direction(0,1);if(k==='a'||e.key==='ArrowLeft')direction(-1,0);if(k==='d'||e.key==='ArrowRight')direction(1,0)});addEventListener('keyup',e=>keys[e.key]=0);document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const d=b.dataset.dir;direction(d==='left'?-1:d==='right'?1:0,d==='up'?-1:d==='down'?1:0)}));
function used(x,y,ignore){return x<0||x>=grid.cols||y<0||y>=grid.rows||players.some((p,i)=>i!==ignore&&p?.alive&&p.x===x&&p.y===y)||segments.some(s=>s.b.x===x&&s.b.y===y)}
function soloMove(i,dx,dy){const p=players[i];if(!p||!p.alive||(!dx&&!dy))return;if(dx===-p.dir.x&&dy===-p.dir.y){msg('Нельзя развернуться назад');return}const nx=p.x+dx,ny=p.y+dy;if(nx===target.x&&ny===target.y){finishSolo(i);return}if(used(nx,ny,i)){p.alive=false;finishSolo(i===0?1:0);return}segments.push({p:i,a:{x:p.x,y:p.y},b:{x:nx,y:ny}});p.x=nx;p.y=ny;p.dir={x:dx,y:dy};turn=i===0?1:0;draw();updateHud()}
function botChoose(){const b=players[1],dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!(d.x===-b.dir.x&&d.y===-b.dir.y));let best=null,bs=-1e9;for(const d of dirs){const x=b.x+d.x,y=b.y+d.y;if(used(x,y,1))continue;let s=-(Math.abs(x-target.x)+Math.abs(y-target.y))*2+Math.random()*1.5;for(const q of dirs)if(!used(x+q.x,y+q.y,1))s+=.3;if(s>bs){bs=s;best=d}}return best}
function botTurn(){if(!solo||!running||turn!==1||botBusy)return;botBusy=true;botTimer=setTimeout(()=>{botBusy=false;const d=botChoose();if(d)soloMove(1,d.x,d.y);else finishSolo(0)},420)}
function finishSolo(w){running=false;clearTimeout(botTimer);if(w===0)scores[0]++;document.getElementById('scoreHud').textContent='Победы: '+scores[0];msg(w===0?'ПОБЕДА! 🎉':w===1?'Бот победил 🤖':'Ничья!',1400);setTimeout(startSolo,1600)}
function startSolo(){clearTimeout(botTimer);solo=true;running=true;me=0;segments=[];turn=0;players=[{x:5,y:1,dir:{x:0,y:1},alive:true,name:document.getElementById('nick').value.trim()||'Игрок'},{x:5,y:13,dir:{x:0,y:-1},alive:true,name:'Бот'}];show(menu,false);show(lobby,false);show(hud,true);draw();updateHud();msg('Твой ход — сделай один ход',1100)}
function refreshRooms(){fetch('/rooms',{cache:'no-store'}).then(r=>r.json()).then(d=>{const e=document.getElementById('rooms');e.innerHTML=d.rooms.length?d.rooms.map(r=>`<div class="room"><div><b>${esc(r.name)}</b><br><small>${r.players}/${r.maxPlayers}</small></div><button class="btn" onclick="joinRoom('${r.code}')">Войти</button></div>`).join(''):'<div class="sub">Пока нет открытых комнат.</div>'}).catch(()=>{})}window.joinRoom=code=>{socket();const name=document.getElementById('nick').value.trim()||'Игрок';setTimeout(()=>send({type:'join',room:code,name}),150)};document.querySelectorAll('.count').forEach(b=>b.onclick=()=>{document.querySelectorAll('.count').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.selected=+b.dataset.n});window.selected=4;document.getElementById('create').onclick=()=>{socket();const name=document.getElementById('nick').value.trim()||'Игрок',rn=document.getElementById('roomName').value.trim()||'Неоновая арена';setTimeout(()=>send({type:'create',name,roomName:rn,maxPlayers:window.selected}),150)};document.getElementById('quick').onclick=()=>fetch('/rooms',{cache:'no-store'}).then(r=>r.json()).then(d=>{const x=d.rooms.find(x=>x.players<x.maxPlayers);x?joinRoom(x.code):document.getElementById('create').click()});document.getElementById('refresh').onclick=refreshRooms;document.getElementById('start').onclick=()=>send({type:'start'});document.getElementById('leave').onclick=()=>location.reload();document.getElementById('bot').onclick=startSolo;socket();refreshRooms();
const oldSoloMove=soloMove;soloMove=function(i,dx,dy){oldSoloMove(i,dx,dy);if(solo&&running&&turn===1)botTurn()};
</script></body></html>
