<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA — Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:system-ui,Arial}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:10px;gap:8px}.panel{background:#0b1020e8;border:1px solid #35416b;border-radius:14px;padding:10px 12px}.lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);text-align:center;pointer-events:auto}h1{margin:0 0 6px;font-size:36px}p{color:#b5bfdc;line-height:1.4}.code{font-size:28px;letter-spacing:5px;color:#8efcff;font-weight:900;margin:10px}button{border:0;border-radius:12px;padding:13px 16px;margin:5px;background:#6d5dfc;color:white;font-weight:800;font-size:16px}button.secondary{background:#202943}input{width:100%;padding:13px;border-radius:12px;border:1px solid #3a466d;background:#0e1426;color:white;font-size:18px;text-align:center;letter-spacing:3px}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.stick{width:145px;height:145px;border-radius:50%;background:#2a365b66;border:1px solid #52618c;pointer-events:auto;touch-action:none;position:relative}.knob{width:62px;height:62px;border-radius:50%;background:#6d5dfc;position:absolute;left:41px;top:41px}.fire{width:92px;height:92px;border-radius:50%;background:#ff477e;border:1px solid #ff9ab5;pointer-events:auto;touch-action:none}.hidden{display:none!important}.small{font-size:13px;color:#9ca9d0}.ok{color:#8efcff}</style></head>
<body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="panel" id="status">Главное меню</div><div class="panel" id="score">Ты: 0 | Соперник: 0</div></div>
<div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><p>Онлайн-версия: <b>одна ссылка</b> для обоих игроков. VPN и сервер устанавливать не нужно.</p><button id="create">Создать игру</button><div id="host" class="hidden"><div class="small">Передай сопернику код комнаты:</div><div id="code" class="code">------</div><button id="copy" class="secondary">Скопировать код</button><div id="wait" class="small">Ожидание второго игрока…</div></div><hr style="border-color:#26304d;border-width:1px 0 0"><input id="room" maxlength="8" placeholder="КОД КОМНАТЫ"><button id="join">Подключиться</button><div id="msg" class="small"></div></div>
<div id="controls" class="hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="fire" class="fire">ОГОНЬ</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),score=document.getElementById('score'),lobby=document.getElementById('lobby'),controls=document.getElementById('controls'),msg=document.getElementById('msg');let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const WORLD={w:1000,h:700},S={peer:null,conn:null,host:false,started:false,me:0,players:[{x:250,y:350,hp:100,score:0},{x:750,y:350,hp:100,score:0}],bullets:[],keys:{},joy:{x:0,y:0},last:0};
const $=id=>document.getElementById(id),setStatus=t=>status.textContent=t;function code(){return 'NEON-'+Math.random().toString(36).slice(2,8).toUpperCase()}function showGame(){lobby.classList.add('hidden');controls.classList.remove('hidden');S.started=true;setStatus('Игра идёт')}function err(t){msg.textContent=t;setStatus('Ошибка')}
function makePeer(id,onReady){msg.textContent='Подключение к бесплатному PeerJS-сигналу…';S.peer=new Peer(id,{host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0});S.peer.on('open',pid=>onReady(pid));S.peer.on('error',e=>{console.log(e);err('Не удалось подключиться. Попробуй ещё раз.')});S.peer.on('disconnected',()=>{try{S.peer.reconnect()}catch{}})}
$('create').onclick=()=>{if(S.peer)return;S.host=true;const id=code();makePeer(id,pid=>{S.me=0;$('host').classList.remove('hidden');$('code').textContent=pid;$('create').classList.add('hidden');setStatus('Комната создана');msg.textContent='';S.peer.on('connection',conn=>{if(S.conn)return;S.conn=conn;S.me=0;conn.on('open',()=>{conn.send({type:'start'});showGame();});conn.on('data',onData);conn.on('close',()=>{S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');$('wait').textContent='Соперник отключился. Можно ждать нового игрока.';S.conn=null});});});};
$('join').onclick=()=>{if(S.peer)return;let id=$('room').value.trim().toUpperCase();if(!id){err('Введи код комнаты');return}S.host=false;makePeer('guest-'+Math.random().toString(36).slice(2,9),()=>{S.conn=S.peer.connect(id,{reliable:true});S.conn.on('open',()=>{S.me=1;setStatus('Подключено, ждём старт…');msg.textContent='';S.conn.send({type:'ready'})});S.conn.on('data',onData);S.conn.on('close',()=>stop('Соединение потеряно'));});};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);$('wait').textContent='Код скопирован! Отправь его второму игроку.'}catch{$('wait').textContent='Код: '+$('code').textContent}};
function onData(d){if(!d)return;if(d.type==='start'){S.me=1;showGame();return}if(d.type==='input'&&S.host){S.remote={x:d.x||0,y:d.y||0};return}if(d.type==='shoot'&&S.host){shoot(1);return}if(d.type==='snap'&&!S.host){S.players=d.players;S.bullets=d.bullets;S.me=1;return}}
function stop(t){S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');setStatus(t);if(S.conn)try{S.conn.close()}catch{}}
function vec(i){if(i===0)return {x:((S.keys.d||S.keys.arrowright)?1:0)-((S.keys.a||S.keys.arrowleft)?1:0)+S.joy.x,y:((S.keys.s||S.keys.arrowdown)?1:0)-((S.keys.w||S.keys.arrowup)?1:0)+S.joy.y};return S.remote||{x:0,y:0}}
function shoot(owner){let p=S.players[owner],ang=owner===0?0:Math.PI;S.bullets.push({x:p.x+(owner? -20:20),y:p.y,vx:Math.cos(ang)*8,vy:Math.sin(ang),owner})}
function hostTick(){for(let i=0;i<2;i++){let v=vec(i),l=Math.hypot(v.x,v.y)||1;if(l>1){v.x/=l;v.y/=l}S.players[i].x=Math.max(25,Math.min(WORLD.w-25,S.players[i].x+v.x*4));S.players[i].y=Math.max(25,Math.min(WORLD.h-25,S.players[i].y+v.y*4))}for(let b of S.bullets){b.x+=b.vx;b.y+=b.vy}S.bullets=S.bullets.filter(b=>b.x>-20&&b.x<WORLD.w+20&&b.y>-20&&b.y<WORLD.h+20);for(let b of S.bullets){let t=S.players[1-b.owner];if(Math.hypot(b.x-t.x,b.y-t.y)<25){t.hp-=25;b.x=99999;if(t.hp<=0){S.players[b.owner].score++;S.players[0].hp=S.players[1].hp=100;S.players[0].x=250;S.players[1].x=750;S.bullets=[]}}}if(S.conn?.open)S.conn.send({type:'snap',players:S.players,bullets:S.bullets})}
function inputSend(t){if(!S.started||S.host||!S.conn?.open||t-S.last<40)return;S.last=t;let v=vec(0);S.conn.send({type:'input',x:v.x,y:v.y})}
addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();if(S.host)shoot(0);else if(S.conn?.open)S.conn.send({type:'shoot'})}});addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);$('fire').onpointerdown=e=>{e.preventDefault();if(S.host)shoot(0);else if(S.conn?.open)S.conn.send({type:'shoot'})};
let jp=null;function jm(e){let r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=52,l=Math.hypot(dx,dy)||1,x=Math.min(m,dx/l*m),y=Math.min(m,dy/l*m);S.joy.x=x/m;S.joy.y=y/m;$('knob').style.left=41+x+'px';$('knob').style.top=41+y+'px'}$('stick').onpointerdown=e=>{jp=e.pointerId;$('stick').setPointerCapture(jp);jm(e)};$('stick').onpointermove=e=>{if(e.pointerId===jp)jm(e)};$('stick').onpointerup=$('stick').onpointercancel=e=>{if(e.pointerId===jp){jp=null;S.joy.x=S.joy.y=0;$('knob').style.left='41px';$('knob').style.top='41px'}};
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080b16';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(100,120,190,.10)';for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}let sx=W/WORLD.w,sy=H/WORLD.h;for(let b of S.bullets){ctx.fillStyle=b.owner===S.me?'#8efcff':'#ff5b8a';ctx.beginPath();ctx.arc(b.x*sx,b.y*sy,5,0,7);ctx.fill()}for(let i=0;i<2;i++){let p=S.players[i],x=p.x*sx,y=p.y*sy,c=i===S.me?'#55e7ff':'#ff5b8a';ctx.shadowBlur=20;ctx.shadowColor=c;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,20*Math.min(sx,sy),0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#11162a';ctx.beginPath();ctx.arc(x,y,12*Math.min(sx,sy),0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(i===S.me?'Ты':'Соперник',x,y+4);ctx.fillStyle='#222';ctx.fillRect(x-25,y-34,50,5);ctx.fillStyle=c;ctx.fillRect(x-25,y-34,50*Math.max(0,p.hp)/100,5)}score.textContent=`Ты: ${S.players[S.me].score} | Соперник: ${S.players[1-S.me].score}`}
function loop(t){if(S.host&&S.started&&t-(S.lt||0)>45){S.lt=t;hostTick()}inputSend(t);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
