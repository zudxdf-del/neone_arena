<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:system-ui,Arial}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:10px;gap:8px}.panel{background:#0b1020ed;border:1px solid #35416b;border-radius:14px;padding:10px 12px}.lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,460px);max-height:90vh;overflow:auto;text-align:center;pointer-events:auto}h1{margin:0 0 6px;font-size:36px}.sub{color:#b5bfdc;line-height:1.4;margin:8px 0 14px}button{border:0;border-radius:12px;padding:13px 16px;margin:5px;background:#6d5dfc;color:#fff;font-weight:800;font-size:16px;width:calc(100% - 10px)}button.secondary{background:#202943}input{width:calc(100% - 10px);padding:13px;border-radius:12px;border:1px solid #3a466d;background:#0e1426;color:#fff;font-size:18px;text-align:center;margin:4px 5px}.hidden{display:none!important}.small{font-size:13px;color:#9ca9d0}.rooms{margin-top:8px;text-align:left}.room{display:flex;align-items:center;gap:10px;background:#11182b;border:1px solid #35416b;border-radius:12px;padding:11px;margin:7px 0;cursor:pointer}.room:hover{border-color:#6d5dfc}.icon{font-size:25px;width:30px;text-align:center}.roominfo{flex:1;min-width:0}.roomname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roommeta{font-size:12px;color:#9ca9d0;margin-top:2px}.room button{width:auto;margin:0;padding:9px 12px;font-size:13px}.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,400px);pointer-events:auto;z-index:5}.check{display:flex;align-items:center;gap:8px;text-align:left;margin:8px 5px;color:#cbd4ef}.check input{width:20px;margin:0}.locked{color:#ffb4c9}.open{color:#8efcff}#roomRefresh{background:#202943}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.stick{width:145px;height:145px;border-radius:50%;background:#2a365b66;border:1px solid #52618c;pointer-events:auto;touch-action:none;position:relative}.knob{width:62px;height:62px;border-radius:50%;background:#6d5dfc;position:absolute;left:41px;top:41px}.fire{width:92px;height:92px;border-radius:50%;background:#ff477e;border:1px solid #ff9ab5;pointer-events:auto;touch-action:none}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="panel" id="status">Готово</div><div class="panel" id="score">Ты: 0 | Соперник: 0</div></div><div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><div class="sub"><b>Мультиплеер через интернет</b><br>Игроки могут находиться в разных сетях.</div><input id="name" maxlength="20" placeholder="Твоё имя" value="Игрок"><button id="create">🎮 СОЗДАТЬ ИГРУ</button><button id="join">🔎 ВОЙТИ В ИГРУ</button><div id="msg" class="small"></div></div><div id="modal" class="panel modal hidden"><h2 id="modalTitle">Создать игру</h2><div id="createFields"><input id="roomName" maxlength="30" placeholder="Название комнаты" value="Неоновая арена"><label class="check"><input type="checkbox" id="usePass"> 🔒 Сделать комнату по паролю</label><input id="roomPass" class="hidden" maxlength="40" placeholder="Пароль комнаты"></div><div id="joinFields" class="hidden"><button id="roomRefresh" class="secondary">🔄 ОБНОВИТЬ КОМНАТЫ</button><div id="rooms" class="rooms"><div class="small">Загрузка комнат…</div></div></div><button id="modalAction">СОЗДАТЬ</button><button id="modalClose" class="secondary">НАЗАД</button><div id="modalMsg" class="small"></div></div><div id="controls" class="hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="fire" class="fire">ОГОНЬ</button></div></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),score=document.getElementById('score'),lobby=document.getElementById('lobby'),controls=document.getElementById('controls'),msg=document.getElementById('msg'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modalTitle'),roomsEl=document.getElementById('rooms'),modalMsg=document.getElementById('modalMsg');let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const WORLD={w:1000,h:700};const S={ws:null,me:0,started:false,players:[{x:250,y:350,hp:100,score:0,name:'Игрок 1'},{x:750,y:350,hp:100,score:0,name:'Игрок 2'}],bullets:[],keys:{},joy:{x:0,y:0}};let roomTimer=null;const $=id=>document.getElementById(id);const setStatus=t=>status.textContent=t;function playerName(){return ($('name').value.trim()||'Игрок').slice(0,20)}function showError(t){modalMsg.textContent=t;msg.textContent=t;setStatus('Ошибка')}
function openCreate(){stopRoomRefresh();modalTitle.textContent='Создать игру';$('createFields').classList.remove('hidden');$('joinFields').classList.add('hidden');$('modalAction').textContent='СОЗДАТЬ';$('modalAction').classList.remove('hidden');modalMsg.textContent='';modal.classList.remove('hidden')}function openJoin(){modalTitle.textContent='Выбери комнату';$('createFields').classList.add('hidden');$('joinFields').classList.remove('hidden');$('modalAction').classList.add('hidden');modalMsg.textContent='';modal.classList.remove('hidden');loadRooms();startRoomRefresh()}function closeModal(){stopRoomRefresh();modal.classList.add('hidden')}
$('create').onclick=openCreate;$('join').onclick=openJoin;$('modalClose').onclick=closeModal;$('roomRefresh').onclick=loadRooms;$('usePass').onchange=()=>{ $('roomPass').classList.toggle('hidden',!$('usePass').checked);if(!$('usePass').checked)$('roomPass').value=''};
async function loadRooms(){if(modal.classList.contains('hidden')||$('joinFields').classList.contains('hidden'))return;roomsEl.innerHTML='<div class="small">🔄 Обновляем список комнат…</div>';try{const r=await fetch('/rooms?x='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.rooms.length){roomsEl.innerHTML='<div class="small">Сейчас нет созданных комнат.<br>Создай игру первым.</div>';return}roomsEl.innerHTML=d.rooms.map(r=>`<div class="room"><div class="icon ${r.locked?'locked':'open'}">${r.locked?'🔒':'🌐'}</div><div class="roominfo"><div class="roomname">${esc(r.name)}</div><div class="roommeta">${esc(r.host)} · ${r.players}/${r.maxPlayers} игрока · ${r.locked?'по паролю':'открытая'}</div></div><button onclick="chooseRoom('${r.code}','${escAttr(r.name)}',${r.locked})">ВОЙТИ</button></div>`).join('')}catch(e){roomsEl.innerHTML='<div class="small">Не удалось загрузить список комнат.</div>'}}
function startRoomRefresh(){stopRoomRefresh();roomTimer=setInterval(loadRooms,3000)}function stopRoomRefresh(){if(roomTimer){clearInterval(roomTimer);roomTimer=null}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
let selectedRoom=null;window.chooseRoom=(code,name,locked)=>{selectedRoom={code,name,locked};if(locked){const p=prompt('Введите пароль комнаты «'+name+'»:');if(p===null)return;stopRoomRefresh();connect('join',code,p)}else{stopRoomRefresh();connect('join',code,'')}};
$('modalAction').onclick=()=>connect('create','', $('usePass').checked?$('roomPass').value:'', $('roomName').value);
function connect(action,roomCode='',password='',roomName=''){if(S.ws&&S.ws.readyState===1){S.ws.send(JSON.stringify({type:action,name:playerName(),room:roomCode,password,roomName}));closeModal();return}if(S.ws&&S.ws.readyState===0)return;const url=(location.protocol==='https:'?'wss://':'ws://')+location.host;try{S.ws=new WebSocket(url)}catch(e){showError('Не удалось открыть соединение');return}S.ws.onopen=()=>{S.ws.send(JSON.stringify({type:action,name:playerName(),room:roomCode,password,roomName}));setStatus(action==='create'?'Создание комнаты…':'Подключение к комнате…')};S.ws.onmessage=e=>{try{onData(JSON.parse(e.data))}catch(_){}};S.ws.onclose=()=>{if(S.started)stop('Сервер отключён')};S.ws.onerror=()=>showError('Не удалось подключиться к серверу')}
function onData(d){if(d.type==='created'){S.me=d.player??0;msg.textContent='Комната «'+(d.roomName||'')+'» создана. Ждём игрока…';setStatus('Ожидание игрока');closeModal();return}if(d.type==='password_required'){const p=prompt('Комната «'+d.roomName+'» защищена паролем:');if(p===null)return;connect('join',d.room,p);return}if(d.type==='start'){S.me=d.player??0;if(d.players){S.players[0].name=d.players[0]?.name||S.players[0].name;S.players[1].name=d.players[1]?.name||S.players[1].name}showGame();return}if(d.type==='snapshot'){S.players=d.players;S.bullets=d.bullets;return}if(d.type==='round'){msg.textContent='Раунд завершён. Создай новую комнату или войди в другую.';setTimeout(()=>stop('Игра завершена'),1200);return}if(d.type==='opponent_left'){stop('Соперник отключился');return}if(d.type==='error'){showError(d.message||'Ошибка');if(S.ws){try{S.ws.close()}catch(_){}}}}
function showGame(){stopRoomRefresh();lobby.classList.add('hidden');modal.classList.add('hidden');controls.classList.remove('hidden');S.started=true;setStatus('Игра идёт')}function stop(t){stopRoomRefresh();S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');modal.classList.add('hidden');setStatus(t);if(S.ws){try{S.ws.close()}catch(_){}}S.ws=null}
addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();send({type:'shoot'})}});addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);$('fire').onpointerdown=e=>{e.preventDefault();send({type:'shoot'})};let jp=null;function jm(e){let r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=52,l=Math.hypot(dx,dy)||1,x=Math.min(m,dx/l*m),y=Math.min(m,dy/l*m);S.joy.x=x/m;S.joy.y=y/m;$('knob').style.left=41+x+'px';$('knob').style.top=41+y+'px'}$('stick').onpointerdown=e=>{jp=e.pointerId;$('stick').setPointerCapture(jp);jm(e)};$('stick').onpointermove=e=>{if(e.pointerId===jp)jm(e)};$('stick').onpointerup=$('stick').onpointercancel=e=>{if(e.pointerId===jp){jp=null;S.joy.x=S.joy.y=0;$('knob').style.left='41px';$('knob').style.top='41px'}};
setInterval(()=>{if(S.started){let x=((S.keys.d||S.keys.arrowright)?1:0)-((S.keys.a||S.keys.arrowleft)?1:0)+S.joy.x,y=((S.keys.s||S.keys.arrowdown)?1:0)-((S.keys.w||S.keys.arrowup)?1:0)+S.joy.y;send({type:'input',x,y})}},40);function send(d){if(S.ws?.readyState===1)S.ws.send(JSON.stringify(d))}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080b16';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(100,120,190,.10)';for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}let sx=W/WORLD.w,sy=H/WORLD.h;for(let b of S.bullets){ctx.fillStyle=b.owner===S.me?'#8efcff':'#ff5b8a';ctx.beginPath();ctx.arc(b.x*sx,b.y*sy,5,0,7);ctx.fill()}for(let i=0;i<2;i++){let p=S.players[i],x=p.x*sx,y=p.y*sy,c=i===S.me?'#55e7ff':'#ff5b8a';ctx.shadowBlur=20;ctx.shadowColor=c;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,20*Math.min(sx,sy),0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#11162a';ctx.beginPath();ctx.arc(x,y,12*Math.min(sx,sy),0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(p.name|| (i===S.me?'Ты':'Соперник'),x,y+4);ctx.fillStyle='#222';ctx.fillRect(x-25,y-34,50,5);ctx.fillStyle=c;ctx.fillRect(x-25,y-34,50*Math.max(0,p.hp)/100,5)}score.textContent=`Ты: ${S.players[S.me].score} | ${S.players[1-S.me].name||'Соперник'}: ${S.players[1-S.me].score}`}function loop(){draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
