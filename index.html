<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON LINES — 4 PLAYER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#111;font-family:Arial,system-ui,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center;background:#000}.app{width:100vw;height:100vh;display:grid;place-items:center}
canvas{display:block;max-width:100vw;max-height:100vh;background:#f8f8f7}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);z-index:10;padding:18px}.card{width:min(92vw,480px);padding:24px;border-radius:24px;background:#fff;border:2px solid #111;box-shadow:0 18px 70px rgba(0,0,0,.45);text-align:center}.hidden{display:none!important}
h1{margin:0;font-size:42px;letter-spacing:4px}.sub{color:#666;margin:8px 0 18px}.input{width:100%;padding:13px 14px;border:2px solid #222;border-radius:12px;font-size:17px;margin:5px 0;background:#fff}.btn{width:100%;padding:14px;margin:6px 0;border:2px solid #111;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.btn.alt{background:#fff;color:#111}.row{display:flex;gap:8px}.row>*{flex:1}.rooms{margin-top:12px;display:grid;gap:8px;max-height:32vh;overflow:auto;text-align:left}.room{padding:12px;border:2px solid #ddd;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.room small{color:#777}.room button{width:auto;margin:0;padding:9px 12px}.status{min-height:22px;color:#b00020;font-weight:700;margin-top:7px}.players{display:grid;gap:7px;margin:14px 0}.player{padding:11px;border:2px solid #ddd;border-radius:12px;display:flex;justify-content:space-between}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px}.hint{font-size:13px;color:#777;line-height:1.45}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:rgba(255,255,255,.88);border:2px solid #111;border-radius:11px;padding:8px 11px;font-weight:900}.centerMsg{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:rgba(255,255,255,.9);border:2px solid #111;border-radius:12px;padding:7px 12px;font-weight:900;opacity:0;transition:.2s}.centerMsg.show{opacity:1}.controls{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 14px;pointer-events:auto}.pad{width:126px;height:126px;position:relative}.pad button{position:absolute;width:42px;height:42px;border:2px solid #111;border-radius:10px;background:rgba(255,255,255,.8);font-size:20px;font-weight:900}.up{left:42px;top:0}.down{left:42px;bottom:0}.left{left:0;top:42px}.right{right:0;top:42px}.mobileOnly{display:none}
@media(max-width:700px){.mobileOnly{display:block}.card{padding:19px}h1{font-size:32px}.hint.desktop{display:none}}
</style>
</head>
<body>
<div class="app"><canvas id="game" width="1000" height="700"></canvas></div>
<div id="menu" class="screen"><div class="card">
<h1>NEON LINES</h1><div class="sub">4-PLAYER ONLINE · как в ролике</div>
<input id="nick" class="input" maxlength="18" value="Игрок" placeholder="Твоё имя">
<input id="roomName" class="input" maxlength="26" value="Неоновая арена" placeholder="Название комнаты">
<div class="row"><button class="btn count" data-n="2">2 игрока</button><button class="btn count active" data-n="4">4 игрока</button></div>
<button id="create" class="btn">СОЗДАТЬ КОМНАТУ</button>
<div class="row"><button id="refresh" class="btn alt">↻ Обновить</button><button id="quick" class="btn alt">Быстрая игра</button></div>
<div class="rooms" id="rooms"><div class="sub">Загрузка комнат…</div></div><div id="status" class="status"></div>
<div class="hint desktop">WASD / стрелки — движение. На телефоне — кнопки снизу.<br>Первый игрок запускает раунд, остальные подключаются по коду.</div>
</div></div>
<div id="lobby" class="screen hidden"><div class="card"><h2>ЛОББИ</h2><div id="lobbyTitle" class="sub"></div><div id="code" style="font-size:34px;font-weight:900;letter-spacing:6px">------</div><div id="playerList" class="players"></div><button id="start" class="btn">НАЧАТЬ РАУНД</button><button id="leave" class="btn alt">ВЫЙТИ</button><div id="lobbyStatus" class="status"></div></div></div>
<div id="hud" class="hidden"><div class="top"><div id="playersHud" class="pill">0 / 4</div><div id="scoreHud" class="pill">Победы: 0</div></div><div id="message" class="centerMsg"></div><div class="controls mobileOnly"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const menu=document.getElementById('menu'),lobby=document.getElementById('lobby'),hud=document.getElementById('hud');
const colors=['#1687ff','#18ad67','#e33b4f','#e2aa08'];let ws=null,me=-1,roomCode='',running=false,players=[],segments=[],target={x:5,y:7},grid={cols:11,rows:15};let scores=[0,0,0,0],lastState=0;
function show(el,on){el.classList.toggle('hidden',!on)}
function setStatus(s){document.getElementById('status').textContent=s||''}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function socket(){if(ws&&ws.readyState<=1)return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>setStatus('Соединение установлено');ws.onclose=()=>{running=false;setStatus('Соединение потеряно. Обнови страницу.')};ws.onerror=()=>setStatus('Не удалось подключиться к серверу');ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)}}
function handle(m){
 if(m.type==='hello')return;
 if(m.type==='error'){setStatus(m.message);document.getElementById('lobbyStatus').textContent=m.message;return}
 if(m.type==='created'){roomCode=m.room;me=m.player;show(menu,false);show(lobby,true);document.getElementById('code').textContent=roomCode;return}
 if(m.type==='lobby'){roomCode=m.room;document.getElementById('code').textContent=m.room;document.getElementById('lobbyTitle').textContent=m.roomName+' · '+m.players.filter(Boolean).length+' / '+m.maxPlayers;document.getElementById('playerList').innerHTML=m.players.map((p,i)=>p?`<div class="player"><span><i class="dot" style="background:${colors[i]}"></i>${escapeHtml(p.name)} ${p.host?'★':''}</span><b>${i===me?'ты':''}</b></div>`:'<div class="player" style="opacity:.35">свободное место</div>').join('');return}
 if(m.type==='start'){me=m.player;running=true;players=m.players||[];show(menu,false);show(lobby,false);show(hud,true);document.getElementById('playersHud').textContent=(players.filter(Boolean).length)+' / '+players.length;draw();return}
 if(m.type==='snapshot'){players=m.players||[];segments=m.segments||[];target=m.target||target;lastState=performance.now();draw();return}
 if(m.type==='round'){scores=m.scores||scores;showMessage((m.winner===me?'Ты дошёл первым!':'Победитель: '+(players[m.winner]?.name||'Игрок')),1800);document.getElementById('scoreHud').textContent='Победы: '+(scores[me]||0);return}
 if(m.type==='opponent_left'){showMessage('Игрок вышел',1200)}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMessage(t,ms=1000){const el=document.getElementById('message');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),ms)}
function cellSize(){return {w:canvas.width/grid.cols,h:canvas.height/grid.rows}}
function draw(){const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafafa';ctx.fillRect(0,0,W,H);const c=cellSize();
 ctx.strokeStyle='rgba(80,80,80,.22)';ctx.lineWidth=1;for(let x=0;x<=grid.cols;x++){ctx.beginPath();ctx.moveTo(x*c.w,0);ctx.lineTo(x*c.w,H);ctx.stroke()}for(let y=0;y<=grid.rows;y++){ctx.beginPath();ctx.moveTo(0,y*c.h);ctx.lineTo(W,y*c.h);ctx.stroke()}
 ctx.lineWidth=8;ctx.strokeStyle=colors[1];ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(5,H-5);ctx.stroke();ctx.strokeStyle=colors[0];ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(W-5,5);ctx.stroke();ctx.strokeStyle=colors[2];ctx.beginPath();ctx.moveTo(W-5,5);ctx.lineTo(W-5,H-5);ctx.stroke();ctx.strokeStyle=colors[3];ctx.beginPath();ctx.moveTo(5,H-5);ctx.lineTo(W-5,H-5);ctx.stroke();
 const tx=(target.x+.5)*c.w,ty=(target.y+.5)*c.h;ctx.strokeStyle='#e2aa08';ctx.lineWidth=5;ctx.beginPath();roundRect(ctx,tx-c.w*.27,ty-c.h*.27,c.w*.54,c.h*.54,10);ctx.stroke();ctx.fillStyle='rgba(226,170,8,.08)';ctx.fill();
 for(const s of segments){const a=s.a,b=s.b;const x1=(a.x+.5)*c.w,y1=(a.y+.5)*c.h,x2=(b.x+.5)*c.w,y2=(b.y+.5)*c.h;ctx.strokeStyle=colors[s.p%4];ctx.lineWidth=Math.max(7,Math.min(c.w,c.h)*.13);ctx.lineCap='round';ctx.shadowColor=colors[s.p%4];ctx.shadowBlur=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.shadowBlur=0}
 players.forEach((p,i)=>{if(!p)return;const x=(p.x+.5)*c.w,y=(p.y+.5)*c.h;ctx.fillStyle=colors[i%4];ctx.shadowColor=colors[i%4];ctx.shadowBlur=13;ctx.beginPath();ctx.arc(x,y,Math.min(c.w,c.h)*.17,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(x-c.w*.045,y-c.h*.045,Math.min(c.w,c.h)*.055,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(i===me){ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,Math.min(c.w,c.h)*.21,0,Math.PI*2);ctx.stroke()}});
 if(!running)return;requestAnimationFrame(()=>{if(performance.now()-lastState>120)draw()})}
function roundRect(c,x,y,w,h,r){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r)}
function direction(dx,dy){send({type:'direction',dx,dy})}
const keys={};addEventListener('keydown',e=>{if(keys[e.key])return;keys[e.key]=1;const k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')direction(0,-1);if(k==='s'||e.key==='ArrowDown')direction(0,1);if(k==='a'||e.key==='ArrowLeft')direction(-1,0);if(k==='d'||e.key==='ArrowRight')direction(1,0)});addEventListener('keyup',e=>keys[e.key]=0);
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const d=b.dataset.dir;direction(d==='up'?0:d==='down'?0:d==='left'?-1:1,d==='up'?-1:d==='down'?1:0)}));
function refreshRooms(){fetch('/rooms',{cache:'no-store'}).then(r=>r.json()).then(d=>{const el=document.getElementById('rooms');if(!d.rooms.length){el.innerHTML='<div class="sub">Пока нет открытых комнат — создай первую.</div>';return}el.innerHTML=d.rooms.map(r=>`<div class="room"><div><b>${escapeHtml(r.name)}</b><br><small>${r.players}/${r.maxPlayers}</small></div><button class="btn" onclick="joinRoom('${r.code}')">Войти</button></div>`).join('')}).catch(()=>setStatus('Не удалось загрузить список комнат'))}
window.joinRoom=(code)=>{const name=document.getElementById('nick').value.trim()||'Игрок';socket();setTimeout(()=>send({type:'join',room:code,name}),150)};
document.querySelectorAll('.count').forEach(b=>b.onclick=()=>{document.querySelectorAll('.count').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.selected=Number(b.dataset.n)});window.selected=4;
document.getElementById('create').onclick=()=>{socket();const name=document.getElementById('nick').value.trim()||'Игрок';const rn=document.getElementById('roomName').value.trim()||'Неоновая арена';setTimeout(()=>send({type:'create',name,roomName:rn,maxPlayers:window.selected}),150)};
document.getElementById('quick').onclick=()=>{fetch('/rooms',{cache:'no-store'}).then(r=>r.json()).then(d=>{const r=d.rooms.find(x=>x.players<x.maxPlayers);if(r)joinRoom(r.code);else document.getElementById('create').click()})};
document.getElementById('refresh').onclick=refreshRooms;document.getElementById('start').onclick=()=>send({type:'start'});document.getElementById('leave').onclick=()=>location.reload();
function resize(){const ratio=Math.min(innerWidth/canvas.width,innerHeight/canvas.height);canvas.style.width=(canvas.width*ratio)+'px';canvas.style.height=(canvas.height*ratio)+'px';draw()}addEventListener('resize',resize);resize();socket();refreshRooms();
</script></body></html>
