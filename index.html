<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON ARENA 2.0 — LAN / Direct</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:system-ui,Arial,sans-serif}
#game{display:block;width:100vw;height:100vh;background:radial-gradient(circle at 50% 40%,#151d38,#080b16 70%)}
#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:12px}
.panel{background:rgba(10,14,30,.9);border:1px solid #34406c;border-radius:15px;padding:10px 12px;backdrop-filter:blur(8px)}
#status{font-size:14px;color:#c2ccff}#score{font-weight:800}
#lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);pointer-events:auto;text-align:center}
h1{margin:0 0 8px;font-size:38px;letter-spacing:1px}p{color:#aeb8d9;line-height:1.45}
button,input{font:inherit}button{border:0;border-radius:13px;padding:13px 16px;background:#6d5dfc;color:#fff;font-weight:800;cursor:pointer;margin:5px}
button.secondary{background:#202943}button:disabled{opacity:.5}
input{width:100%;padding:13px;border-radius:13px;border:1px solid #3a466d;background:#0e1426;color:#fff;outline:none}
.row{display:flex;gap:8px}.row>*{flex:1}#roomCode{font-size:25px;font-weight:900;letter-spacing:4px;margin:12px 0;color:#8efcff}
#roomInfo,#joinInfo{font-size:13px;color:#9ca9d0;min-height:22px}
#controls{position:fixed;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:145px;height:145px;border-radius:50%;background:rgba(42,54,91,.42);border:1px solid #47537b;pointer-events:auto;touch-action:none;position:relative}
#knob{width:62px;height:62px;border-radius:50%;background:#6d5dfc;position:absolute;left:41px;top:41px;box-shadow:0 0 25px #6d5dfc88}
#fire{width:92px;height:92px;border-radius:50%;background:#ff477e;border:1px solid #ff88a8;pointer-events:auto;touch-action:none;box-shadow:0 0 30px #ff477e66}
#fire:active{transform:scale(.95)}.hidden{display:none!important}
#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#657091;text-align:center;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="top"><div class="panel" id="status">Главное меню</div><div class="panel" id="score">Ты: 0 | Соперник: 0</div></div>
  <div id="lobby" class="panel">
    <h1>NEON ARENA 2.0</h1>
    <p><b>Как Minecraft Java:</b> один игрок запускает игру, второй подключается по адресу. В одной Wi‑Fi/хотспот-сети интернет и VPN не нужны.</p>
    <div class="panel" style="margin:10px 0;text-align:left"><b>Адрес игры</b><div id="gameAddress" style="margin-top:6px;color:#8efcff;word-break:break-all">Определяется…</div><button id="copyAddress" class="secondary" style="margin:8px 0 0 0">Скопировать адрес</button></div>
    <input id="serverInput" placeholder="Адрес сервера, например http://10.0.0.5:8080" autocomplete="off"><button id="saveServer" class="secondary">Сохранить адрес</button><br><button id="create">Создать игру</button> <button class="secondary" id="join">Подключиться</button>
    <div id="hostBox" class="hidden"><div id="roomInfo">Ожидание второго игрока…</div></div>
    <div id="joinInfo"></div>
  </div>
  <div id="controls" class="hidden"><div id="stick"><div id="knob"></div></div><button id="fire">ОГОНЬ</button></div>
  <div id="hint">На ПК: WASD / стрелки + пробел</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),lobby=document.getElementById('lobby'),controls=document.getElementById('controls');
const statusEl=document.getElementById('status'),scoreEl=document.getElementById('score'),hostBox=document.getElementById('hostBox'),roomInfo=document.getElementById('roomInfo'),joinInfo=document.getElementById('joinInfo');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const S={ws:null,host:false,started:false,room:'',me:{x:250,y:350,hp:100,score:0},enemy:{x:750,y:350,hp:100,score:0},bullets:[],keys:{},joy:{x:0,y:0},lastInput:0,world:{w:1000,h:700},connected:false};
function setStatus(t){statusEl.textContent=t}
function httpAddress(){let u=document.getElementById('serverInput').value.trim()||localStorage.getItem('neonArenaServer')||location.origin;if(/^wss?:\/\//i.test(u))u=u.replace(/^ws:/i,'http:').replace(/^wss:/i,'https:');if(!/^https?:\/\//i.test(u))u='http://'+u;return u.replace(/\/$/,'')}
function serverUrl(){let u=httpAddress();return u.replace(/^http:/i,'ws:').replace(/^https:/i,'wss:')}
function setServer(v){localStorage.setItem('neonArenaServer',v);document.getElementById('serverInput').value=v;document.getElementById('gameAddress').textContent=v}
function scaleX(x){return x*(W/S.world.w)} function scaleY(y){return y*(H/S.world.h)}
function openWS(){const url=serverUrl();try{S.ws=new WebSocket(url)}catch(e){joinInfo.textContent='Не удалось открыть соединение';return null}S.ws.onopen=()=>{S.connected=true;setStatus('Сервер подключён');joinInfo.textContent='Соединение установлено'};S.ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}handleServer(d)};S.ws.onerror=()=>{S.connected=false;setStatus('Ошибка сети');joinInfo.textContent='Сервер недоступен. Проверь адрес.'};S.ws.onclose=()=>{S.connected=false;if(S.started)stopGame('Соединение с сервером потеряно')};return S.ws}
function send(o){if(S.ws?.readyState===1)S.ws.send(JSON.stringify(o))}
function handleServer(d){if(d.type==='created'){S.host=true;S.room=d.room;hostBox.classList.remove('hidden');roomInfo.textContent='Игра создана. Ожидание второго игрока…';setStatus('Игра создана');return}if(d.type==='error'){joinInfo.textContent=d.message||'Ошибка';setStatus('Не удалось подключиться');return}if(d.type==='start'){S.room=d.room||S.room;startGame();return}if(d.type==='snapshot'){S.world=d.world||S.world;const a=d.players?.[S.host?0:1],b=d.players?.[S.host?1:0];if(a)S.me={...S.me,...a};if(b)S.enemy={...S.enemy,...b};S.bullets=d.bullets||[];return}if(d.type==='round'){S.me.score=d.scores[S.host?0:1];S.enemy.score=d.scores[S.host?1:0];setStatus(d.winner===(S.host?0:1)?'Ты выиграл раунд!':'Соперник выиграл раунд!');return}if(d.type==='opponent_left'){stopGame('Соперник отключился');if(S.host){hostBox.classList.remove('hidden');roomInfo.textContent='Соперник отключился. Ждём нового игрока…'}return}}
function startGame(){if(S.started)return;S.started=true;lobby.classList.add('hidden');controls.classList.remove('hidden');setStatus('Игра идёт')}
function stopGame(msg){S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');setStatus(msg);if(S.ws){try{S.ws.close()}catch{}}S.ws=null}
document.getElementById('create').onclick=()=>{if(S.ws?.readyState===1)return;S.host=true;joinInfo.textContent='';roomInfo.textContent='Подключение к серверу…';const ws=openWS();if(ws)ws.onopen=()=>{S.connected=true;setStatus('Создаём игру…');send({type:'create'})}};
document.getElementById('join').onclick=()=>{if(S.ws?.readyState===1){joinInfo.textContent='Уже выполняется подключение.';return}S.host=false;joinInfo.textContent='Подключение…';setStatus('Подключение к игре…');const ws=openWS();if(ws)ws.onopen=()=>{S.connected=true;setStatus('Ищем игру…');send({type:'join'})}};
document.getElementById('copyAddress').onclick=async()=>{try{await navigator.clipboard.writeText(httpAddress());joinInfo.textContent='Адрес скопирован!'}catch{joinInfo.textContent='Адрес: '+httpAddress()}};
document.getElementById('saveServer').onclick=()=>{const u=httpAddress();setServer(u);joinInfo.textContent='Адрес сервера сохранён.'};const saved=localStorage.getItem('neonArenaServer');if(saved)document.getElementById('serverInput').value=saved;document.getElementById('gameAddress').textContent=httpAddress();
function inputVector(){let x=(S.keys.d||S.keys.arrowright?1:0)-(S.keys.a||S.keys.arrowleft?1:0)+S.joy.x,y=(S.keys.s||S.keys.arrowdown?1:0)-(S.keys.w||S.keys.arrowup?1:0)+S.joy.y,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return{x,y}}
function sendInput(t){if(S.host||!S.started||S.ws?.readyState!==1)return;if(t-S.lastInput<40)return;S.lastInput=t;const v=inputVector();send({type:'input',x:v.x,y:v.y})}
function shoot(){if(!S.started)return;send({type:'shoot'})}addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let jp=null;function jm(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=52,L=Math.hypot(dx,dy)||1,x=Math.min(m,dx/L*m),y=Math.min(m,dy/L*m);S.joy.x=x/m;S.joy.y=y/m;knob.style.left=41+x+'px';knob.style.top=41+y+'px'}stick.onpointerdown=e=>{jp=e.pointerId;stick.setPointerCapture(jp);jm(e)};stick.onpointermove=e=>{if(e.pointerId===jp)jm(e)};stick.onpointerup=stick.onpointercancel=e=>{if(e.pointerId===jp){jp=null;S.joy.x=S.joy.y=0;knob.style.left='41px';knob.style.top='41px'}};document.getElementById('fire').onpointerdown=e=>{e.preventDefault();shoot()};
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function drawPlayer(p,c,label){const x=scaleX(p.x),y=scaleY(p.y),r=20*Math.min(W/S.world.w,H/S.world.h);ctx.save();ctx.shadowBlur=20;ctx.shadowColor=c;circle(x,y,r,c);ctx.shadowBlur=0;circle(x,y,r*.6,'#10162a');ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(label,x,y+4);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x-r*1.25,y-r*1.65,r*2.5,5);ctx.fillStyle=c;ctx.fillRect(x-r*1.25,y-r*1.65,r*2.5*Math.max(0,p.hp)/100,5);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(100,120,190,.10)';for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,55);ctx.lineTo(x,H);ctx.stroke()}for(let y=55;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='rgba(130,145,255,.3)';ctx.strokeRect(10,65,W-20,H-75);for(const b of S.bullets)circle(scaleX(b.x),scaleY(b.y),5,b.owner===(S.host?0:1)?'#8efcff':'#ff5b8a');if(S.started){drawPlayer(S.me,'#55e7ff','Ты');drawPlayer(S.enemy,'#ff5b8a','Соперник')}scoreEl.textContent=`Ты: ${S.me.score} | Соперник: ${S.enemy.score}`}function loop(t){sendInput(t);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
