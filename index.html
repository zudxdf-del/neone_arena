<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>QUORIDOR</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;font-family:Arial,sans-serif;touch-action:none}body{display:grid;place-items:center}canvas{background:#f8f8f8;max-width:100vw;max-height:100vh}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:10;padding:10px;overflow:auto}.card{width:min(94vw,440px);max-height:calc(100dvh - 20px);padding:16px;border:2px solid #111;border-radius:18px;background:#fff;text-align:center;overflow:auto}.hidden{display:none!important}h1{margin:0 0 4px;font-size:32px;letter-spacing:3px}.sub{color:#666;margin:4px 0 10px}.input,.btn{width:100%;padding:10px 12px;margin:3px 0;border:2px solid #111;border-radius:10px;font-size:15px}.btn{background:#111;color:#fff;font-weight:900}.btn.alt{background:#fff;color:#111}.btn:disabled{opacity:.35}.row{display:flex;gap:6px}.row>*{flex:1}.nameRow{display:flex;gap:6px}.nameRow .input{flex:1;min-width:0}.color{width:46px;flex:0 0 46px;border:2px solid #111;border-radius:10px;font-size:20px}.rooms,.players{display:grid;gap:6px;margin-top:8px}.room,.player{padding:8px;border:2px solid #ddd;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}.status{min-height:18px;color:#b00020;font-weight:700;font-size:13px}.hint{font-size:11px;color:#777}.top{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#ffffe8;border:2px solid #111;border-radius:11px;padding:8px 11px;font-weight:900}.message{position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:6;background:#fff;border:2px solid #111;border-radius:12px;padding:8px 12px;font-weight:900;display:none}.message.show{display:block}.actions{position:fixed;right:10px;bottom:10px;width:235px;z-index:7}.wallButtons{display:flex;gap:5px}.wallButtons button{margin:0;flex:1;font-size:11px;padding:9px 5px}.wallButtons #confirm{flex:0 0 48px;width:48px;height:48px;background:#20b85a;color:#fff}.wallButtons #confirm:disabled{background:#8bd6a5}.controls{position:fixed;left:10px;bottom:10px;z-index:7}.pad{width:126px;height:126px;position:relative}.pad button{position:absolute;width:42px;height:42px;border:2px solid #111;border-radius:10px;background:#fffc;font-size:20px;font-weight:900}.up{left:42px;top:0}.down{left:42px;bottom:0}.left{left:0;top:42px}.right{right:0;top:42px}@media(min-width:701px){.controls{display:none}}@media(max-width:700px){.card{padding:12px;width:96vw}.actions{width:225px}.wallButtons #confirm{width:44px;height:44px;flex-basis:44px}}</style></head><body><canvas id="game" width="900" height="900"></canvas><div id="menu" class="screen"><div class="card"><h1>QUORIDOR</h1><div class="sub">Классические правила · ONLINE + БОТ</div><div class="nameRow"><input id="nick" class="input" maxlength="18" value="Игрок" placeholder="Имя"><button id="color" class="color" type="button">●</button></div><input id="roomName" class="input" maxlength="24" value="Quoridor" placeholder="Название комнаты"><div class="row"><button class="btn count" data-n="2">2 игрока</button><button class="btn count" data-n="4">4 игрока</button></div><button id="bot" class="btn">ИГРАТЬ С БОТОМ</button><button id="create" class="btn">СОЗДАТЬ ОНЛАЙН</button><div class="row"><button id="refresh" class="btn alt">↻ Обновить</button><button id="quick" class="btn alt">Быстрая игра</button></div><div id="rooms" class="rooms"><div class="sub">Комнаты загружаются…</div></div><div id="status" class="status"></div></div></div><div id="lobby" class="screen hidden"><div class="card"><h2>КОМНАТА</h2><div id="lobbyTitle" class="sub"></div><div id="code" style="font-size:34px;font-weight:900;letter-spacing:6px">------</div><div id="players" class="players"></div><button id="start" class="btn">НАЧАТЬ</button><button id="leave" class="btn alt">ВЫЙТИ</button><div id="lobbyStatus" class="status"></div></div></div><div id="hud" class="hidden"><div class="top"><div id="turn" class="pill">Ход: —</div><div id="wallsLeft" class="pill">Стены: —</div></div><div id="message" class="message"></div><div id="actions" class="actions hidden"><div class="wallButtons"><button id="confirm" disabled>✓</button><button id="hWall">СТЕНА ↔</button><button id="vWall">СТЕНА ↕</button></div><div class="hint" style="background:#fff;padding:6px;border-radius:8px;margin-top:3px">Выбери направление и коснись линии поля</div></div><div class="controls"><div class="pad"><button class="up" data-d="0,-1">▲</button><button class="left" data-d="-1,0">◀</button><button class="right" data-d="1,0">▶</button><button class="down" data-d="0,1">▼</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),N=9,C=100,colors=['#1687ff','#e33b4f','#18ad67','#e2aa08'];let ws=null,me=-1,online=false,players=[],walls=[],turn=-1,running=false,mode=2,scores=[],solo=false,wallMode=null,pending=null,selectedCount=2;
const $=id=>document.getElementById(id),menu=$('menu'),lobby=$('lobby'),hud=$('hud'),actions=$('actions');function show(e,on){e.classList.toggle('hidden',!on)}function setStatus(t){$('status').textContent=t||''}function notice(t,ms=1000){const e=$('message');e.textContent=t;e.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>e.classList.remove('show'),ms)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function myColor(){return colors[Number(localStorage.getItem('q_color')||0)%colors.length]}function paint(){ $('color').style.background=myColor()}$('color').onclick=()=>{localStorage.setItem('q_color',(Number(localStorage.getItem('q_color')||0)+1)%colors.length);paint()};paint();
function connect(){if(ws&&(ws.readyState===0||ws.readyState===1))return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>setStatus('Онлайн соединение установлено');ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>setTimeout(connect,1200);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)}}connect();function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else setStatus('Соединение ещё устанавливается…')}
function handle(m){if(m.type==='created'){me=m.player;online=true;$('code').textContent=m.room;show(menu,false);show(lobby,true)}else if(m.type==='lobby'){mode=m.maxPlayers;$('code').textContent=m.room;$('lobbyTitle').textContent=m.name+' · '+m.players.filter(Boolean).length+' / '+m.maxPlayers;$('players').innerHTML=m.players.map((p,i)=>p?`<div class="player"><span><i class="dot" style="background:${p.color}"></i>${escapeHtml(p.name)} ${p.host?'★':''}</span><b>${i===me?'ты':''}</b></div>`:'<div class="player" style="opacity:.35">свободное место</div>').join('')}else if(m.type==='error'){setStatus(m.message);$('lobbyStatus').textContent=m.message}else if(m.type==='start'){running=true;players=m.players||[];turn=m.turn;walls=[];scores=[0,0,0,0];show(menu,false);show(lobby,false);show(hud,true);show(actions,mode===2);draw();hudUpdate()}else if(m.type==='snapshot'){if(solo)return;running=m.running;turn=m.turn;players=m.players||[];walls=m.walls||[];scores=m.scores||scores;draw();hudUpdate()}else if(m.type==='round'){running=false;scores=m.scores||scores;draw();notice(m.winner===me?'ПОБЕДА!':m.winner<0?'Ничья!':'Победил '+(players[m.winner]?.name||'игрок'),1800)}}
function hudUpdate(){const p=players[turn];$('turn').textContent='Ход: '+(p?(turn===me?'ТЫ':p.name):'—');$('wallsLeft').textContent='Стены: '+(players[me]?.walls??'—')}
function edgeBlocked(a,b,test=walls){return test.some(w=>a.x===b.x?w.o==='h'&&w.y===Math.max(a.y,b.y)&&a.x>=w.x&&a.x<w.x+2:w.o==='v'&&w.x===Math.max(a.x,b.x)&&a.y>=w.y&&a.y<w.y+2)}
function wallOverlap(o,x,y){return walls.some(w=>w.o===o&&(o==='h'?w.y===y&&Math.max(w.x,x)<Math.min(w.x+2,x+2):w.x===x&&Math.max(w.y,y)<Math.min(w.y+2,y+2)))}function wallCross(o,x,y){return walls.some(w=>w.o!==o&&(o==='h'?w.x<x+2&&w.x+1>x&&w.y===y:w.y<y+2&&w.y+1>y&&w.x===x))}function wallFits(o,x,y){return o==='h'?x>=0&&x<=7&&y>=1&&y<=8:o==='v'?x>=1&&x<=8&&y>=0&&y<=7:false}
function viewY(y){return !solo&&mode===2&&me===1?8-y:y}function pathExists(test,i){const p=players[i];if(!p)return true;const sy=(!solo&&mode===2&&me===1&&i===1)?8-p.y:p.y,q=[[p.x,sy]],seen=new Set([p.x+','+sy]);for(let h=0;h<q.length;h++){const [x,y]=q[h];if(mode===2?y===0:(i===0?y===0:i===1?y===8:i===2?x===8:x===0))return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a={x,y},b={x:x+dx,y:y+dy};if(b.x<0||b.x>=N||b.y<0||b.y>=N||edgeBlocked(a,b,test))continue;const k=b.x+','+b.y;if(!seen.has(k)){seen.add(k);q.push([b.x,b.y])}}}return false}
function validWall(o,x,y){if(!wallFits(o,x,y)||wallOverlap(o,x,y)||wallCross(o,x,y))return false;const test=walls.concat([{o,x,y}]);for(let i=0;i<mode;i++)if(!pathExists(test,i))return false;return true}
function draw(){ctx.clearRect(0,0,900,900);ctx.fillStyle='#fafafa';ctx.fillRect(0,0,900,900);ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,900);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(900,i*C);ctx.stroke()}if(mode===2){const own=me<0?0:me,opp=own===1?0:1;ctx.fillStyle=colors[own]+'18';ctx.fillRect(0,700,900,200);ctx.fillStyle=colors[opp]+'12';ctx.fillRect(0,0,900,200);ctx.lineWidth=6;ctx.strokeStyle=colors[opp];ctx.beginPath();ctx.moveTo(3,3);ctx.lineTo(897,3);ctx.stroke();ctx.strokeStyle=colors[own];ctx.beginPath();ctx.moveTo(3,897);ctx.lineTo(897,897);ctx.stroke()}else{for(let i=0;i<mode;i++){ctx.strokeStyle=colors[i];ctx.lineWidth=6;const s=i===0?[3,3,897,3]:i===1?[3,897,897,897]:i===2?[3,3,3,897]:[897,3,897,897];ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke()}}ctx.lineWidth=8;ctx.lineCap='round';for(const w of walls){ctx.strokeStyle=w.c||colors[w.p];ctx.beginPath();if(w.o==='h'){ctx.moveTo(w.x*C,w.y*C);ctx.lineTo((w.x+2)*C,w.y*C)}else{ctx.moveTo(w.x*C,w.y*C);ctx.lineTo(w.x*C,(w.y+2)*C)}ctx.stroke()}if(pending){ctx.strokeStyle=validWall(pending.o,pending.x,pending.y)?'#20b85a':'#e33b4f';ctx.beginPath();if(pending.o==='h'){ctx.moveTo(pending.x*C,pending.y*C);ctx.lineTo((pending.x+2)*C,pending.y*C)}else{ctx.moveTo(pending.x*C,pending.y*C);ctx.lineTo(pending.x*C,(pending.y+2)*C)}ctx.stroke()}players.forEach((p,i)=>{if(!p)return;ctx.fillStyle=p.color||colors[i];ctx.beginPath();ctx.arc((p.x+.5)*C,(viewY(p.y)+.5)*C,20,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#111';ctx.stroke()})}
function move(dx,dy){if(!running||turn!==me)return;if(solo){soloMove(dx,dy);return}send({type:'move',dx,dy})}
function soloMove(dx,dy){const p=players[0],a={x:p.x+dx,y:p.y+dy};if(a.x<0||a.x>=N||a.y<0||a.y>=N||edgeBlocked(p,a))return;const oi=players.findIndex((q,j)=>j&&q.x===a.x&&q.y===a.y);if(oi>=0){const b={x:a.x+dx,y:a.y+dy};if(b.x<0||b.x>=N||b.y<0||b.y>=N||edgeBlocked(a,b)||players.some((q,j)=>j&&q.x===b.x&&q.y===b.y))return;p.x=b.x;p.y=b.y}else{p.x=a.x;p.y=a.y}if(p.y===0){running=false;notice('ПОБЕДА!',1500);return}turn=1;draw();hudUpdate();setTimeout(botMove,350)}
function botMove(){if(!solo||!running)return;const p=players[1];let best=null,score=99;for(const [dx,dy] of [[0,1],[1,0],[-1,0],[0,-1]]){const a={x:p.x+dx,y:p.y+dy};if(a.x<0||a.x>=N||a.y<0||a.y>=N||edgeBlocked(p,a))continue;const old={x:p.x,y:p.y};p.x=a.x;p.y=a.y;let d=0,q=[[p.x,p.y]],seen=new Set([p.x+','+p.y]);while(q.length){const [x,y]=q.shift();if(y===8){d=seen.size;break}for(const [sx,sy] of [[1,0],[-1,0],[0,1],[0,-1]]){const b={x:x+sx,y:y+sy};if(b.x<0||b.x>=N||b.y<0||b.y>=N||edgeBlocked({x,y},b))continue;const k=b.x+','+b.y;if(!seen.has(k)){seen.add(k);q.push([b.x,b.y])}}}p.x=old.x;p.y=old.y;if(d<score){score=d;best=[dx,dy]}}if(best){p.x+=best[0];p.y+=best[1]}if(p.y===8){running=false;draw();notice('БОТ ПОБЕДИЛ',1500);return}turn=0;draw();hudUpdate()}
function startBot(){solo=true;online=false;mode=2;me=0;players=[{x:4,y:8,name:'Ты',color:myColor(),walls:10},{x:4,y:0,name:'Бот',color:colors[1],walls:10}];walls=[];turn=0;running=true;show(menu,false);show(hud,true);show(actions,true);draw();hudUpdate()}
function selectWall(o){wallMode=wallMode===o?null:o;pending=null;$('confirm').disabled=true;draw()}$('hWall').onclick=()=>selectWall('h');$('vWall').onclick=()=>selectWall('v');canvas.addEventListener('pointerdown',e=>{if(!running||!wallMode||turn!==me)return;const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)*900/r.width,py=(e.clientY-r.top)*900/r.height;let x=Math.round(px/C),y=Math.round(py/C);if(wallMode==='h'){x=Math.max(0,Math.min(7,x));y=Math.max(1,Math.min(8,y))}else{x=Math.max(1,Math.min(8,x));y=Math.max(0,Math.min(7,y))}pending={o:wallMode,x,y};$('confirm').disabled=!validWall(wallMode,x,y);draw()});$('confirm').onclick=()=>{if(!pending||!validWall(pending.o,pending.x,pending.y))return;if(solo){walls.push({...pending,p:0,c:players[0].color});players[0].walls--;turn=1;pending=null;draw();hudUpdate();setTimeout(botMove,350)}else{send({type:'wall',...pending});pending=null}$('confirm').disabled=true;draw()};
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.d.split(',').map(Number);move(dx,dy)});document.addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(d[0],d[1])}});document.querySelectorAll('.count').forEach(b=>b.onclick=()=>selectedCount=Number(b.dataset.n));$('bot').onclick=startBot;$('create').onclick=()=>send({type:'create',name:$('roomName').value,nick:$('nick').value,players:selectedCount});$('start').onclick=()=>send({type:'start'});$('leave').onclick=()=>location.reload();$('refresh').onclick=refreshRooms;$('quick').onclick=()=>send({type:'create',name:'Быстрая игра',nick:$('nick').value,players:2});async function refreshRooms(){try{const d=await fetch('/rooms',{cache:'no-store'}).then(r=>r.json());$('rooms').innerHTML=d.rooms.length?d.rooms.map(x=>`<div class="room"><span>${escapeHtml(x.name)} · ${x.players}/${x.maxPlayers}</span><button class="btn alt join" data-code="${x.code}" style="width:auto">Войти</button></div>`).join(''):'<div class="sub">Нет открытых комнат</div>';document.querySelectorAll('.join').forEach(b=>b.onclick=()=>send({type:'join',room:b.dataset.code,nick:$('nick').value}))}catch{$('rooms').innerHTML='<div class="sub">Нет соединения'}}</script></body></html>
