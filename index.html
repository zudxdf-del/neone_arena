<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON LINES</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#111;touch-action:none}body{display:grid;place-items:center}canvas{background:#fafafa;max-width:100vw;max-height:100vh}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:10;padding:10px;overflow:auto}.card{width:min(92vw,480px);max-height:calc(100dvh - 20px);padding:16px;border:2px solid #111;border-radius:20px;background:#fff;text-align:center;overflow:auto}.hidden{display:none!important}h1{margin:0;font-size:34px;letter-spacing:3px}.sub{color:#666;margin:5px 0 10px}.input,.btn{width:100%;padding:10px 12px;margin:3px 0;border:2px solid #111;border-radius:10px;font-size:15px}.btn{background:#111;color:#fff;font-weight:900}.btn.alt{background:#fff;color:#111}.btn:disabled{opacity:.35;cursor:not-allowed}.row{display:flex;gap:6px}.row>*{flex:1}.rooms{display:grid;gap:6px;max-height:18vh;overflow:auto;text-align:left}.room,.player{padding:8px;border:2px solid #ddd;border-radius:10px;display:flex;justify-content:space-between}.status{min-height:18px;color:#b00020;font-weight:700;font-size:13px}.players{display:grid;gap:6px;margin:10px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}.hint{font-size:11px;color:#777;line-height:1.3}.selected{outline:3px solid #e33b4f}.top{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#ffffe8;border:2px solid #111;border-radius:11px;padding:8px 11px;font-weight:900}.centerMsg{position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:6;background:#fff;border:2px solid #111;border-radius:12px;padding:8px 12px;font-weight:900;opacity:0;white-space:nowrap}.centerMsg.show{opacity:1}.actions{position:fixed;right:10px;bottom:10px;width:205px;z-index:7}.wallButtons{display:flex;gap:5px;align-items:center;justify-content:flex-end}.wallButtons .btn{font-size:11px;padding:9px 6px;margin:0;flex:1}.wallButtons #confirmWall{flex:0 0 48px;width:48px;height:48px;padding:4px;font-size:9px}.controls{position:fixed;bottom:10px;left:10px;z-index:7}.pad{width:126px;height:126px;position:relative}.pad button{position:absolute;width:42px;height:42px;border:2px solid #111;border-radius:10px;background:#fffc;font-size:20px;font-weight:900}.up{left:42px;top:0}.down{left:42px;bottom:0}.left{left:0;top:42px}.right{right:0;top:42px}.mobileOnly{display:none}@media(max-width:700px){.mobileOnly{display:block}.screen{padding:6px;align-items:center}.card{width:min(96vw,480px);max-height:calc(100dvh - 12px);padding:12px;border-radius:16px}h1{font-size:28px}.sub{margin:3px 0 7px}.input,.btn{padding:8px 10px;font-size:14px;margin:2px 0}.rooms{max-height:14vh}.hint{font-size:10px}.actions{width:200px}.wallButtons .btn{font-size:10px;padding:8px 4px}.wallButtons #confirmWall{width:44px;height:44px;flex-basis:44px;font-size:8px}}@media(max-height:600px){.screen{align-items:start;padding:4px}.card{max-height:calc(100dvh - 8px);padding:8px}.rooms{max-height:10vh}h1{font-size:24px}.sub{margin:2px 0 4px}.hint{font-size:9px;line-height:1.2}.input,.btn{padding:6px 8px;font-size:13px}.wallButtons .btn{padding:6px 4px;font-size:10px}.wallButtons #confirmWall{width:40px;height:40px;flex-basis:40px;font-size:8px}}</style></head><body><canvas id="game" width="1020" height="1020"></canvas><div id="menu" class="screen"><div class="card"><h1>NEON LINES</h1><div class="sub">ONLINE · ОДИНОЧНАЯ ИГРА</div><input id="nick" class="input" maxlength="18" value="Игрок" placeholder="Твоё имя"><input id="roomName" class="input" maxlength="26" value="Неоновая арена" placeholder="Название комнаты"><div class="row"><button class="btn count" data-n="2">2 игрока</button><button class="btn count selected" data-n="4">4 игрока</button></div><button id="bot" class="btn">ИГРАТЬ С БОТОМ</button><button id="create" class="btn">СОЗДАТЬ ОНЛАЙН-КОМНАТУ</button><div class="row"><button id="refresh" class="btn alt">↻ Обновить</button><button id="quick" class="btn alt">Быстрая игра</button></div><div id="rooms" class="rooms"><div class="sub">Загрузка комнат…</div></div><div id="status" class="status"></div></div></div><div id="lobby" class="screen hidden"><div class="card"><h2>ЛОББИ</h2><div id="lobbyTitle" class="sub"></div><div id="code" style="font-size:34px;font-weight:900;letter-spacing:6px">------</div><div id="playerList" class="players"></div><button id="start" class="btn">НАЧАТЬ РАУНД</button><button id="leave" class="btn alt">ВЫЙТИ</button><div id="lobbyStatus" class="status"></div></div></div><div id="hud" class="hidden"><div class="top"><div id="turnHud" class="pill">Ход: —</div><div id="scoreHud" class="pill">Победы: 0</div></div><div id="message" class="centerMsg"></div><div id="actions" class="actions hidden"><div class="wallButtons"><button id="confirmWall" class="btn" disabled>✓</button><button id="wallH" class="btn alt">СТЕНА ↔</button><button id="wallV" class="btn alt">СТЕНА ↕</button></div><div class="hint" style="background:#fff;padding:6px;border-radius:8px;margin-top:3px">Выбери стену и нажми на линию поля</div></div><div class="controls mobileOnly"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),lobby=document.getElementById('lobby'),hud=document.getElementById('hud'),actions=document.getElementById('actions'),confirmWall=document.getElementById('confirmWall');
const colors=['#1687ff','#18ad67','#e33b4f','#e2aa08'];const grid={cols:17,rows:17},target={x:8,y:8};
let ws=null,me=-1,players=[],segments=[],walls=[],turn=-1,running=false,solo=false,duel=false,botThinking=false,scores=[0,0,0,0],wallMode=null,pendingWall=null,maxWalls=16,sendQueue=[];
function show(e,on){e.classList.toggle('hidden',!on)}function msg(t,ms=900){const e=document.getElementById('message');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),ms)}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function setStatus(t){document.getElementById('status').textContent=t||''}
function socket(){if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{setStatus('Соединение установлено');const q=sendQueue.splice(0);q.forEach(o=>ws.send(JSON.stringify(o)))};ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>{if(!solo)running=false;setTimeout(()=>{if(!ws||ws.readyState===WebSocket.CLOSED)socket()},1200)};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)}}
function send(o){if(!ws||ws.readyState===WebSocket.CLOSED||ws.readyState===WebSocket.CLOSING)socket();if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o));else sendQueue.push(o)}
function handle(m){if(m.type==='created'){me=m.player;document.getElementById('code').textContent=m.room;show(menu,false);show(lobby,true)}if(m.type==='lobby'){document.getElementById('code').textContent=m.room;document.getElementById('lobbyTitle').textContent=m.roomName+' · '+m.players.filter(Boolean).length+' / '+m.maxPlayers;document.getElementById('playerList').innerHTML=m.players.map((p,i)=>p?`<div class="player"><span><i class="dot" style="background:${colors[i]}"></i>${esc(p.name)} ${p.host?'★':''}</span><b>${i===me?'ты':''}</b></div>`:'<div class="player" style="opacity:.35">свободное место</div>').join('')}if(m.type==='error'){setStatus(m.message);document.getElementById('lobbyStatus').textContent=m.message}if(m.type==='start'){solo=false;duel=m.mode==='duel';running=true;players=m.players||[];turn=m.turn??0;walls=[];segments=[];pendingWall=null;show(menu,false);show(lobby,false);show(hud,true);show(actions,duel);wallMode=null;updateWallButtons();updateConfirm();draw();updateHud()}if(m.type==='snapshot'){if(solo)return;duel=m.mode==='duel';players=m.players||[];segments=m.segments||[];walls=m.walls||[];turn=m.turn??-1;running=!!m.running;pendingWall=null;show(actions,duel);updateConfirm();draw();updateHud()}if(m.type==='round'){running=false;scores=m.scores||scores;pendingWall=null;updateConfirm();document.getElementById('scoreHud').textContent='Победы: '+(scores[me]||0);msg(m.winner===me?'ПОБЕДА! 🎉':m.winner<0?'Ничья!':'Победитель: '+(players[m.winner]?.name||'Игрок'),1400)}}
function updateHud(){const p=players[turn];document.getElementById('turnHud').textContent='Ход: '+(p?(turn===me?'ТЫ':p.name):'—');document.getElementById('scoreHud').textContent='Победы: '+(scores[me]||0)}function hex(c,a){const n=parseInt(c.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}function viewY(y){return duel&&!solo&&me===1?grid.rows-1-y:y}function viewDy(dy){return duel&&!solo&&me===1?-dy:dy}
function wallOverlaps(o,x,y){return walls.some(w=>{if(w.o===o){return o==='h'?w.y===y&&Math.max(w.x,x)<Math.min(w.x+2,x+2):w.x===x&&Math.max(w.y,y)<Math.min(w.y+2,y+2)}return o==='h'?w.x>=x&&w.x<=x+2&&y>=w.y&&y<=w.y+2:x>=w.x&&x<=w.x+2&&w.y>=y&&w.y<=y+2})}
function wallValid(o,x,y){if(walls.length>=maxWalls)return false;if(o==='h'?(x<1||x>14||y<1||y>16):(x<1||x>16||y<1||y>14))return false;return !wallOverlaps(o,x,y)}
function updateConfirm(){const ok=!!pendingWall&&wallValid(pendingWall.o,pendingWall.x,pendingWall.y);confirmWall.disabled=!ok}
function draw(){const W=canvas.width,H=canvas.height,cw=W/grid.cols,ch=H/grid.rows;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafafa';ctx.fillRect(0,0,W,H);if(duel){const own=solo?0:me,opp=solo?1:(me===0?1:0);ctx.fillStyle=hex(colors[own],.10);ctx.fillRect(0,H-ch*2,W,ch*2);ctx.fillStyle=hex(colors[opp],.07);ctx.fillRect(0,0,W,ch*2)}ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let x=0;x<=grid.cols;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,H);ctx.stroke()}for(let y=0;y<=grid.rows;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(W,y*ch);ctx.stroke()}ctx.lineWidth=8;if(duel){const own=solo?0:me,opp=solo?1:(me===0?1:0);[[colors[opp],[5,5,W-5,5]],[colors[own],[5,H-5,W-5,H-5]]].forEach(([co,p])=>{ctx.strokeStyle=co;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);ctx.stroke()})}else{[[colors[0],[5,5,W-5,5]],[colors[1],[5,5,5,H-5]],[colors[2],[W-5,5,W-5,H-5]],[colors[3],[5,H-5,W-5,H-5]]].forEach(([co,p])=>{ctx.strokeStyle=co;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);ctx.stroke()})}if(!duel){const tx=(target.x+.5)*cw,ty=(target.y+.5)*ch;ctx.strokeStyle=colors[3];ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(tx-cw*.3,ty-ch*.3,cw*.6,ch*.6,10);ctx.stroke()}if(!duel)for(const s of segments){ctx.strokeStyle=colors[s.p%4];ctx.lineWidth=Math.max(7,cw*.13);ctx.lineCap='round';ctx.beginPath();ctx.moveTo((s.a.x+.5)*cw,(s.a.y+.5)*ch);ctx.lineTo((s.b.x+.5)*cw,(s.b.y+.5)*ch);ctx.stroke()}for(const w of walls){ctx.strokeStyle=colors[w.p%4];ctx.lineWidth=Math.max(8,cw*.14);ctx.lineCap='round';ctx.beginPath();if(w.o==='h'){ctx.moveTo(w.x*cw,w.y*ch);ctx.lineTo((w.x+2)*cw,w.y*ch)}else{ctx.moveTo(w.x*cw,w.y*ch);ctx.lineTo(w.x*cw,(w.y+2)*ch)}ctx.stroke()}if(pendingWall){const ok=wallValid(pendingWall.o,pendingWall.x,pendingWall.y);ctx.strokeStyle=ok?'rgba(0,190,80,.48)':'rgba(230,30,45,.48)';ctx.lineWidth=Math.max(12,cw*.20);ctx.lineCap='round';ctx.beginPath();if(pendingWall.o==='h'){ctx.moveTo(pendingWall.x*cw,pendingWall.y*ch);ctx.lineTo((pendingWall.x+2)*cw,pendingWall.y*ch)}else{ctx.moveTo(pendingWall.x*cw,pendingWall.y*ch);ctx.lineTo(pendingWall.x*cw,(pendingWall.y+2)*ch)}ctx.stroke()}players.forEach((p,i)=>{if(!p||p.alive===false)return;const x=(p.x+.5)*cw,y=(viewY(p.y)+.5)*ch;ctx.fillStyle=colors[i%4];ctx.beginPath();ctx.arc(x,y,cw*.18,0,7);ctx.fill();if(i===me||solo&&i===0){ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,cw*.22,0,7);ctx.stroke()}})}
function resize(){const r=Math.min(innerWidth/canvas.width,innerHeight/canvas.height);canvas.style.width=canvas.width*r+'px';canvas.style.height=canvas.height*r+'px';draw()}addEventListener('resize',resize);resize();
function direction(dx,dy){if(!running||(!dx&&!dy))return;if(solo){if(turn!==0||botThinking)return;if(applySoloMove(0,dx,dy)){turn=1;draw();updateHud();if(running)botTurn()}return}if(turn!==me){msg('Сейчас ходит '+(players[turn]?.name||'другой игрок'));return}wallMode=null;pendingWall=null;updateWallButtons();updateConfirm();send({type:'move',dx,dy:viewDy(dy)})}
const keys={};addEventListener('keydown',e=>{if(keys[e.key])return;keys[e.key]=1;const k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')direction(0,-1);else if(k==='s'||e.key==='ArrowDown')direction(0,1);else if(k==='a'||e.key==='ArrowLeft')direction(-1,0);else if(k==='d'||e.key==='ArrowRight')direction(1,0);else if(duel&&k==='h')selectWall('h');else if(duel&&k==='v')selectWall('v')});addEventListener('keyup',e=>keys[e.key]=0);document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const d=b.dataset.dir;direction(d==='left'?-1:d==='right'?1:0,d==='up'?-1:d==='down'?1:0)}));
function selectWall(o){if(!duel||!running||(!solo&&turn!==me)||(solo&&turn!==0)||botThinking)return;wallMode=wallMode===o?null:o;pendingWall=null;updateWallButtons();updateConfirm();draw();msg(wallMode?'Нажми на линию поля':'Режим стены отменён',700)}function updateWallButtons(){document.getElementById('wallH').classList.toggle('selected',wallMode==='h');document.getElementById('wallV').classList.toggle('selected',wallMode==='v')}
function choosePendingWall(x,y){if(!wallMode)return;pendingWall={o:wallMode,x,y};updateConfirm();draw();msg(wallValid(wallMode,x,y)?'Стена свободна — нажми ✓':'Стена пересекается с другой стеной',700)}
document.getElementById('wallH').onclick=()=>selectWall('h');document.getElementById('wallV').onclick=()=>selectWall('v');confirmWall.onclick=()=>{if(!pendingWall||!wallValid(pendingWall.o,pendingWall.x,pendingWall.y))return;const w={...pendingWall};if(solo){walls.push({o:w.o,x:w.x,y:w.y,p:0});pendingWall=null;wallMode=null;updateWallButtons();updateConfirm();turn=1;draw();updateHud();if(running)botTurn()}else{send({type:'wall',o:w.o,x:w.x,y:w.y});pendingWall=null;wallMode=null;updateWallButtons();updateConfirm();draw()}};
canvas.addEventListener('pointerdown',e=>{if(!duel||!running||(!solo&&turn!==me)||(solo&&turn!==0)||!wallMode)return;const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*canvas.width,py=(e.clientY-r.top)/r.height*canvas.height,cw=canvas.width/grid.cols,ch=canvas.height/grid.rows;let x=Math.round(px/cw),y=Math.round(py/ch);if(wallMode==='h'){x=Math.max(1,Math.min(14,x));y=Math.max(1,Math.min(16,y))}else{x=Math.max(1,Math.min(16,x));y=Math.max(1,Math.min(14,y))}if(!solo&&me===1)y=grid.rows-y;choosePendingWall(x,y)});
function wallBlocks(w,x,y,nx,ny){if(w.o==='h')return x===nx&&x>=w.x&&x<w.x+2&&Math.max(y,ny)===w.y;if(w.o==='v')return y===ny&&y>=w.y&&y<w.y+2&&Math.max(x,nx)===w.x;return false}function blockedByWall(x,y,nx,ny){return walls.some(w=>wallBlocks(w,x,y,nx,ny))}function legalCell(i,nx,ny){const p=players[i];return p&&nx>=0&&nx<grid.cols&&ny>=0&&ny<grid.rows&&!players.some((q,j)=>j!==i&&q?.alive&&q.x===nx&&q.y===ny)&&!blockedByWall(p.x,p.y,nx,ny)}function addSoloWall(o,x,y){if(!wallValid(o,x,y))return false;walls.push({o,x,y,p:0});return true}function applySoloMove(i,dx,dy){const p=players[i];if(!p||!p.alive||(!dx&&!dy)||dx===-p.dir.x&&dy===-p.dir.y)return false;const nx=p.x+dx,ny=p.y+dy;if(!legalCell(i,nx,ny))return false;if((i===0&&ny===0)||(i===1&&ny===grid.rows-1)){p.x=nx;p.y=ny;finishSolo(i);return true}p.x=nx;p.y=ny;p.dir={x:dx,y:dy};return true}function pathLen(i){const p=players[i],goal=y=>i===0?y===0:y===grid.rows-1,q=[[p.x,p.y,0]],seen=new Set([p.x+','+p.y]);while(q.length){const [x,y,d]=q.shift();if(goal(y))return d;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||nx>=grid.cols||ny<0||ny>=grid.rows||seen.has(nx+','+ny)||blockedByWall(x,y,nx,ny))continue;if(players.some((z,j)=>j!==i&&z?.alive&&z.x===nx&&z.y===ny))continue;seen.add(nx+','+ny);q.push([nx,ny,d+1])}}return 999}function pathAfterMove(i,dx,dy){const p=players[i],ox=p.x,oy=p.y,od=p.dir;p.x+=dx;p.y+=dy;p.dir={x:dx,y:dy};const n=pathLen(i);p.x=ox;p.y=oy;p.dir=od;return n}function botChooseAction(){const b=players[1],dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>legalCell(1,b.x+d[0],b.y+d[1]));if(!dirs.length)return null;const best=dirs.map(d=>({d,n:pathAfterMove(1,d[0],d[1])})).sort((a,z)=>a.n-z.n)[0];if(walls.length<maxWalls&&Math.random()<.28){const cs=[];for(const o of ['h','v'])for(let y=1;y<(o==='h'?17:15);y++)for(let x=1;x<(o==='h'?15:17);x++){if(!wallValid(o,x,y))continue;walls.push({o,x,y,p:1});const a=pathLen(0),b2=pathLen(1);walls.pop();if(a<999&&b2<999)cs.push({o,x,y,score:a-b2})}cs.sort((a,z)=>z.score-a.score);if(cs[0]&&cs[0].score>0)return{wall:cs[0]}}return{move:best.d}}
function botTurn(){if(!solo||!running||turn!==1||botThinking)return;botThinking=true;setTimeout(()=>{if(!solo||!running||turn!==1){botThinking=false;return}const a=botChooseAction();if(!a){finishSolo(0);botThinking=false;return}if(a.wall){walls.push({...a.wall,p:1});msg('Бот поставил стену',650)}else applySoloMove(1,a.move[0],a.move[1]);if(running){turn=0;draw();updateHud()}botThinking=false},450)}function finishSolo(w){running=false;scores[w]++;pendingWall=null;updateConfirm();updateHud();msg(w===0?'ПОБЕДА! 🎉':'БОТ ПОБЕДИЛ',1500);setTimeout(startSolo,1800)}function startSolo(){solo=true;duel=true;running=true;botThinking=false;turn=0;wallMode=null;pendingWall=null;walls=[];segments=[];players=[{x:8,y:16,dir:{x:0,y:-1},alive:true,name:'Ты'},{x:8,y:0,dir:{x:0,y:1},alive:true,name:'Бот'}];show(menu,false);show(lobby,false);show(hud,true);show(actions,true);updateWallButtons();updateConfirm();draw();updateHud();msg('ТВОЙ ХОД — ты снизу: шаг или стена',1300)}
let count=4;document.querySelectorAll('.count').forEach(b=>b.onclick=()=>{count=Number(b.dataset.n);document.querySelectorAll('.count').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('bot').onclick=startSolo;document.getElementById('create').onclick=()=>{socket();send({type:'create',name:document.getElementById('nick').value,roomName:document.getElementById('roomName').value,maxPlayers:count})};document.getElementById('refresh').onclick=refreshRooms;document.getElementById('quick').onclick=()=>{socket();const r=document.querySelector('.room');if(r)send({type:'join',name:document.getElementById('nick').value,room:r.dataset.code})};document.getElementById('start').onclick=()=>send({type:'start'});document.getElementById('leave').onclick=()=>location.reload();async function refreshRooms(){try{const r=await fetch('/rooms',{cache:'no-store'}),d=await r.json();document.getElementById('rooms').innerHTML=d.rooms.map(r=>`<button class="room" data-code="${r.code}"><span>${esc(r.name)}<br><small>${r.players}/${r.maxPlayers}</small></span><b>ВОЙТИ</b></button>`).join('')||'<div class="sub">Нет открытых комнат</div>';document.querySelectorAll('.room').forEach(b=>b.onclick=()=>{socket();send({type:'join',name:document.getElementById('nick').value,room:b.dataset.code})})}catch{document.getElementById('rooms').innerHTML='<div class="sub">Не удалось загрузить комнаты</div>'}}socket();refreshRooms();
</script></body></html>
