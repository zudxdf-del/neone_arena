<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#eafaff;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.card{width:min(94vw,620px);max-height:94vh;overflow:auto;background:#071326f5;border:1px solid #27dfff66;border-radius:22px;padding:20px;text-align:center;box-shadow:0 0 55px #00d9ff25}.hidden{display:none!important}h1{margin:0;color:#4deaff;font-size:42px;letter-spacing:4px}.sub{color:#87a9bd;margin:7px 0 14px}.field{width:100%;padding:13px;margin:5px 0;border:1px solid #31516d;border-radius:12px;background:#040a15;color:#fff;font-size:17px;text-align:center}.btn{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;background:#12bce8;color:#00121a;font-weight:900;font-size:17px}.secondary{background:#172b40;color:#d8f5ff}.counts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0}.count{width:58px}.count.active{background:#13aee0}.rooms{margin:12px 0;text-align:left;display:grid;gap:7px;max-height:38vh;overflow:auto}.room{padding:12px;border:1px solid #24465e;border-radius:12px;background:#0b1c2d;display:flex;justify-content:space-between;align-items:center;gap:10px}.roomname{font-weight:800}.roommeta{color:#7f9eb2;font-size:13px;margin-top:3px}.joinroom{width:auto;min-width:105px;margin:0}.code{font-size:32px;letter-spacing:6px;color:#ffe45c;font-weight:900}.players{display:grid;gap:8px;margin:14px 0;text-align:left}.player{padding:11px;border:1px solid #24465e;border-radius:12px;background:#0b1c2d;display:flex;justify-content:space-between}.host{color:#ffe45c}.waiting{color:#5b7890}.start{background:#2de887;color:#00160b;font-size:20px}.status{min-height:24px;color:#7eeaff;margin-top:8px}.hud{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:#071426dd;border:1px solid #2ce5ff66;border-radius:12px;padding:8px 12px;font-weight:800}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 0 12px #fff}.bottom{position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none}.stick{position:absolute;bottom:22px;width:145px;height:145px;border:2px solid #36dfff66;border-radius:50%;background:#0b294866;pointer-events:auto}.move{left:20px}.aim{right:20px}.knob{position:absolute;left:42px;top:42px;width:58px;height:58px;border-radius:50%;background:#23d9ffbb;box-shadow:0 0 18px #23d9ff66}.fire{position:absolute;right:175px;bottom:35px;width:105px;height:105px;border-radius:50%;background:#ff3868;border:3px solid #ff9ab2;color:#fff;font-weight:900;font-size:17px;pointer-events:auto;box-shadow:0 0 25px #ff386855}.reload{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);width:105px;height:48px;border:0;border-radius:10px;background:#152b40ee;color:#fff;font-weight:800;pointer-events:auto}.hp{position:absolute;left:15px;bottom:15px;width:180px;height:14px;border:2px solid #52728a;border-radius:8px;background:#101a25;overflow:hidden}.hp i{display:block;height:100%;background:#19df83;width:100%}.weapon{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#071426dd;border:1px solid #2ce5ff55;border-radius:10px;padding:6px 12px;font-weight:800}
@media(max-width:600px){h1{font-size:34px}.card{padding:16px}.move{left:12px}.aim{right:12px}.stick{width:132px;height:132px}.knob{left:38px;top:38px}.fire{right:145px;width:92px;height:92px}.reload{bottom:25px}.hp{width:155px}.top{font-size:13px}}
</style></head><body><canvas id="game"></canvas>
<div id="menu" class="screen"><div class="card"><h1>NEON ARENA</h1><div class="sub">3D ОНЛАЙН АРЕНА · СПИСОК СЕРВЕРОВ</div><input id="nick" class="field" maxlength="20" value="Игрок" placeholder="Твоё имя"><input id="roomName" class="field" maxlength="30" value="Неоновая арена" placeholder="Название комнаты"><input id="password" class="field" maxlength="40" placeholder="Пароль для новой комнаты (необязательно)"><div class="sub">СКОЛЬКО ИГРОКОВ?</div><div id="counts" class="counts"><button class="btn count active" data-n="2">2</button><button class="btn count" data-n="3">3</button><button class="btn count" data-n="4">4</button><button class="btn count" data-n="6">6</button><button class="btn count" data-n="8">8</button></div><button id="create" class="btn">СОЗДАТЬ ИГРУ</button><div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><h3 style="margin:0">ДОСТУПНЫЕ СЕРВЕРЫ</h3><button id="refresh" class="btn secondary" style="width:auto;padding:9px 13px">↻ ОБНОВИТЬ</button></div><div id="rooms" class="rooms"><div class="sub">Поиск комнат…</div></div><div id="status" class="status"></div></div></div>
<div id="lobby" class="screen hidden"><div class="card"><h2 style="margin:0 0 4px">ЛОББИ</h2><div id="roomTitle" class="sub"></div><div id="roomCode" class="code"></div><div id="roomCount" class="sub"></div><div id="players" class="players"></div><button id="start" class="btn start">НАЧАТЬ ИГРУ</button><button id="leave" class="btn secondary">ВЫЙТИ ИЗ КОМНАТЫ</button><div id="lobbyStatus" class="status"></div></div></div>
<div id="hud" class="hud hidden"><div class="top"><div id="online" class="pill">0 / 0 PLAYERS</div><div id="score" class="pill">SCORE 0</div></div><div id="weapon" class="weapon">PISTOL · 12</div><div class="cross">+</div><div class="bottom"><div id="moveStick" class="stick move"><div id="moveKnob" class="knob"></div></div><div id="aimStick" class="stick aim"><div id="aimKnob" class="knob"></div></div><button id="reload" class="reload">↻ RELOAD</button><button id="fire" class="fire">ОГОНЬ</button><div class="hp"><i id="hpbar"></i></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id);const canvas=$('game');
let ws=null,selected=2,me=0,players=[],bullets=[],obstacles=[],running=false,lastInput=0,fireHeld=false;
let scene,camera,renderer,arenaGroup,actorMap=new Map(),bulletMap=new Map();
const colors=['#25e8ff','#ff3d70','#b85cff','#ffe45c','#4dff8b','#ff8a3d','#4f8dff','#ff55d6'];
const move={x:0,y:0},aim={x:0,y:0};
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function setStatus(t){$('status').textContent=t}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function colorHex(i){return colors[i%colors.length]}
function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);scene.fog=new THREE.Fog(0x020611,42,85);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,150);renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const hemi=new THREE.HemisphereLight(0x8deaff,0x07111f,1.8);scene.add(hemi);const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(8,20,10);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);buildArena();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate()}
function mat(hex,em=0){return new THREE.MeshStandardMaterial({color:hex,emissive:hex,emissiveIntensity:em,roughness:.48,metalness:.25})}
function box(x,y,z,w,h,d,c,em=.12){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,em));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;arenaGroup.add(m);return m}
function buildArena(){arenaGroup=new THREE.Group();scene.add(arenaGroup);const floor=box(0,-.5,0,40,.8,28,0x071729,.02);floor.receiveShadow=true;const grid=new THREE.GridHelper(40,40,0x17627c,0x0b3048);grid.position.y=-.08;arenaGroup.add(grid);const border=0x19dfff;box(0,1,-14,40,2,.35,border,.35);box(0,1,14,40,2,.35,border,.35);box(-20,1,0,.35,2,28,border,.35);box(20,1,0,.35,2,28,border,.35);const pts=[[-4,1,-7],[4,1,-7],[-4,1,7],[4,1,7]];pts.forEach(([x,y,z])=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.75,.09,8,32),mat(0x19dfff,.5));r.rotation.x=Math.PI/2;r.position.set(x,.05,z);arenaGroup.add(r)});}
function rebuildObstacles(){[...arenaGroup.children].forEach(o=>{if(o.userData.obstacle){arenaGroup.remove(o);o.geometry?.dispose();o.material?.dispose()}});for(const o of obstacles){const x=o.x/25-20+o.w/50,z=o.y/25-14+o.h/50,w=o.w/25,d=o.h/25;const m=box(x,1.05,z,w,2.1,d,0x18375a,.22);m.userData.obstacle=true;const glow=box(x,2.12,z,w+.04,.06,d+.04,0x27bfff,.6);glow.userData.obstacle=true}}
function worldPos(x,y,h=.0){return new THREE.Vector3(x/25-20,h,y/25-14)}
function makeActor(i,p){const g=new THREE.Group();g.userData.id=i;const c=colorHex(i);const body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,1.35,12),mat(c,.3));body.position.y=.82;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),mat(0xeafaff,.12));head.position.y=1.75;head.castShadow=true;g.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.5,.16,.08),mat(c,.7));visor.position.set(0,1.76,.39);g.add(visor);const gun=new THREE.Mesh(new THREE.BoxGeometry(.16,.18,.9),mat(0x111a28,.08));gun.position.set(.48,1.08,.48);gun.rotation.x=-.08;gun.castShadow=true;g.add(gun);const ring=new THREE.Mesh(new THREE.TorusGeometry(.7,.035,6,24),mat(c,.5));ring.rotation.x=Math.PI/2;ring.position.y=.08;g.add(ring);const hpBack=new THREE.Mesh(new THREE.BoxGeometry(1.5,.1,.04),mat(0x180d16,0));hpBack.position.set(0,2.28,0);g.add(hpBack);const hp=new THREE.Mesh(new THREE.BoxGeometry(1.5,.1,.05),mat(0x20ee88,.5));hp.position.set(0,2.28,.03);g.add(hp);g.userData.hp=hp;const label=makeLabel((i===me?'YOU · ':'')+(p.name||'Игрок'),c);label.position.set(0,2.55,0);g.add(label);scene.add(g);actorMap.set(i,g);return g}
function makeLabel(text,c){const cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=512;cv.height=96;x.clearRect(0,0,512,96);x.font='bold 42px Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffffff';x.shadowColor=c;x.shadowBlur=12;x.fillText(text,256,48);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));s.scale.set(2.7,.5,1);return s}
function updateActors(){const seen=new Set();players.forEach((p,i)=>{if(!p)return;seen.add(i);let g=actorMap.get(i);if(!g)g=makeActor(i,p);const pos=worldPos(p.x,p.y);g.position.lerp(new THREE.Vector3(pos.x,0,pos.z),.35);const a=p.aim||{x:1,y:0};g.rotation.y=Math.atan2(a.x,a.y);g.userData.hp.scale.x=Math.max(.001,p.hp/100);});for(const [i,g] of actorMap){if(!seen.has(i)){scene.remove(g);actorMap.delete(i)}}}
function updateBullets(){const seen=new Set();bullets.forEach(b=>{seen.add(b.id);let m=bulletMap.get(b.id);if(!m){m=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),mat(0xffee66,1.5));scene.add(m);bulletMap.set(b.id,m)}const p=worldPos(b.x,b.y,1.0);m.position.lerp(p,.7)});for(const [id,m] of bulletMap){if(!seen.has(id)){scene.remove(m);m.geometry.dispose();m.material.dispose();bulletMap.delete(id)}}}
function updateCamera(){const p=players[me];if(!p)return;const pos=worldPos(p.x,p.y);const target=new THREE.Vector3(pos.x,0,pos.z);const desired=new THREE.Vector3(pos.x,8.5,pos.z+10.5);camera.position.lerp(desired,.075);camera.lookAt(target.x,target.y+.7,target.z)}
function animate(){requestAnimationFrame(animate);if(running){updateActors();updateBullets();updateCamera()}renderer.render(scene,camera)}
function resizeCanvas(){renderer?.setSize(innerWidth,innerHeight)}
function showLobby(d){$('menu').classList.add('hidden');$('lobby').classList.remove('hidden');const ps=d.players||[],n=+d.maxPlayers||selected;$('roomTitle').textContent=d.roomName||'Комната';$('roomCode').textContent=d.room||'';$('roomCount').textContent=`ИГРОКИ: ${ps.filter(Boolean).length} / ${n}`;$('players').innerHTML='';for(let i=0;i<n;i++){const p=ps[i],el=document.createElement('div');el.className='player';el.innerHTML=p?`<span>${i===me?'● ВЫ — ':''}${esc(p.name)}</span><span class="${p.host?'host':''}">${p.host?'★ СОЗДАТЕЛЬ':'ГОТОВ'}</span>`:`<span class="waiting">Место ${i+1}</span><span class="waiting">Ожидание…</span>`;$('players').appendChild(el)}const count=ps.filter(Boolean).length;$('start').disabled=!(me===+d.host&&count>=2);$('start').style.opacity=$('start').disabled?'.45':'1';$('lobbyStatus').textContent=me===+d.host?'Ты создатель комнаты. Ждём игроков.':'Ждём создателя…'}
function message(d){if(d.type==='created'){me=+d.player;showLobby(d);return}if(d.type==='lobby'){showLobby(d);loadRooms();return}if(d.type==='password_required'){const p=prompt('Пароль комнаты:');if(p!==null)connectJoin(d.room,p);return}if(d.type==='start'){me=+d.player;running=true;players=d.players||[];obstacles=d.obstacles||obstacles;rebuildObstacles();$('menu').classList.add('hidden');$('lobby').classList.add('hidden');$('hud').classList.remove('hidden');return}if(d.type==='snapshot'){players=d.players||[];bullets=d.bullets||[];obstacles=d.obstacles||obstacles;if(obstacles.length)rebuildObstacles();$('online').textContent=`${players.filter(Boolean).length} / ${players.length} PLAYERS`;const p=players[me];if(p){$('score').textContent=`SCORE ${p.score||0}`;$('hpbar').style.width=Math.max(0,p.hp)+'%';$('weapon').textContent=`${String(p.weapon||'pistol').toUpperCase()} · ${p.reloading?'RELOADING':p.ammo}`};return}if(d.type==='round'){setTimeout(()=>alert(d.winner===me?'🏆 ПОБЕДА!':'💥 ПОРАЖЕНИЕ'),10);return}if(d.type==='opponent_left'){leave();return}if(d.type==='error'){setStatus(d.message||'Ошибка');$('lobbyStatus').textContent=d.message||'Ошибка';loadRooms()}}
function connect(type){const payload={type,name:($('nick').value.trim()||'Игрок').slice(0,20),room:'',password:$('password').value,roomName:$('roomName').value,maxPlayers:selected};if(ws&&ws.readyState===1){send(payload);return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{setStatus('СЕРВЕР: ПОДКЛЮЧЕН');send(payload)};ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>{if(running)leave();setStatus('СЕРВЕР: ОТКЛЮЧЕН')};ws.onmessage=e=>{try{message(JSON.parse(e.data))}catch{}}}
function connectJoin(room,password){const payload={type:'join',room,password,name:($('nick').value.trim()||'Игрок').slice(0,20)};if(ws&&ws.readyState===1){send(payload);return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send(payload);ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>{if(running)leave()};ws.onmessage=e=>{try{message(JSON.parse(e.data))}catch{}}}
function joinRoom(r){const pw=r.locked?prompt('Введите пароль комнаты:')||'':'';connectJoin(r.code,pw)}
async function loadRooms(){try{const r=await fetch('/rooms',{cache:'no-store'}),d=await r.json();const box=$('rooms');if(!d.rooms?.length){box.innerHTML='<div class="sub">Сейчас нет открытых серверов. Создай свою игру.</div>';return}box.innerHTML='';d.rooms.forEach(r=>{const el=document.createElement('div');el.className='room';el.innerHTML=`<div><div class="roomname">${esc(r.name)}</div><div class="roommeta">${esc(r.host)} · ${r.players}/${r.maxPlayers} игроков ${r.locked?'· 🔒 пароль':''}</div></div><button class="btn joinroom">ВОЙТИ</button>`;el.querySelector('button').onclick=()=>joinRoom(r);box.appendChild(el)})}catch{$('rooms').innerHTML='<div class="sub">Не удалось получить список серверов.</div>'}}
function leave(){running=false;players=[];bullets=[];for(const g of actorMap.values())scene.remove(g);actorMap.clear();for(const m of bulletMap.values())scene.remove(m);bulletMap.clear();$('hud').classList.add('hidden');$('lobby').classList.add('hidden');$('menu').classList.remove('hidden');if(ws){try{ws.close()}catch{}ws=null}loadRooms()}
$('counts').onclick=e=>{const b=e.target.closest('.count');if(!b)return;selected=+b.dataset.n;document.querySelectorAll('.count').forEach(x=>x.classList.toggle('active',x===b));loadRooms()};$('create').onclick=()=>connect('create');$('refresh').onclick=loadRooms;$('start').onclick=()=>send({type:'start_game'});$('leave').onclick=leave;$('reload').onclick=()=>send({type:'reload'});
function bindStick(el,knob,state){let active=false;el.onpointerdown=e=>{active=true;el.setPointerCapture(e.pointerId);update(e)};el.onpointermove=e=>{if(active)update(e)};el.onpointerup=()=>{active=false;state.x=0;state.y=0;knob.style.transform=''};el.onpointercancel=el.onpointerup;function update(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rx=r.width*.38,ry=r.height*.38;state.x=Math.max(-1,Math.min(1,(e.clientX-cx)/rx));state.y=Math.max(-1,Math.min(1,(e.clientY-cy)/ry));knob.style.transform=`translate(${state.x*rx*.72}px,${state.y*ry*.72}px)`}}
bindStick($('moveStick'),$('moveKnob'),move);bindStick($('aimStick'),$('aimKnob'),aim);$('fire').onpointerdown=e=>{e.preventDefault();fireHeld=true};$('fire').onpointerup=()=>fireHeld=false;$('fire').onpointercancel=()=>fireHeld=false;
setInterval(()=>{if(running&&Date.now()-lastInput>45){let ax=aim.x,ay=aim.y;if(Math.hypot(ax,ay)<.1){const p=players[me];ax=p?.aim?.x||1;ay=p?.aim?.y||0}send({type:'input',x:move.x,y:move.y,aimX:ax,aimY:ay});lastInput=Date.now()}},50);setInterval(()=>{if(running&&fireHeld)send({type:'shoot'})},80);setInterval(loadRooms,3000);
init3D();loadRooms();
</script></body></html>
