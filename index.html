<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Криминальный Сапёр</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020403;color:#baffc9;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}body{overflow:hidden}body:before{content:"010101 110010 001101 101011 011001 110100 000111 101010 001001 111000 010101 100110 011010 110001";position:fixed;inset:0;z-index:-2;color:#092312;font-size:18px;line-height:2.2;word-spacing:18px;overflow:hidden;opacity:.8;transform:rotate(-4deg) scale(1.15)}body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 20%,rgba(0,255,80,.1),transparent 45%),linear-gradient(rgba(0,255,80,.025) 1px,transparent 1px);background-size:auto,4px 4px}.wrap{min-height:100dvh;display:grid;place-items:center;padding:14px}.card{width:min(94vw,520px);background:rgba(2,8,4,.95);border:1px solid #20e866;border-radius:14px;padding:26px;box-shadow:0 0 30px rgba(0,255,90,.18),inset 0 0 30px rgba(0,255,90,.04);position:relative}.card:before{content:"SECURE NETWORK // CASE 09";position:absolute;top:-10px;left:16px;background:#020403;padding:2px 7px;color:#20e866;font-size:10px;letter-spacing:1px}.brand{margin:0;color:#42ff7a;font-size:clamp(29px,8vw,43px);line-height:1.05;letter-spacing:2px;text-shadow:0 0 13px rgba(66,255,122,.65)}.sub{color:#659c71;font-size:11px;letter-spacing:1px;margin:8px 0 22px}.section{border-top:1px solid #123b1d;padding-top:17px;margin-top:17px}label{display:block;color:#5d966b;font-size:10px;text-transform:uppercase;margin-bottom:7px}input,button{width:100%;font:inherit;border-radius:9px}input{padding:14px;background:#030a05;border:1px solid #185b2b;color:#c8ffd4;text-align:center;outline:none}input:focus{border-color:#31ff6d;box-shadow:0 0 12px rgba(49,255,109,.16)}#roomCode{font-size:29px;font-weight:900;letter-spacing:9px;color:#52ff83}button{padding:14px;margin-top:9px;border:1px solid #2cff6c;background:#0b2b15;color:#baffc8;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px}button.primary{background:#17a944;border-color:#42ff7a;color:#001b08}button.secondary{background:transparent}button:disabled{opacity:.45}.status{min-height:24px;margin-top:12px;text-align:center;color:#71ff91;font-size:12px;line-height:1.5}.error{color:#ff6b6b}.players{display:grid;gap:8px;margin-top:12px}.player{display:flex;justify-content:space-between;align-items:center;border:1px solid #164c25;border-radius:9px;padding:11px;background:#041008}.dot{width:8px;height:8px;border-radius:50%;background:#42ff7a;display:inline-block;margin-right:8px;box-shadow:0 0 9px #42ff7a}.offline .dot{background:#31533a;box-shadow:none}.online{color:#42ff7a}.waiting{color:#55755d}.small{color:#4e7b59;font-size:10px;line-height:1.6;text-align:center;margin-top:12px}.ready{text-align:center;padding:8px 0}.check{font-size:45px;color:#42ff7a;text-shadow:0 0 18px rgba(66,255,122,.6)}.hidden{display:none!important}@media(max-width:480px){.wrap{padding:10px}.card{padding:22px 16px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1 class="brand">КРИМИНАЛЬНЫЙ<br>САПЁР</h1><div class="sub">// ЗАКРЫТАЯ ОПЕРАЦИЯ · 2 ХАКЕРА · REALTIME</div>
<div id="start"><button id="create" class="primary">Создать секретную сессию</button><div class="section"><label>Подключиться к сессии</label><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="4-ЗНАЧНЫЙ КОД"><button id="join">Подключиться</button></div><div id="status" class="status">Инициализация защищённого канала…</div></div>
<div id="room" class="hidden"><div class="section" style="margin-top:0"><label>Секретный код комнаты</label><input id="roomCode" readonly><div class="small">Передай этот код второму игроку.</div></div><div class="section"><label>Состав операции</label><div id="players" class="players"></div></div><div id="roomStatus" class="status">Ожидание второго хакера…</div><button id="leave" class="secondary">Закрыть сессию</button></div>
<div id="ready" class="hidden"><div class="ready"><div class="check">✓</div><b>Оба хакера в сети.</b><div class="sub" style="margin:8px 0 0">Подготовка сети...</div></div><div id="readyPlayers" class="players"></div><div class="status">Синхронизация завершена. Игровой процесс будет добавлен следующим этапом.</div></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let peer=null,conn=null,host=false,code='',connected=false;
const status=(t,e=false)=>{$('status').textContent=t;$('status').classList.toggle('error',e)},rstatus=(t,e=false)=>{$('roomStatus').textContent=t;$('roomStatus').classList.toggle('error',e)};
const clean=v=>v.replace(/\D/g,'').slice(0,4),newCode=()=>String(Math.floor(1000+Math.random()*9000));
function render(n){const h='<div class="player"><span><i class="dot"></i>Хакер 1</span><span class="online">В СЕТИ</span></div>'+`<div class="player ${n>1?'':'offline'}"><span><i class="dot"></i>Хакер 2</span><span class="${n>1?'online':'waiting'}">${n>1?'В СЕТИ':'ОЖИДАНИЕ'}</span></div>`;$('players').innerHTML=h;$('readyPlayers').innerHTML=h}
function ready(){render(2);$('room').classList.add('hidden');$('ready').classList.remove('hidden')}
function setup(){if(!conn)return;conn.on('open',()=>{connected=true;$('start').classList.add('hidden');$('room').classList.remove('hidden');if(!host)$('roomCode').value=code;rstatus(host?'Ожидание второго хакера…':'Связь установлена. Ожидание хоста…');send({type:'hello'});});conn.on('data',m=>{if(m&&m.type==='hello'){if(host){render(2);send({type:'ready'});ready()}else ready()}});conn.on('close',()=>{connected=false;if(!$('ready').classList.contains('hidden')){$('ready').classList.add('hidden');$('room').classList.remove('hidden')}render(host?1:0);rstatus('Второй хакер отключился.',true)})}
function send(m){if(conn&&conn.open)conn.send(m)}
function create(){host=true;code=newCode();if(peer)peer.destroy();peer=new Peer(code,{debug:0});peer.on('open',()=>{$('start').classList.add('hidden');$('room').classList.remove('hidden');$('roomCode').value=code;render(1);rstatus('Ожидание второго хакера…')});peer.on('connection',c=>{if(conn){c.close();return}conn=c;setup()});peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();peer=null;create()}else rstatus('Не удалось создать сессию. Попробуй ещё раз.',true)});peer.on('disconnected',()=>peer.reconnect());$('create').disabled=true}
function joinRoom(){code=clean($('joinCode').value);$('joinCode').value=code;if(code.length!==4){status('Введи ровно 4 цифры кода.',true);return}host=false;if(peer)peer.destroy();peer=new Peer({debug:0});peer.on('open',()=>{status('Подключение к секретной сессии…');conn=peer.connect(code,{reliable:true});setup()});peer.on('error',e=>status(e.type==='peer-unavailable'?'Комната не найдена. Проверь код.':'Сетевой канал временно недоступен.',true))}
function leave(){if(conn)conn.close();if(peer)peer.destroy();conn=null;peer=null;host=false;connected=false;$('room').classList.add('hidden');$('ready').classList.add('hidden');$('start').classList.remove('hidden');$('create').disabled=false;$('joinCode').value='';status('Сессия закрыта. Можно создать новую.')}
$('create').onclick=create;$('join').onclick=joinRoom;$('joinCode').oninput=e=>e.target.value=clean(e.target.value);$('joinCode').onkeydown=e=>{if(e.key==='Enter')joinRoom()};$('leave').onclick=leave;
</script></body></html>
