<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#040914;color:#eafaff;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}.card{width:min(94vw,620px);max-height:94vh;overflow:auto;background:#081426f5;border:1px solid #20dfff66;border-radius:22px;padding:20px;text-align:center;box-shadow:0 0 45px #00d9ff22}h1{margin:0;color:#4deaff;font-size:42px;letter-spacing:4px}.sub{color:#87a9bd;margin:7px 0 14px}.field{width:100%;padding:13px;margin:5px 0;border:1px solid #31516d;border-radius:12px;background:#050b16;color:#fff;font-size:17px;text-align:center}.btn{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;background:#12bce8;color:#00121a;font-weight:900;font-size:17px}.secondary{background:#172b40;color:#d8f5ff}.counts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0}.count{width:58px}.count.active{background:#13aee0}.rooms{margin:12px 0;text-align:left;display:grid;gap:7px;max-height:42vh;overflow:auto}.room{padding:12px;border:1px solid #24465e;border-radius:12px;background:#0b1c2d;display:flex;justify-content:space-between;align-items:center;gap:10px}.room.sel{border-color:#29e3ff;box-shadow:0 0 14px #19dfff22}.roomname{font-weight:800}.roommeta{color:#7f9eb2;font-size:13px;margin-top:3px}.joinroom{width:auto;min-width:105px;margin:0}.code{font-size:32px;letter-spacing:6px;color:#ffe45c;font-weight:900}.players{display:grid;gap:8px;margin:14px 0;text-align:left}.player{padding:11px;border:1px solid #24465e;border-radius:12px;background:#0b1c2d;display:flex;justify-content:space-between}.host{color:#ffe45c}.waiting{color:#5b7890}.start{background:#2de887;color:#00160b;font-size:20px}.status{min-height:24px;color:#7eeaff;margin-top:8px}.top{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}.pill{background:#071426dd;border:1px solid #2ce5ff55;border-radius:12px;padding:8px 12px}.cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;pointer-events:none}.controls{position:fixed;inset:auto 0 0;height:44%;pointer-events:none}.stick{position:absolute;left:20px;bottom:24px;width:145px;height:145px;border:2px solid #36dfff66;border-radius:50%;background:#0b294866;pointer-events:auto}.knob{position:absolute;left:42px;top:42px;width:58px;height:58px;border-radius:50%;background:#23d9ffbb}.fire{position:absolute;right:20px;bottom:28px;width:110px;height:110px;border-radius:50%;background:#ff3868;border:3px solid #ff9ab2;color:#fff;font-weight:900;font-size:17px;pointer-events:auto}.reload{position:absolute;right:145px;bottom:40px;width:92px;height:50px;border:0;border-radius:10px;background:#152b40dd;color:#fff;pointer-events:auto}.hp{position:fixed;left:15px;bottom:15px;width:190px;height:15px;border:2px solid #52728a;border-radius:8px;background:#101a25}.hp i{display:block;height:100%;background:#19df83;width:100%}.hidden{display:none!important}</style></head><body><canvas id="game"></canvas><div id="menu" class="screen"><div class="card"><h1>NEON ARENA</h1><div class="sub">ОНЛАЙН АРЕНА · СПИСОК СЕРВЕРОВ</div><input id="nick" class="field" maxlength="20" value="Игрок" placeholder="Твоё имя"><input id="roomName" class="field" maxlength="30" value="Неоновая арена" placeholder="Название комнаты"><input id="password" class="field" maxlength="40" placeholder="Пароль для новой комнаты (необязательно)"><div class="sub">СКОЛЬКО ИГРОКОВ?</div><div id="counts" class="counts"><button class="btn count active" data-n="2">2</button><button class="btn count" data-n="3">3</button><button class="btn count" data-n="4">4</button><button class="btn count" data-n="6">6</button><button class="btn count" data-n="8">8</button></div><button id="create" class="btn">СОЗДАТЬ ИГРУ</button><div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><h3 style="margin:0">ДОСТУПНЫЕ СЕРВЕРЫ</h3><button id="refresh" class="btn secondary" style="width:auto;padding:9px 13px">↻ ОБНОВИТЬ</button></div><div id="rooms" class="rooms"><div class="sub">Поиск комнат…</div></div><div id="status" class="status">Подключение выполняется при входе.</div></div></div><div id="lobby" class="screen hidden"><div class="card"><h2 style="margin:0 0 4px">ЛОББИ</h2><div id="roomTitle" class="sub"></div><div id="roomCode" class="code"></div><div id="roomCount" class="sub"></div><div id="players" class="players"></div><button id="start" class="btn start">НАЧАТЬ ИГРУ</button><button id="leave" class="btn secondary">ВЫЙТИ ИЗ КОМНАТЫ</button><div id="lobbyStatus" class="status"></div></div></div><div id="hud" class="hidden"><div class="top"><div id="online" class="pill">0 PLAYERS</div><div id="score" class="pill">SCORE 0</div></div><div class="cross">+</div><div class="controls"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="reload" class="reload">↻ RELOAD</button><button id="fire" class="fire">ОГОНЬ</button></div><div class="hp"><i id="hpbar"></i></div></div><script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let ws=null,selected=2,me=0,players=[],bullets=[],obstacles=[],running=false,joy={x:0,y:0},fire=false,lastInput=0,roomPoll=null;
const colors=['#25e8ff','#ff3d70','#b85cff','#ffe45c','#4dff8b','#ff8a3d','#4f8dff','#ff55d6'];
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}function setStatus(t){$('status').textContent=t}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('counts').onclick=e=>{const b=e.target.closest('.count');if(!b)return;selected=+b.dataset.n;document.querySelectorAll('.count').forEach(x=>x.classList.toggle('active',x===b));loadRooms()};$('create').onclick=()=>connect('create');$('start').onclick=()=>send({type:'start_game'});$('leave').onclick=()=>leave();$('refresh').onclick=loadRooms;$('reload').onclick=()=>send({type:'reload'});$('fire').onpointerdown=e=>{e.preventDefault();fire=true};$('fire').onpointerup=()=>fire=false;
async function loadRooms(){try{const r=await fetch('/rooms',{cache:'no-store'}),d=await r.json();renderRooms(d.rooms||[])}catch{$('rooms').innerHTML='<div class="sub">Не удалось получить список серверов.</div>'}}
function renderRooms(list){const box=$('rooms');if(!list.length){box.innerHTML='<div class="sub">Сейчас нет открытых серверов. Создай свою игру.</div>';return}box.innerHTML='';list.forEach(r=>{const el=document.createElement('div');el.className='room';el.innerHTML=`<div><div class="roomname">${esc(r.name)}</div><div class="roommeta">${esc(r.host)} · ${r.players}/${r.maxPlayers} игроков ${r.locked?'· 🔒 пароль':''}</div></div><button class="btn joinroom">ВОЙТИ</button>`;el.querySelector('button').onclick=()=>joinRoom(r);box.appendChild(el)})}
function connect(type){const payload={type,name:($('nick').value.trim()||'Игрок').slice(0,20),room:'',password:$('password').value,roomName:$('roomName').value,maxPlayers:selected};if(ws&&ws.readyState===1){send(payload);return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{setStatus('СЕРВЕР: ПОДКЛЮЧЕН');send(payload)};ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>{if(running)leave();setStatus('СЕРВЕР: ОТКЛЮЧЕН')};ws.onmessage=e=>{try{message(JSON.parse(e.data))}catch{}}}
function joinRoom(r){const pw=r.locked?prompt('Введите пароль комнаты:')||'':'';connectJoin(r.code,pw)}
function connectJoin(room,password){const payload={type:'join',room,password,name:($('nick').value.trim()||'Игрок').slice(0,20)};if(ws&&ws.readyState===1){send(payload);return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send(payload);ws.onerror=()=>setStatus('Ошибка соединения');ws.onclose=()=>{if(running)leave()};ws.onmessage=e=>{try{message(JSON.parse(e.data))}catch{}}}
function message(d){if(d.type==='created'){me=+d.player;showLobby(d);return}if(d.type==='lobby'){showLobby(d);return}if(d.type==='password_required'){const p=prompt('Пароль комнаты:');if(p!==null)connectJoin(d.room,p);return}if(d.type==='start'){me=+d.player;players=d.players||[];obstacles=d.obstacles||[];running=true;$('menu').classList.add('hidden');$('lobby').classList.add('hidden');$('hud').classList.remove('hidden');resize();draw();return}if(d.type==='snapshot'){players=d.players||[];bullets=d.bullets||[];obstacles=d.obstacles||obstacles;draw();return}if(d.type==='round'){setTimeout(()=>alert(d.winner===me?'🏆 ПОБЕДА!':'💥 ПОРАЖЕНИЕ'),10);return}if(d.type==='opponent_left'){leave();return}if(d.type==='error'){setStatus(d.message||'Ошибка');$('lobbyStatus').textContent=d.message||'Ошибка';loadRooms()}}
function showLobby(d){$('menu').classList.add('hidden');$('lobby').classList.remove('hidden');const ps=d.players||[];const n=+d.maxPlayers||selected;$('roomTitle').textContent=d.roomName||'Комната';$('roomCode').textContent=d.room||'';$('roomCount').textContent=`ИГРОКИ: ${ps.filter(Boolean).length} / ${n}`;$('players').innerHTML='';for(let i=0;i<n;i++){const p=ps[i],el=document.createElement('div');el.className='player';el.innerHTML=p?`<span>${i===me?'● ВЫ — ':''}${esc(p.name)}</span><span class="${p.host?'host':''}">${p.host?'★ СОЗДАТЕЛЬ':'ГОТОВ'}</span>`:`<span class="waiting">Место ${i+1}</span><span class="waiting">Ожидание…</span>`;$('players').appendChild(el)}const count=ps.filter(Boolean).length;$('start').disabled=!(me===+d.host&&count>=2);$('start').style.opacity=$('start').disabled?'.45':'1';$('lobbyStatus').textContent=me===+d.host?'Ты создатель комнаты. Ждём игроков.':'Ждём создателя…'}
function leave(){running=false;players=[];bullets=[];$('hud').classList.add('hidden');$('lobby').classList.add('hidden');$('menu').classList.remove('hidden');if(ws){try{ws.close()}catch{}ws=null}loadRooms()}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}addEventListener('resize',resize);
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);if(!running)return;const scale=Math.min((innerWidth-30)/1000,(innerHeight-30)/700),ox=(innerWidth-1000*scale)/2,oy=(innerHeight-700*scale)/2;ctx.fillStyle='#071425';ctx.fillRect(ox,oy,1000*scale,700*scale);ctx.strokeStyle='#17dfff';ctx.lineWidth=5;ctx.strokeRect(ox,oy,1000*scale,700*scale);ctx.strokeStyle='#153a55';ctx.lineWidth=1;for(let x=0;x<=1000;x+=50){ctx.beginPath();ctx.moveTo(ox+x*scale,oy);ctx.lineTo(ox+x*scale,oy+700*scale);ctx.stroke()}for(let y=0;y<=700;y+=50){ctx.beginPath();ctx.moveTo(ox,oy+y*scale);ctx.lineTo(ox+1000*scale,oy+y*scale);ctx.stroke()}obstacles.forEach(o=>{ctx.fillStyle='#193453';ctx.fillRect(ox+o.x*scale,oy+o.y*scale,o.w*scale,o.h*scale);ctx.strokeStyle='#229cff';ctx.strokeRect(ox+o.x*scale,oy+o.y*scale,o.w*scale,o.h*scale)});bullets.forEach(b=>{ctx.fillStyle='#fff36a';ctx.beginPath();ctx.arc(ox+b.x*scale,oy+b.y*scale,4,0,7);ctx.fill()});players.forEach((p,i)=>{if(!p)return;const x=ox+p.x*scale,y=oy+p.y*scale,c=colors[i%colors.length];ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-4,7,0,7);ctx.fill();ctx.fillStyle='#30101b';ctx.fillRect(x-14,y-31,28,5);ctx.fillStyle='#2cff8b';ctx.fillRect(x-14,y-31,28*Math.max(0,p.hp)/100,5);ctx.fillStyle=c;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText((i===me?'YOU ':'')+p.name,x,y-39)});const p=players[me];if(p){$('hpbar').style.width=Math.max(0,p.hp)+'%';$('online').textContent=`${players.filter(Boolean).length} / ${players.length} PLAYERS`;$('score').textContent=`SCORE ${p.score||0}`}}
const stick=$('stick');stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveJoy(e)};stick.onpointermove=e=>{if(e.buttons)moveJoy(e)};stick.onpointerup=()=>{joy={x:0,y:0};$('knob').style.transform=''};function moveJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;joy={x:Math.max(-1,Math.min(1,(e.clientX-cx)/60)),y:Math.max(-1,Math.min(1,(e.clientY-cy)/60))};$('knob').style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}
setInterval(()=>{if(running&&Date.now()-lastInput>45){send({type:'input',x:joy.x,y:joy.y,aimX:1,aimY:0});lastInput=Date.now()}},50);setInterval(()=>{if(running&&fire)send({type:'shoot'})},80);setInterval(loadRooms,3000);resize();loadRooms();
</script></body></html>
