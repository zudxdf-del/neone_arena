<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>NEON ARENA 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 10px 10px;gap:8px}.panel{background:#081020d9;border:1px solid #34456d;border-radius:14px;padding:9px 12px;backdrop-filter:blur(6px)}#status{font-weight:800}#score{font-size:14px}.lobby,.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,460px);max-height:90vh;overflow:auto;text-align:center;pointer-events:auto;z-index:10}.lobby{padding:20px}h1{margin:0 0 4px;font-size:40px;letter-spacing:2px}.sub{color:#aeb9d6;line-height:1.4;margin:8px 0 16px}button,input{font:inherit}button{border:0;border-radius:13px;padding:13px 16px;margin:5px;background:#6558ff;color:#fff;font-weight:900;font-size:16px;width:calc(100% - 10px)}button.secondary{background:#1d2943}input{width:calc(100% - 10px);padding:13px;border-radius:12px;border:1px solid #3a4a70;background:#0c1425;color:#fff;font-size:18px;text-align:center;margin:4px 5px}.hidden{display:none!important}.small{font-size:13px;color:#98a7ca}.rooms{margin-top:8px;text-align:left}.room{display:flex;align-items:center;gap:9px;background:#101a2d;border:1px solid #35466d;border-radius:12px;padding:10px;margin:7px 0}.icon{font-size:24px;width:30px;text-align:center}.roominfo{flex:1;min-width:0}.roomname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roommeta{font-size:12px;color:#96a5c8;margin-top:2px}.room button{width:auto;margin:0;padding:8px 11px;font-size:12px}.check{display:flex;align-items:center;gap:8px;text-align:left;margin:8px 5px;color:#c8d2ea}.check input{width:20px;margin:0}.locked{color:#ff9fbd}.open{color:#75f6ff}#roomRefresh{background:#1d2943}#fullscreen{position:fixed;right:12px;top:58px;width:auto;margin:0;padding:10px 12px;font-size:13px;z-index:4;pointer-events:auto;background:#101a2dd9}.crosshair{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);pointer-events:none}.crosshair:before,.crosshair:after{content:'';position:absolute;background:#fff;box-shadow:0 0 8px #62eaff}.crosshair:before{width:2px;height:24px;left:11px;top:0}.crosshair:after{width:24px;height:2px;left:0;top:11px}.mobileControls{position:fixed;left:0;right:0;bottom:0;height:42%;pointer-events:none}.stick{position:absolute;left:20px;bottom:max(20px,env(safe-area-inset-bottom));width:145px;height:145px;border-radius:50%;background:#17233ecc;border:1px solid #52658f;pointer-events:auto;touch-action:none}.knob{width:62px;height:62px;border-radius:50%;background:#6558ff;position:absolute;left:41px;top:41px;box-shadow:0 0 24px #6558ff88}.fire{position:absolute;right:22px;bottom:max(28px,env(safe-area-inset-bottom));width:105px;height:105px;border-radius:50%;background:#ff3f78;border:2px solid #ff9fba;pointer-events:auto;touch-action:none;box-shadow:0 0 25px #ff3f7866}.lookHint{position:absolute;right:12px;bottom:145px;width:145px;text-align:center;color:#cbd5ed;font-size:12px;text-shadow:0 2px 5px #000}.health{position:fixed;left:12px;bottom:max(20px,env(safe-area-inset-bottom));width:190px;height:14px;border:1px solid #566789;border-radius:8px;background:#101727aa;overflow:hidden}.health i{display:block;height:100%;width:100%;background:#4ce7a1}
</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="panel" id="status">Готово</div><div class="panel" id="score">0 : 0</div></div><button id="fullscreen">⛶ НА ВЕСЬ ЭКРАН</button><div class="crosshair"></div><div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><div class="sub"><b>3D ONLINE SHOOTER</b><br>Двигайся, прячься за препятствиями и стреляй.</div><input id="name" maxlength="20" placeholder="Твоё имя" value="Игрок"><button id="create">🎮 СОЗДАТЬ ИГРУ</button><button id="join">🔎 ВОЙТИ В ИГРУ</button><div id="msg" class="small"></div></div><div id="modal" class="panel modal hidden"><h2 id="modalTitle">Создать игру</h2><div id="createFields"><input id="roomName" maxlength="30" placeholder="Название комнаты" value="Неоновая арена"><label class="check"><input type="checkbox" id="usePass"> 🔒 Сделать комнату по паролю</label><input id="roomPass" class="hidden" maxlength="40" placeholder="Пароль комнаты"></div><div id="joinFields" class="hidden"><button id="roomRefresh" class="secondary">🔄 ОБНОВИТЬ КОМНАТЫ</button><div id="rooms" class="rooms"><div class="small">Загрузка комнат…</div></div></div><button id="modalAction">СОЗДАТЬ</button><button id="modalClose" class="secondary">НАЗАД</button><div id="modalMsg" class="small"></div></div><div id="mobileControls" class="mobileControls hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="lookHint">Води пальцем по правой части экрана — поворот</div><button id="fire" class="fire">ОГОНЬ</button><div class="health"><i id="hpbar"></i></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
const $=id=>document.getElementById(id),canvas=$('game'),status=$('status'),score=$('score'),lobby=$('lobby'),modal=$('modal'),msg=$('msg'),modalMsg=$('modalMsg'),mobile=$('mobileControls');
const WORLD={w:1000,h:700};const S={ws:null,me:0,started:false,players:[{x:250,y:350,hp:100,score:0,name:'Игрок 1'},{x:750,y:350,hp:100,score:0,name:'Игрок 2'}],bullets:[],obstacles:[],keys:{},joy:{x:0,y:0},yaw:0,roomTimer:null};
const setStatus=t=>status.textContent=t;function playerName(){return($('name').value.trim()||'Игрок').slice(0,20)}function showError(t){modalMsg.textContent=t;msg.textContent=t;setStatus('Ошибка')}
function openCreate(){stopRoomRefresh();$('modalTitle').textContent='Создать игру';$('createFields').classList.remove('hidden');$('joinFields').classList.add('hidden');$('modalAction').classList.remove('hidden');$('modalAction').textContent='СОЗДАТЬ';modalMsg.textContent='';modal.classList.remove('hidden')}
function openJoin(){$('modalTitle').textContent='Выбери комнату';$('createFields').classList.add('hidden');$('joinFields').classList.remove('hidden');$('modalAction').classList.add('hidden');modalMsg.textContent='';modal.classList.remove('hidden');loadRooms();startRoomRefresh()}
function closeModal(){stopRoomRefresh();modal.classList.add('hidden')}
$('create').onclick=openCreate;$('join').onclick=openJoin;$('modalClose').onclick=closeModal;$('roomRefresh').onclick=loadRooms;$('usePass').onchange=()=>{$('roomPass').classList.toggle('hidden',!$('usePass').checked);if(!$('usePass').checked)$('roomPass').value=''};
async function loadRooms(){if(modal.classList.contains('hidden')||$('joinFields').classList.contains('hidden'))return;const rooms=$('rooms');rooms.innerHTML='<div class="small">🔄 Обновляем список комнат…</div>';try{const r=await fetch('/rooms?x='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.rooms.length){rooms.innerHTML='<div class="small">Сейчас нет созданных комнат.<br>Создай игру первым.</div>';return}rooms.innerHTML=d.rooms.map(r=>`<div class="room"><div class="icon ${r.locked?'locked':'open'}">${r.locked?'🔒':'🌐'}</div><div class="roominfo"><div class="roomname">${esc(r.name)}</div><div class="roommeta">${esc(r.host)} · ${r.players}/${r.maxPlayers} игрока · ${r.locked?'по паролю':'открытая'}</div></div><button onclick="chooseRoom('${r.code}','${escAttr(r.name)}',${r.locked})">ВОЙТИ</button></div>`).join('')}catch(e){rooms.innerHTML='<div class="small">Не удалось загрузить список комнат.</div>'}}
function startRoomRefresh(){stopRoomRefresh();S.roomTimer=setInterval(loadRooms,3000)}function stopRoomRefresh(){if(S.roomTimer){clearInterval(S.roomTimer);S.roomTimer=null}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
window.chooseRoom=(code,name,locked)=>{if(locked){const p=prompt('Введите пароль комнаты «'+name+'»:');if(p===null)return;stopRoomRefresh();connect('join',code,p)}else{stopRoomRefresh();connect('join',code,'')}};
$('modalAction').onclick=()=>connect('create','',$('usePass').checked?$('roomPass').value:'',$('roomName').value);
function connect(action,roomCode='',password='',roomName=''){if(S.ws&&S.ws.readyState===1){S.ws.send(JSON.stringify({type:action,name:playerName(),room:roomCode,password,roomName}));closeModal();return}if(S.ws&&S.ws.readyState===0)return;const url=(location.protocol==='https:'?'wss://':'ws://')+location.host;try{S.ws=new WebSocket(url)}catch(e){showError('Не удалось открыть соединение');return}S.ws.onopen=()=>{S.ws.send(JSON.stringify({type:action,name:playerName(),room:roomCode,password,roomName}));setStatus(action==='create'?'Создание комнаты…':'Подключение к комнате…')};S.ws.onmessage=e=>{try{onData(JSON.parse(e.data))}catch(_){}};S.ws.onclose=()=>{if(S.started)stop('Сервер отключён')};S.ws.onerror=()=>showError('Не удалось подключиться к серверу')}
function onData(d){if(d.type==='created'){S.me=d.player??0;msg.textContent='Комната «'+(d.roomName||'')+'» создана. Ждём игрока…';setStatus('Ожидание игрока');closeModal();return}if(d.type==='password_required'){const p=prompt('Комната «'+d.roomName+'» защищена паролем:');if(p===null)return;connect('join',d.room,p);return}if(d.type==='start'){S.me=d.player??0;if(d.players){S.players[0].name=d.players[0]?.name||S.players[0].name;S.players[1].name=d.players[1]?.name||S.players[1].name}showGame();return}if(d.type==='snapshot'){S.players=d.players;S.bullets=d.bullets;if(d.obstacles)S.obstacles=d.obstacles;return}if(d.type==='round'){msg.textContent='Раунд завершён. Создай новую комнату или войди в другую.';setTimeout(()=>stop('Игра завершена'),1200);return}if(d.type==='opponent_left'){stop('Соперник отключился');return}if(d.type==='error'){showError(d.message||'Ошибка');if(S.ws){try{S.ws.close()}catch(_){}}}}
function showGame(){stopRoomRefresh();lobby.classList.add('hidden');modal.classList.add('hidden');mobile.classList.remove('hidden');S.started=true;setStatus('Игра идёт');buildWorld()}
function stop(t){stopRoomRefresh();S.started=false;mobile.classList.add('hidden');lobby.classList.remove('hidden');modal.classList.add('hidden');setStatus(t);if(S.ws){try{S.ws.close()}catch(_){}}S.ws=null}
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070d);scene.fog=new THREE.Fog(0x05070d,650,1250);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1600);camera.position.set(0,1.7,0);scene.add(new THREE.HemisphereLight(0x9cb6ff,0x10131f,1.8));const sun=new THREE.DirectionalLight(0x9fb8ff,2.2);sun.position.set(200,400,100);scene.add(sun);const worldGroup=new THREE.Group();scene.add(worldGroup);const playerMeshes=[null,null],bulletMeshes=new Map();
function clearWorld(){while(worldGroup.children.length)worldGroup.remove(worldGroup.children[0]);playerMeshes[0]=playerMeshes[1]=null;bulletMeshes.clear()}
function buildWorld(){clearWorld();const floor=new THREE.Mesh(new THREE.PlaneGeometry(WORLD.w,WORLD.h),new THREE.MeshStandardMaterial({color:0x101827,roughness:.9,metalness:.15}));floor.rotation.x=-Math.PI/2;floor.position.set(WORLD.w/2,0,WORLD.h/2);worldGroup.add(floor);const grid=new THREE.GridHelper(WORLD.w,40,0x28405c,0x172538);grid.position.set(WORLD.w/2,.02,WORLD.h/2);worldGroup.add(grid);const wallMat=new THREE.MeshStandardMaterial({color:0x1e2942,roughness:.75,metalness:.25});for(const o of S.obstacles){const m=new THREE.Mesh(new THREE.BoxGeometry(o.w,2.8,o.h),wallMat);m.position.set(o.x+o.w/2,1.4,o.y+o.h/2);worldGroup.add(m);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x5b6fff}));m.add(edge)}for(const [x,z,w,h] of [[WORLD.w/2,-4,WORLD.w,8],[WORLD.w/2,WORLD.h+4,WORLD.w,8],[-4,WORLD.h/2,8,WORLD.h],[WORLD.w+4,WORLD.h/2,8,WORLD.h]]){const m=new THREE.Mesh(new THREE.BoxGeometry(w,5,h),new THREE.MeshStandardMaterial({color:0x121a2b}));m.position.set(x,2.5,z);worldGroup.add(m)}for(let i=0;i<2;i++){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.0,4,8),new THREE.MeshStandardMaterial({color:i===0?0x39ddff:0xff467e,emissive:i===0?0x062b3a:0x3a0617,emissiveIntensity:.8}));body.position.y=1;g.add(body);worldGroup.add(g);playerMeshes[i]=g}}
function updateScene(){if(!S.started)return;for(let i=0;i<2;i++){const p=S.players[i],g=playerMeshes[i];if(!g)continue;g.position.set(p.x,0,p.y);g.visible=p.hp>0;g.rotation.y=-S.yaw+(i===S.me?0:Math.PI)}const me=S.players[S.me];camera.position.set(me.x,1.65,me.y);camera.rotation.order='YXZ';camera.rotation.y=-S.yaw;camera.rotation.x=0;score.textContent=`${S.players[0].score} : ${S.players[1].score}`;$('hpbar').style.width=Math.max(0,S.players[S.me].hp)+'%'}
function syncBullets(){S.bullets.forEach((b,i)=>{let m=bulletMeshes.get(i);if(!m){m=new THREE.Mesh(new THREE.SphereGeometry(.11,6,6),new THREE.MeshBasicMaterial({color:b.owner===S.me?0x7ff6ff:0xff5689}));worldGroup.add(m);bulletMeshes.set(i,m)}m.position.set(b.x,.9,b.y)});for(const [i,m] of bulletMeshes)if(i>=S.bullets.length){worldGroup.remove(m);m.geometry.dispose();m.material.dispose();bulletMeshes.delete(i)}}
let jp=null;function joyMove(e){const r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=52,l=Math.hypot(dx,dy)||1,x=Math.min(m,dx/l*m),y=Math.min(m,dy/l*m);S.joy.x=x/m;S.joy.y=y/m;$('knob').style.left=41+x+'px';$('knob').style.top=41+y+'px'}$('stick').onpointerdown=e=>{jp=e.pointerId;$('stick').setPointerCapture(jp);joyMove(e)};$('stick').onpointermove=e=>{if(e.pointerId===jp)joyMove(e)};$('stick').onpointerup=$('stick').onpointercancel=e=>{if(e.pointerId===jp){jp=null;S.joy.x=S.joy.y=0;$('knob').style.left='41px';$('knob').style.top='41px'}};
let lookId=null,lastLookX=0;$('mobileControls').addEventListener('pointerdown',e=>{if(e.target.closest('.stick')||e.target.closest('#fire'))return;if(e.clientX<innerWidth*.38)return;lookId=e.pointerId;lastLookX=e.clientX});$('mobileControls').addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastLookX;lastLookX=e.clientX;S.yaw-=dx*.008});$('mobileControls').addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});$('mobileControls').addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});
addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);$('fire').onpointerdown=e=>{e.preventDefault();shoot()};function shoot(){send({type:'shoot'})}
setInterval(()=>{if(!S.started)return;let x=((S.keys.d||S.keys.arrowright)?1:0)-((S.keys.a||S.keys.arrowleft)?1:0)+S.joy.x,y=((S.keys.s||S.keys.arrowdown)?1:0)-((S.keys.w||S.keys.arrowup)?1:0)+S.joy.y,l=Math.hypot(x,y)||1;if(l>1){x/=l;y/=l}send({type:'input',x,y,aimX:Math.sin(S.yaw),aimY:Math.cos(S.yaw)})},40);
$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();if(screen.orientation?.lock)try{await screen.orientation.lock('landscape')}catch(_){}}else await document.exitFullscreen()}catch(_){alert('Полный экран не поддерживается этим браузером.')}};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
function send(d){if(S.ws?.readyState===1)S.ws.send(JSON.stringify(d))}function animate(){requestAnimationFrame(animate);updateScene();syncBullets();renderer.render(scene,camera)}animate();
</script></body></html>
