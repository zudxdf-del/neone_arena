<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>NEON ARENA 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 10px 10px;gap:8px}.panel{background:#081020dd;border:1px solid #34456d;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px)}#status{font-weight:900}#score{font-size:14px}.lobby,.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,460px);max-height:90vh;overflow:auto;text-align:center;pointer-events:auto;z-index:10}.lobby{padding:20px}h1{margin:0;font-size:42px;letter-spacing:3px}.sub{color:#aeb9d6;line-height:1.45;margin:7px 0 15px}button,input{font:inherit}button{border:0;border-radius:13px;padding:13px 16px;margin:5px;background:#6558ff;color:#fff;font-weight:900;font-size:16px;width:calc(100% - 10px)}button.secondary{background:#1d2943}button:active{transform:scale(.98)}input{width:calc(100% - 10px);padding:13px;border-radius:12px;border:1px solid #3a4a70;background:#0c1425;color:#fff;font-size:18px;text-align:center;margin:4px 5px}.hidden{display:none!important}.small{font-size:13px;color:#98a7ca}.rooms{margin-top:8px;text-align:left}.room{display:flex;align-items:center;gap:9px;background:#101a2d;border:1px solid #35466d;border-radius:12px;padding:10px;margin:7px 0}.icon{font-size:24px;width:30px;text-align:center}.roominfo{flex:1;min-width:0}.roomname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roommeta{font-size:12px;color:#96a5c8;margin-top:2px}.room button{width:auto;margin:0;padding:8px 11px;font-size:12px}.check{display:flex;align-items:center;gap:8px;text-align:left;margin:8px 5px;color:#c8d2ea}.check input{width:20px;margin:0}.locked{color:#ff9fbd}.open{color:#75f6ff}#roomRefresh{background:#1d2943}#fullscreen{position:fixed;right:12px;top:58px;width:auto;margin:0;padding:10px 12px;font-size:13px;z-index:5;pointer-events:auto;background:#101a2ddd}.crosshair{position:fixed;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}.crosshair:before,.crosshair:after{content:'';position:absolute;background:#fff;box-shadow:0 0 9px #62eaff}.crosshair:before{width:2px;height:26px;left:12px}.crosshair:after{width:26px;height:2px;top:12px}.hudBottom{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:none}.weaponHud{min-width:150px;text-align:center;font-weight:900}.weaponHud b{font-size:19px}.health{position:fixed;left:12px;bottom:max(20px,env(safe-area-inset-bottom));width:190px;height:15px;border:1px solid #566789;border-radius:8px;background:#101727cc;overflow:hidden}.health i{display:block;height:100%;width:100%;background:#4ce7a1;transition:width .15s}.mobileControls{position:fixed;left:0;right:0;bottom:0;height:48%;pointer-events:none}.stick{position:absolute;left:20px;bottom:max(24px,env(safe-area-inset-bottom));width:145px;height:145px;border-radius:50%;background:#17233ecc;border:1px solid #52658f;pointer-events:auto;touch-action:none}.knob{width:62px;height:62px;border-radius:50%;background:#6558ff;position:absolute;left:41px;top:41px;box-shadow:0 0 24px #6558ff88}.fire{position:absolute;right:22px;bottom:max(28px,env(safe-area-inset-bottom));width:105px;height:105px;border-radius:50%;background:#ff3f78;border:2px solid #ff9fba;pointer-events:auto;touch-action:none;box-shadow:0 0 25px #ff3f7866}.reloadBtn,.jumpBtn{position:absolute;width:78px;height:52px;padding:5px;font-size:12px;pointer-events:auto;background:#1d2943cc}.reloadBtn{right:140px;bottom:max(38px,env(safe-area-inset-bottom))}.jumpBtn{right:140px;bottom:max(98px,calc(env(safe-area-inset-bottom) + 98px))}.weaponBtns{position:absolute;right:22px;top:55px;display:flex;gap:5px;pointer-events:auto}.weaponBtns button{width:auto;margin:0;padding:8px 10px;font-size:11px;background:#101a2ddd}.weaponBtns button.active{background:#6558ff}.lookHint{position:absolute;right:18px;bottom:145px;width:150px;text-align:center;color:#cbd5ed;font-size:11px;text-shadow:0 2px 5px #000}.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:9px 14px;border-radius:12px;background:#0a1220ee;border:1px solid #53688f;color:#fff;font-weight:800;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="panel" id="status">Готово</div><div class="panel" id="score">0 : 0</div></div><button id="fullscreen">⛶ НА ВЕСЬ ЭКРАН</button><div class="crosshair"></div><div id="toast" class="toast"></div><div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><div class="sub"><b>3D ONLINE SHOOTER</b><br>Оружие · укрытия · перезарядка · прыжок</div><input id="name" maxlength="20" placeholder="Твоё имя" value="Игрок"><button id="create">🎮 СОЗДАТЬ ИГРУ</button><button id="join">🔎 ВОЙТИ В ИГРУ</button><div id="msg" class="small"></div></div><div id="modal" class="panel modal hidden"><h2 id="modalTitle">Создать игру</h2><div id="createFields"><input id="roomName" maxlength="30" placeholder="Название комнаты" value="Неоновая арена"><label class="check"><input type="checkbox" id="usePass"> 🔒 Комната по паролю</label><input id="roomPass" class="hidden" maxlength="40" placeholder="Пароль комнаты"></div><div id="joinFields" class="hidden"><button id="roomRefresh" class="secondary">🔄 ОБНОВИТЬ КОМНАТЫ</button><div id="rooms" class="rooms"><div class="small">Загрузка…</div></div></div><button id="modalAction">СОЗДАТЬ</button><button id="modalClose" class="secondary">НАЗАД</button><div id="modalMsg" class="small"></div></div><div id="mobileControls" class="mobileControls hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="lookHint">Левая часть — движение<br>Правая часть — обзор</div><button id="jump" class="jumpBtn">⬆ ПРЫЖОК</button><button id="reload" class="reloadBtn">↻ RELOAD</button><div class="weaponBtns"><button data-w="pistol">PISTOL</button><button data-w="smg">SMG</button><button data-w="shotgun">SHOTGUN</button></div><button id="fire" class="fire">ОГОНЬ</button></div><div class="health"><i id="hpbar"></i></div><div class="hudBottom"><div class="panel weaponHud"><b id="weaponName">PISTOL</b><br><span id="ammo">12 / 12</span></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
const $=id=>document.getElementById(id),canvas=$('game'),status=$('status'),score=$('score'),lobby=$('lobby'),modal=$('modal'),mobile=$('mobileControls'),toast=$('toast');
const WORLD={w:1000,h:700};const S={ws:null,me:0,started:false,players:[{x:250,y:350,hp:100,score:0,name:'Игрок 1',weapon:'pistol',ammo:12,reloading:false},{x:750,y:350,hp:100,score:0,name:'Игрок 2',weapon:'pistol',ammo:12,reloading:false}],bullets:[],obstacles:[],keys:{},joy:{x:0,y:0},yaw:0,pitch:0,roomTimer:null,fire:false,jump:false,lastSend:0,lastShotFx:0,jumping:0};
const guns={pistol:{label:'PISTOL',mag:12},smg:{label:'SMG',mag:30},shotgun:{label:'SHOTGUN',mag:6}};const setStatus=t=>status.textContent=t;const me=()=>S.players[S.me]||S.players[0];function playerName(){return($('name').value.trim()||'Игрок').slice(0,20)}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1300)}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function openCreate(){stopRoomRefresh();$('modalTitle').textContent='Создать игру';$('createFields').classList.remove('hidden');$('joinFields').classList.add('hidden');$('modalAction').classList.remove('hidden');$('modalAction').textContent='СОЗДАТЬ';$('modalMsg').textContent='';modal.classList.remove('hidden')}
function openJoin(){$('modalTitle').textContent='Выбери комнату';$('createFields').classList.add('hidden');$('joinFields').classList.remove('hidden');$('modalAction').classList.add('hidden');$('modalMsg').textContent='';modal.classList.remove('hidden');loadRooms();startRoomRefresh()}
function closeModal(){stopRoomRefresh();modal.classList.add('hidden')}$('create').onclick=openCreate;$('join').onclick=openJoin;$('modalClose').onclick=closeModal;$('roomRefresh').onclick=loadRooms;$('usePass').onchange=()=>{$('roomPass').classList.toggle('hidden',!$('usePass').checked);if(!$('usePass').checked)$('roomPass').value=''};
async function loadRooms(){if(modal.classList.contains('hidden')||$('joinFields').classList.contains('hidden'))return;const box=$('rooms');try{const r=await fetch('/rooms?x='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.rooms.length){box.innerHTML='<div class="small">Сейчас нет комнат.<br>Создай игру первым.</div>';return}box.innerHTML=d.rooms.map(r=>`<div class="room"><div class="icon ${r.locked?'locked':'open'}">${r.locked?'🔒':'🌐'}</div><div class="roominfo"><div class="roomname">${esc(r.name)}</div><div class="roommeta">${esc(r.host)} · ${r.players}/${r.maxPlayers} · ${r.locked?'по паролю':'открытая'}</div></div><button onclick="chooseRoom('${r.code}','${escAttr(r.name)}',${r.locked})">ВОЙТИ</button></div>`).join('')}catch{box.innerHTML='<div class="small">Не удалось загрузить комнаты.</div>'}}
function startRoomRefresh(){stopRoomRefresh();S.roomTimer=setInterval(loadRooms,3000)}function stopRoomRefresh(){if(S.roomTimer){clearInterval(S.roomTimer);S.roomTimer=null}}
window.chooseRoom=(code,name,locked)=>{const p=locked?prompt('Пароль комнаты «'+name+'»:'):'';if(locked&&p===null)return;stopRoomRefresh();connect('join',code,p||'')};$('modalAction').onclick=()=>connect('create','',$('usePass').checked?$('roomPass').value:'',$('roomName').value);
function connect(action,roomCode='',password='',roomName=''){if(S.ws&&S.ws.readyState===1){S.ws.send(JSON.stringify({type:action,name:playerName(),room:roomCode,password,roomName}));closeModal();return}if(S.ws&&S.ws.readyState===0)return;const url=(location.protocol==='https:'?'wss://':'ws://')+location.host;S.ws=new WebSocket(url);S.ws.onopen=()=>{S.ws.send(JSON.stringify({type:action,name:playerName(),room:roomCode,password,roomName}));setStatus(action==='create'?'Создание комнаты…':'Подключение…')};S.ws.onmessage=e=>{try{onData(JSON.parse(e.data))}catch{}};S.ws.onerror=()=>showToast('Ошибка соединения');S.ws.onclose=()=>{if(S.started)stop('Сервер отключён')}}
function onData(d){if(d.type==='created'){S.me=d.player??0;$('msg').textContent='Комната «'+(d.roomName||'')+'» создана. Ждём второго игрока…';setStatus('Ожидание игрока');closeModal();return}if(d.type==='password_required'){const p=prompt('Введите пароль комнаты:');if(p!==null)connect('join',d.room,p);return}if(d.type==='start'){S.me=d.player??0;if(d.players){S.players[0].name=d.players[0]?.name||S.players[0].name;S.players[1].name=d.players[1]?.name||S.players[1].name}showGame();return}if(d.type==='snapshot'){S.players=d.players;S.bullets=d.bullets;if(d.obstacles)S.obstacles=d.obstacles;updateHud();return}if(d.type==='round'){showToast(d.winner===S.me?'🏆 ПОБЕДА!':'💥 ПОРАЖЕНИЕ');$('msg').textContent='Раунд завершён. Создай новую комнату или войди в другую.';setTimeout(()=>stop('Раунд завершён'),1300);return}if(d.type==='opponent_left'){stop('Соперник отключился');return}if(d.type==='error'){$('modalMsg').textContent=d.message||'Ошибка';$('msg').textContent=d.message||'Ошибка';setStatus('Ошибка');if(S.ws)S.ws.close()}}
function showGame(){stopRoomRefresh();lobby.classList.add('hidden');modal.classList.add('hidden');mobile.classList.remove('hidden');S.started=true;setStatus('Игра идёт');buildWorld();updateHud();requestFullscreen()}
function stop(t){stopRoomRefresh();S.started=false;S.fire=false;S.joy.x=S.joy.y=0;$('knob').style.transform='translate(0,0)';mobile.classList.add('hidden');lobby.classList.remove('hidden');modal.classList.add('hidden');setStatus(t);if(S.ws){try{S.ws.close()}catch{}}S.ws=null}
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070d);scene.fog=new THREE.Fog(0x05070d,550,1300);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,1600);camera.position.set(250,1.7,350);scene.add(new THREE.HemisphereLight(0x9cb6ff,0x10131f,1.8));const sun=new THREE.DirectionalLight(0xa9c5ff,2.4);sun.position.set(300,500,150);scene.add(sun);const worldGroup=new THREE.Group();scene.add(worldGroup);const playerMeshes=[null,null],bulletMeshes=new Map(),muzzle=new THREE.Group();camera.add(muzzle);scene.add(camera);
function clearWorld(){while(worldGroup.children.length)worldGroup.remove(worldGroup.children[0]);playerMeshes[0]=playerMeshes[1]=null;bulletMeshes.clear()}
function makeNeonBox(o){const mat=new THREE.MeshStandardMaterial({color:0x202b46,roughness:.7,metalness:.35});const m=new THREE.Mesh(new THREE.BoxGeometry(o.w,3.2,o.h),mat);m.position.set(o.x+o.w/2,1.6,o.y+o.h/2);worldGroup.add(m);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x6a73ff})));return m}
function buildWorld(){clearWorld();const floor=new THREE.Mesh(new THREE.PlaneGeometry(WORLD.w,WORLD.h),new THREE.MeshStandardMaterial({color:0x0d1422,roughness:.95,metalness:.12}));floor.rotation.x=-Math.PI/2;floor.position.set(WORLD.w/2,0,WORLD.h/2);worldGroup.add(floor);const grid=new THREE.GridHelper(WORLD.w,50,0x28405c,0x162235);grid.position.set(WORLD.w/2,.02,WORLD.h/2);worldGroup.add(grid);for(const o of S.obstacles)makeNeonBox(o);const neon=new THREE.LineBasicMaterial({color:0x2edfff});const pts=[new THREE.Vector3(0,.05,0),new THREE.Vector3(WORLD.w,.05,0),new THREE.Vector3(WORLD.w,.05,WORLD.h),new THREE.Vector3(0,.05,WORLD.h),new THREE.Vector3(0,.05,0)];worldGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),neon));}
function playerMesh(i){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.1,6,10),new THREE.MeshStandardMaterial({color:i===S.me?0x62eaff:0xff3f78,emissive:i===S.me?0x073a55:0x4a061e,emissiveIntensity:1.3,metalness:.35,roughness:.45}));body.position.y=1.05;g.add(body);const visor=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,.7),new THREE.MeshStandardMaterial({color:0xdffcff,emissive:0x3be8ff,emissiveIntensity:2}));visor.position.set(0,1.38,.18);g.add(visor);worldGroup.add(g);return g}
function updatePlayers(){for(let i=0;i<2;i++){const p=S.players[i];if(!p)continue;if(!playerMeshes[i])playerMeshes[i]=playerMesh(i);const m=playerMeshes[i];m.position.set(p.x,0,p.y);m.visible=i!==S.me; m.rotation.y=Math.atan2(p.y-(i===S.me?S.players[i].y:p.y),p.x-(i===S.me?S.players[i].x:p.x))}}
function syncBullets(){const live=new Set(S.bullets.map(b=>b.id));for(const [id,m] of bulletMeshes)if(!live.has(id)){worldGroup.remove(m);bulletMeshes.delete(id)}for(const b of S.bullets){let m=bulletMeshes.get(b.id);if(!m){m=new THREE.Mesh(new THREE.SphereGeometry(5,8,8),new THREE.MeshBasicMaterial({color:b.owner===S.me?0x62eaff:0xff3f78}));bulletMeshes.set(b.id,m);worldGroup.add(m)}m.position.set(b.x,1.2,b.y)}}
function updateHud(){const p=me();if(!p)return;score.textContent=(S.players[0]?.score||0)+' : '+(S.players[1]?.score||0);$('hpbar').style.width=Math.max(0,p.hp)+'%';$('weaponName').textContent=(guns[p.weapon]?.label||p.weapon||'PISTOL')+(p.reloading?' · RELOAD':'');$('ammo').textContent=p.reloading?'ПЕРЕЗАРЯДКА':(p.ammo+' / '+(guns[p.weapon]?.mag||12));document.querySelectorAll('.weaponBtns button').forEach(b=>b.classList.toggle('active',b.dataset.w===p.weapon))}
function sendInput(){if(!S.ws||S.ws.readyState!==1||!S.started)return;const forwardX=Math.sin(S.yaw),forwardY=Math.cos(S.yaw),rightX=Math.cos(S.yaw),rightY=-Math.sin(S.yaw);const x=S.joy.x*rightX+(-S.joy.y)*forwardX,y=S.joy.x*rightY+(-S.joy.y)*forwardY;S.ws.send(JSON.stringify({type:'input',x,y,aimX:Math.sin(S.yaw),aimY:Math.cos(S.yaw)}))}
function chooseWeapon(w){if(!S.ws||S.ws.readyState!==1)return;S.ws.send(JSON.stringify({type:'weapon',weapon:w}));showToast(guns[w].label)}
function shoot(){if(!S.ws||S.ws.readyState!==1||!S.started)return;S.ws.send(JSON.stringify({type:'shoot'}));S.lastShotFx=performance.now();muzzleFlash()}
function muzzleFlash(){muzzle.clear();const geo=new THREE.ConeGeometry(.08,.45,8),mat=new THREE.MeshBasicMaterial({color:0xffdf75});const f=new THREE.Mesh(geo,mat);f.rotation.x=Math.PI/2;f.position.set(0,-.12,-.75);muzzle.add(f);setTimeout(()=>muzzle.clear(),55)}
function requestFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{})}catch{}}
$('fullscreen').onclick=requestFullscreen;$('reload').onclick=()=>{if(S.ws?.readyState===1)S.ws.send(JSON.stringify({type:'reload'}));showToast('↻ Перезарядка')};$('jump').onclick=()=>{if(!S.started)return;S.jumping=performance.now();showToast('⬆ Прыжок')};document.querySelectorAll('.weaponBtns button').forEach(b=>b.onclick=()=>chooseWeapon(b.dataset.w));
const stick=$('stick'),knob=$('knob');let stickId=null;function setJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.38,l=Math.hypot(dx,dy)||1,k=Math.min(1,max/l);S.joy.x=dx/max*k;S.joy.y=dy/max*k;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setJoy(e)});stick.addEventListener('pointerup',e=>{if(e.pointerId===stickId){stickId=null;S.joy.x=S.joy.y=0;knob.style.transform='translate(0,0)'}});stick.addEventListener('pointercancel',()=>{stickId=null;S.joy.x=S.joy.y=0;knob.style.transform='translate(0,0)'});
let lookId=null,lastX=0,lastY=0;canvas.addEventListener('pointerdown',e=>{if(!S.started||e.clientX<innerWidth*.48)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(lookId)});canvas.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;S.yaw-=dx*.006;S.pitch=Math.max(-.65,Math.min(.65,S.pitch-dy*.004))});canvas.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});canvas.addEventListener('pointercancel',()=>lookId=null);
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();S.fire=true;shoot()});$('fire').addEventListener('pointerup',()=>S.fire=false);$('fire').addEventListener('pointercancel',()=>S.fire=false);$('fire').addEventListener('pointerleave',()=>S.fire=false);
addEventListener('keydown',e=>{S.keys[e.code]=true;if(e.code==='Space')S.jumping=performance.now();if(e.code==='KeyR')$('reload').click();if(e.code==='Digit1')chooseWeapon('pistol');if(e.code==='Digit2')chooseWeapon('smg');if(e.code==='Digit3')chooseWeapon('shotgun');if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>S.keys[e.code]=false);
function desktopInput(){if(innerWidth<700)return;let x=0,y=0;if(S.keys.KeyA||S.keys.ArrowLeft)x--;if(S.keys.KeyD||S.keys.ArrowRight)x++;if(S.keys.KeyW||S.keys.ArrowUp)y++;if(S.keys.KeyS||S.keys.ArrowDown)y--;S.joy.x=x;S.joy.y=-y;S.fire=!!S.keys.Space}
function render(){requestAnimationFrame(render);desktopInput();if(S.started){sendInput();if(S.fire&&performance.now()-S.lastShotFx>120)shoot();updatePlayers();syncBullets();const p=me();if(p){const jumpT=(performance.now()-S.jumping);let jy=0;if(jumpT>=0&&jumpT<650)jy=Math.sin(jumpT/650*Math.PI)*1.1;const fx=Math.sin(S.yaw),fz=Math.cos(S.yaw);camera.position.set(p.x+fx*.25,1.55+jy,p.y+fz*.25);camera.rotation.order='YXZ';camera.rotation.y=S.yaw;camera.rotation.x=S.pitch;camera.rotation.z=0}}renderer.render(scene,camera)}render();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});
</script></body></html>
