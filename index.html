<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#eef6ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>NEON ARENA 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9ecfa;color:#10243a;font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 10px 10px}.panel{background:#f8fcffe8;border:1px solid #9cb8d2;border-radius:14px;padding:9px 12px;box-shadow:0 5px 20px #31577a22;backdrop-filter:blur(8px)}#status,#score{font-weight:900}.lobby,.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,460px);max-height:90vh;overflow:auto;text-align:center;pointer-events:auto;z-index:20}.lobby{padding:20px}h1{margin:0;font-size:42px;letter-spacing:3px}.sub{color:#49627c;line-height:1.45;margin:7px 0 15px}button,input{font:inherit}button{border:0;border-radius:13px;padding:13px 16px;margin:5px;background:#2563eb;color:#fff;font-weight:900;font-size:16px;width:calc(100% - 10px)}button.secondary{background:#dce7f4;color:#17304b}input{width:calc(100% - 10px);padding:13px;border-radius:12px;border:1px solid #9db5d0;background:#fff;color:#07111f;font-size:18px;text-align:center;margin:4px 5px}.hidden{display:none!important}.small{font-size:13px;color:#5b7189}.rooms{margin-top:8px;text-align:left}.room{display:flex;align-items:center;gap:9px;background:#eef5fc;border:1px solid #b5c8dd;border-radius:12px;padding:10px;margin:7px 0}.icon{font-size:24px;width:30px;text-align:center}.roominfo{flex:1;min-width:0}.roomname{font-weight:800;white-space:nowrap;overf font-size:11px;text-shadow:0 1px 5px #fff}.health{position:fixed;left:12px;bottom:max(20px,env(safe-area-inset-bottom));width:190px;height:16px;border:2px solid #49657f;border-radius:8px;background:#fff9;overflow:hidden}.health i{display:block;height:100%;width:100%;background:#16b978}.hudBottom{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:none}.weaponHud{min-width:150px;text-align:center}.weaponHud b{font-size:18px}.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:9px 14px;border-radius:12px;background:#10243ded;color:#fff;font-weight:900;opacity:0;transition:.15s}.toast.show{opacity:1}.hit{position:fixed;inset:0;background:#ff204855;opacity:0;pointer-events:none}.hit.on{animation:h .18s}@keyframes h{0%{opacity:1}100%{opacity:0}}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="panel" id="status">Готово</div><div class="panel" id="score">0 : 0</div></div><button id="fullscreen">⛶ НА ВЕСЬ ЭКРАН</button><div class="crosshair"></div><div id="toast" class="toast"></div><div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><div class="sub"><b>3D ONLINE SHOOTER</b><br>Светлая карта · укрытия · оружие · эффекты</div><input id="name" maxlength="20" placeholder="Твоё имя" value="Игрок"><button id="create">🎮 СОЗДАТЬ ИГРУ</button><button id="join">🔎 ВОЙТИ В ИГРУ</button><div id="msg" class="small"></div></div><div id="modal" class="panel modal hidden"><h2 id="modalTitle">Создать игру</h2><div id="createFields"><input id="roomName" maxlength="30" placeholder="Название комнаты" value="Неоновая арена"><label class="check"><input type="checkbox" id="usePass"> 🔒 Комната по паролю</label><input id="roomPass" class="hidden" maxlength="40" placeholder="Пароль комнаты"></div><div id="joinFields" class="hidden"><button id="roomRefresh" class="secondary">🔄 ОБНОВИТЬ КОМНАТЫ</button><div id="rooms" class="rooms"></div></div><button id="modalAction">СОЗДАТЬ</button><button id="modalClose" class="secondary">НАЗАД</button><div id="modalMsg" class="small"></div></div><div id="mobileControls" class="mobileControls hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="lookHint">Левая часть — движение<br>Правая — обзор</div><button id="jump" class="jumpBtn">⬆ ПРЫЖОК</button><button id="reload" class="reloadBtn">↻ RELOAD</button><div class="weaponBtns"><button data-w="pistol">PISTOL</button><button data-w="smg">SMG</button><button data-w="shotgun">SHOTGUN</button></div><button id="fire" class="fire">ОГОНЬ</button></div><div class="health"><i id="hpbar"></i></div><div class="hudBottom"><div class="panel weaponHud"><b id="weaponName">PISTOL</b><br><span id="ammo">12 / 12</span></div></div><div id="hit" class="hit"></div></div>
<script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';const $=id=>document.getElementById(id),canvas=$('game'),S={ws:null,me:0,started:false,players:[{x:250,y:350,hp:100,score:0,name:'Игрок 1',weapon:'pistol',ammo:12,reloading:false},{x:750,y:350,hp:100,score:0,name:'Игрок 2',weapon:'pistol',ammo:12,reloading:false}],bullets:[],obstacles:[],yaw:0,pitch:0,joy:{x:0,y:0},fire:false,roomTimer:null,lookId:null,lastX:0,lastY:0,jumpAt:-1e9,lastFx:0};const guns={pistol:['PISTOL',12],smg:['SMG',30],shotgun:['SHOTGUN',6]};const setStatus=t=>$('status').textContent=t;const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1000)};function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function pname(){return($('name').value.trim()||'Игрок').slice(0,20)}function openCreate(){stopRefresh();$('modalTitle').textContent='Создать игру';$('createFields').classList.remove('hidden');$('joinFields').classList.add('hidden');$('modalAction').classList.remove('hidden');$('modalAction').textContent='СОЗДАТЬ';$('modalMsg').textContent='';$('modal').classList.remove('hidden')}function openJoin(){$('modalTitle').textContent='Выбери комнату';$('createFields').classList.add('hidden');$('joinFields').classList.remove('hidden');$('modalAction').classList.add('hidden');$('modal').classList.remove('hidden');loadRooms();startRefresh()}function closeModal(){stopRefresh();$('modal').classList.add('hidden')}$('create').onclick=openCreate;$('join').onclick=openJoin;$('modalClose').onclick=closeModal;$('roomRefresh').onclick=loadRooms;$('usePass').onchange=()=>{$('roomPass').classList.toggle('hidden',!$('usePass').checked);if(!$('usePass').checked)$('roomPass').value=''};async function loadRooms(){if($('modal').classList.contains('hidden'))return;try{const d=await(await fetch('/rooms?x='+Date.now(),{cache:'no-store'})).json();$('rooms').innerHTML=d.rooms.length?d.rooms.map(r=>`<div class="room"><div class="icon">${r.locked?'🔒':'🌐'}</div><div class="roominfo"><div class="roomname">${esc(r.name)}</div><div class="roommeta">${esc(r.host)} · ${r.players}/${r.maxPlayers}</div></div><button onclick="chooseRoom('${r.code}','${escAttr(r.name)}',${r.locked})">ВОЙТИ</button></div>`).join(''):'<div class="small">Сейчас нет свободных комнат.</div>'}catch{$('rooms').innerHTML='<div class="small">Не удалось загрузить комнаты.</div>'}}function startRefresh(){stopRefresh();S.roomTimer=setInterval(loadRooms,3000)}function stopRefresh(){if(S.roomTimer){clearInterval(S.roomTimer);S.roomTimer=null}}window.chooseRoom=(code,name,locked)=>{const p=locked?prompt('Пароль комнаты «'+name+'»:'):'';if(locked&&p===null)return;stopRefresh();connect('join',code,p||'')};$('modalAction').onclick=()=>connect('create','',$('usePass').checked?$('roomPass').value:'',$('roomName').value);function connect(action,room='',password='',roomName=''){if(S.ws&&S.ws.readyState===1){S.ws.send(JSON.stringify({type:action,name:pname(),room,password,roomName}));closeModal();return}S.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);S.ws.onopen=()=>S.ws.send(JSON.stringify({type:action,name:pname(),room,password,roomName}));S.ws.onmessage=e=>{try{data(JSON.parse(e.data))}catch{}};S.ws.onerror=()=>setStatus('Ошибка соединения');S.ws.onclose=()=>{if(S.started)stop('Сервер отключён')}}function data(d){if(d.type==='created'){S.me=d.player;setStatus('Ожидание игрока');$('msg').textContent='Комната создана. Ждём второго игрока…';closeModal()}else if(d.type==='password_required'){const p=prompt('Введите пароль комнаты:');if(p!==null)connect('join',d.room,p)}else if(d.type==='start'){S.me=d.player;S.players[0].name=d.players?.[0]?.name||S.players[0].name;S.players[1].name=d.players?.[1]?.name||S.players[1].name;showGame()}else if(d.type==='snapshot'){S.players=d.players;S.bullets=d.bullets;S.obstacles=d.obstacles||S.obstacles;hud()}else if(d.type==='round'){toast(d.winner===S.me?'🏆 ПОБЕДА':'💥 ПОРАЖЕНИЕ');setTimeout(()=>stop('Раунд завершён'),1300)}else if(d.type==='opponent_left')stop('Соперник отключился');else if(d.type==='error'){setStatus(d.message||'Ошибка');$('msg').textContent=d.message||'Ошибка'}}function showGame(){stopRefresh();$('lobby').classList.add('hidden');$('modal').classList.add('hidden');$('mobileControls').classList.remove('hidden');S.started=true;setStatus('Игра идёт');buildWorld();requestFullscreen()}function stop(t){stopRefresh();S.started=false;S.fire=false;$('mobileControls').classList.add('hidden');$('lobby').classList.remove('hidden');setStatus(t);if(S.ws){try{S.ws.close()}catch{}}S.ws=null}async function requestFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch{}}$('fullscreen').onclick=requestFullscreen;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color(0xc9e5f5);scene.fog=new THREE.Fog(0xc9e5f5,800,1600);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,1600);scene.add(new THREE.HemisphereLight(0xffffff,0x7c9bb0,3.3));const sun=new THREE.DirectionalLight(0xffffff,4);sun.position.set(250,500,120);scene.add(sun);const world=new THREE.Group();scene.add(world);let gun=null,enemy=null,enemyGun=null;const bullets=new Map();function buildWorld(){while(world.children.length)world.remove(world.children[0]);const floor=new THREE.Mesh(new THREE.PlaneGeometry(1000,700),new THREE.MeshStandardMaterial({color:0xb8d8e9,roughness:.82}));floor.rotation.x=-Math.PI/2;floor.position.set(500,0,350);world.add(floor);const grid=new THREE.GridHelper(1000,50,0x5b8cab,0x92b5c9);grid.position.set(500,.02,350);world.add(grid);for(const o of S.obstacles){const m=new THREE.Mesh(new THREE.BoxGeometry(o.w,3.6,o.h),new THREE.MeshStandardMaterial({color:0x7398ae,roughness:.5,metalness:.25}));m.position.set(o.x+o.w/2,1.8,o.y+o.h/2);world.add(m);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x1769aa})));const top=new THREE.Mesh(new THREE.BoxGeometry(o.w+.4,.2,o.h+.4),new THREE.MeshStandardMaterial({color:0xe6f8ff}));top.position.y=1.9;m.add(top)}createGun();makeEnemy();hud()}function createGun(){gun=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.28,.18,.72),new THREE.MeshStandardMaterial({color:0x263548,metalness:.5,roughness:.35}));body.position.set(.34,-.25,-.72);gun.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.38,12),new THREE.MeshStandardMaterial({color:0x111820,metalness:.7}));barrel.rotation.x=Math.PI/2;barrel.position.set(.34,-.24,-1.1);gun.add(barrel);const grip=new THREE.Mesh(new THREE.BoxGeometry(.15,.35,.18),new THREE.MeshStandardMaterial({color:0x465a70}));grip.position.set(.34,-.43,-.62);grip.rotation.x=-.22;gun.add(grip);camera.add(gun)}function makeEnemy(){const p=S.players[1-S.me];if(!p)return;enemy=new THREE.Group();const c=1-S.me?0xff3974:0x1683ff;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1.05,7,12),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.1,roughness:.4,metalness:.25}));body.position.y=1.05;enemy.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,16,12),new THREE.MeshStandardMaterial({color:0xf2c7a5,roughness:.6}));head.position.y=1.82;enemy.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.58,.17,.62),new THREE.MeshStandardMaterial({color:0xe9fbff,emissive:0x56eaff,emissiveIntensity:1.5}));visor.position.set(0,1.84,.2);enemy.add(visor);enemyGun=new THREE.Mesh(new THREE.BoxGeometry(.18,.16,.72),new THREE.MeshStandardMaterial({color:0x1b2736,metalness:.6}));enemyGun.position.set(.48,1.12,-.28);enemy.add(enemyGun);const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.62,24),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;enemy.add(ring);world.add(enemy)}function hud(){const p=S.players[S.me];if(!p)return;$('score').textContent=`${S.players[0].score||0} : ${S.players[1].score||0}`;$('hpbar').style.width=Math.max(0,p.hp)+'%';$('weaponName').textContent=guns[p.weapon]?.[0]||p.weapon;$('ammo').textContent=p.reloading?'ПЕРЕЗАРЯДКА':`${p.ammo} / ${guns[p.weapon]?.[1]||12}`;document.querySelectorAll('.weaponBtns button').forEach(b=>b.classList.toggle('active',b.dataset.w===p.weapon))}function input(){if(!S.ws||S.ws.readyState!==1)return;const fX=Math.sin(S.yaw),fZ=Math.cos(S.yaw),rX=Math.cos(S.yaw),rZ=-Math.sin(S.yaw);const x=S.joy.x*rX+(-S.joy.y)*fX,y=S.joy.x*rZ+(-S.joy.y)*fZ;S.ws.send(JSON.stringify({type:'input',x,y,aimX:fX,aimY:fZ}))}function muzzle(){if(!gun)return;const p=new THREE.Vector3(.34,-.24,-1.28);gun.localToWorld(p);const flash=new THREE.Mesh(new THREE.ConeGeometry(.11,.45,8),new THREE.MeshBasicMaterial({color:0xffe46b}));flash.rotation.x=Math.PI/2;flash.position.copy(p);world.add(flash);const light=new THREE.PointLight(0xffd34d,10,10);light.position.copy(p);world.add(light);const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation),end=p.clone().add(dir.multiplyScalar(18));const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p,end]),new THREE.LineBasicMaterial({color:0xffdf57}));world.add(line);gun.position.z=-.1;setTimeout(()=>{world.remove(flash);world.remove(light);world.remove(line);gun.position.z=0},65)}function shoot(){if(!S.started||!S.ws||S.ws.readyState!==1)return;S.ws.send(JSON.stringify({type:'shoot'}));muzzle();S.lastFx=performance.now()}function reload(){if(S.ws?.readyState===1)S.ws.send(JSON.stringify({type:'reload'}));toast('↻ Перезарядка')}function weapon(w){if(S.ws?.readyState===1)S.ws.send(JSON.stringify({type:'weapon',weapon:w}))}function effects(){const live=new Set(S.bullets.map(b=>b.id));for(const [id,m] of bullets)if(!live.has(id)){world.remove(m);bullets.delete(id)}for(const b of S.bullets){let m=bullets.get(b.id);if(!m){m=new THREE.Mesh(new THREE.SphereGeometry(5,8,8),new THREE.MeshBasicMaterial({color:b.owner===S.me?0x178cff:0xff3974}));bullets.set(b.id,m);world.add(m)}m.position.set(b.x,1.15,b.y)}if(enemy){const p=S.players[1-S.me],last=enemy.userData.hp??p.hp;if(p.hp<last){$('hit').classList.remove('on');void $('hit').offsetWidth;$('hit').classList.add('on');impact(p.x,p.y)}enemy.userData.hp=p.hp;enemy.position.set(p.x,0,p.y);enemy.visible=p.hp>0}}function impact(x,z){for(let i=0;i<10;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.05,6,6),new THREE.MeshBasicMaterial({color:0xff6a35}));s.position.set(x,1.2,z);s.userData.v=new THREE.Vector3((Math.random()-.5)*3,Math.random()*2,(Math.random()-.5)*3);world.add(s);setTimeout(()=>world.remove(s),300);let n=0;const q=setInterval(()=>{n++;s.position.addScaledVector(s.userData.v,.04);s.scale.multiplyScalar(.9);if(n>12)clearInterval(q)},25)}}function frame(){requestAnimationFrame(frame);if(!S.started){renderer.render(scene,camera);return}input();if(S.fire&&performance.now()-S.lastFx>90)shoot();const p=S.players[S.me];if(p){const jt=performance.now()-S.jumpAt,j=jt>=0&&jt<650?Math.sin(jt/650*Math.PI)*1.1:0;camera.position.set(p.x,1.6+j,p.y);camera.rotation.order='YXZ';camera.rotation.y=S.yaw;camera.rotation.x=S.pitch;camera.rotation.z=0}effects();renderer.render(scene,camera)}frame();
$('stick').addEventListener('pointerdown',e=>{const r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width*.38,l=Math.hypot(dx,dy)||1,k=Math.min(1,m/l);S.joy.x=dx/m*k;S.joy.y=dy/m*k;$('knob').style.transform=`translate(${dx*k}px,${dy*k}px)`});$('stick').addEventListener('pointermove',e=>{if(e.buttons){const r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width*.38,l=Math.hypot(dx,dy)||1,k=Math.min(1,m/l);S.joy.x=dx/m*k;S.joy.y=dy/m*k;$('knob').style.transform=`translate(${dx*k}px,${dy*k}px)`}});['pointerup','pointercancel'].forEach(x=>$('stick').addEventListener(x,()=>{S.joy.x=S.joy.y=0;$('knob').style.transform='translate(0,0)'}));canvas.addEventListener('pointerdown',e=>{if(!S.started||e.clientX<innerWidth*.45)return;S.lookId=e.pointerId;S.lastX=e.clientX;S.lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.pointerId!==S.lookId)return;S.yaw-=(e.clientX-S.lastX)*.006;S.pitch=Math.max(-.65,Math.min(.65,S.pitch-(e.clientY-S.lastY)*.004));S.lastX=e.clientX;S.lastY=e.clientY});canvas.addEventListener('pointerup',()=>S.lookId=null);canvas.addEventListener('pointercancel',()=>S.lookId=null);$('fire').addEventListener('pointerdown',e=>{e.preventDefault();S.fire=true;shoot()});$('fire').addEventListener('pointerup',()=>S.fire=false);$('fire').addEventListener('pointercancel',()=>S.fire=false);$('reload').onclick=reload;$('jump').onclick=()=>{S.jumpAt=performance.now()};document.querySelectorAll('.weaponBtns button').forEach(b=>b.onclick=()=>weapon(b.dataset.w));addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();S.jumpAt=performance.now()}if(e.code==='KeyR')reload();if(e.code==='Digit1')weapon('pistol');if(e.code==='Digit2')weapon('smg');if(e.code==='Digit3')weapon('shotgun');if(e.code==='KeyW')S.joy.y=-1;if(e.code==='KeyS')S.joy.y=1;if(e.code==='KeyA')S.joy.x=-1;if(e.code==='KeyD')S.joy.x=1;if(e.code==='ArrowUp')S.joy.y=-1;if(e.code==='ArrowDown')S.joy.y=1;if(e.code==='ArrowLeft')S.joy.x=-1;if(e.code==='ArrowRight')S.joy.x=1});addEventListener('keyup',e=>{if(['KeyW','KeyS','ArrowUp','ArrowDown'].includes(e.code))S.joy.y=0;if(['KeyA','KeyD','ArrowLeft','ArrowRight'].includes(e.code))S.joy.x=0});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});</script></body></html>
