name: Build NEON ARENA APK

on:
  push:
    paths:
      - 'android2/**'
      - '.github/workflows/android2-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android2 :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-arena-apk
          path: android2/app/build/outputs/apk/debug/app-debug.apk
