<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>VoxelCraft Mobile 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c9ff;font-family:system-ui,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000;font-weight:700}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:#07131dcc;border:1px solid #ffffff44;border-radius:14px;padding:8px 11px;font-size:13px}.hint{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.8;white-space:nowrap}.crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff}.crosshair:before{left:8px;top:0;width:2px;height:18px}.crosshair:after{left:0;top:8px;width:18px;height:2px}.joystick{position:absolute;bottom:25px;left:18px;width:140px;height:140px;border-radius:50%;border:2px solid #fff4;background:#07131d66;pointer-events:auto}.knob{position:absolute;width:60px;height:60px;left:38px;top:38px;border-radius:50%;background:#ffffff44;border:2px solid #fff8;box-shadow:0 0 20px #0005}.actions{position:absolute;right:18px;bottom:180px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.action{width:68px;height:50px;border:0;border-radius:14px;color:#fff;font-weight:900;font-size:20px;background:#111c2bdd;border:1px solid #fff3}.mine{background:#d99c28}.place{background:#27a968}.hotbar{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#111a2ddd;border:1px solid #fff3;border-radius:14px;pointer-events:auto}.slot{width:42px;height:42px;border:2px solid #ffffff44;border-radius:9px;background:#ffffff12;display:grid;place-items:center;position:relative}.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #ffd43b}.blockicon{width:25px;height:25px;border-radius:4px;box-shadow:inset 0 3px 0 #fff3,inset 0 -4px 0 #0002}.slot span{font-size:9px;position:absolute;bottom:1px;right:3px}.toast{position:absolute;left:50%;top:82px;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#07131dcc;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.hp{position:absolute;left:10px;bottom:10px;width:150px;height:13px;border-radius:9px;border:1px solid #fff6;background:#0006;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#2fe27d}.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0b244bcc,#07131df2);padding:18px}.card{width:min(560px,94vw);padding:25px;border-radius:24px;background:#07131df5;border:1px solid #fff2;box-shadow:0 20px 70px #0008;text-align:center;color:#fff}.card h1{font-size:38px;margin:0 0 5px}.card p{color:#b8d4e4;margin:8px 0 18px}.start{width:100%;padding:15px;border:0;border-radius:14px;background:#39c978;color:#032313;font-size:18px;font-weight:1000}.hidden{display:none!important}@media(max-width:600px){.hint{top:52px;font-size:11px}.joystick{width:132px;height:132px;bottom:22px}.knob{left:34px;top:34px}.actions{right:16px;bottom:174px}.hotbar{max-width:96vw}.slot{width:39px;height:39px}.blockicon{width:23px;height:23px}}</style></head><body><canvas id="c"></canvas><div id="menu" class="menu"><div class="card"><h1>VOXELCRAFT</h1><p>Мобильный 3D voxel sandbox — исследуй, ломай и строй.</p><p>🌲 процедурный мир · ☀️ день/ночь · ⛏️ добыча · 🧱 строительство</p><button id="start" class="start">ИГРАТЬ</button></div></div><div id="hud" class="hud hidden"><div class="top"><div class="pill" id="coords">X 0 · Y 0 · Z 0</div><div class="pill" id="clock">☀️ 12:00</div></div><div class="hint">Левый стик — ходьба · проводи пальцем по экрану — обзор</div><div class="crosshair"></div><div id="toast" class="toast"></div><div id="move" class="joystick"><div class="knob"></div></div><div class="actions"><button id="mine" class="action mine">⛏️</button><button id="place" class="action place">🧱</button></div><div id="hotbar" class="hotbar"></div><div class="hp"><i></i></div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const canvas=document.querySelector('#c'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,100),renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;scene.fog=new THREE.Fog(0x78c9ff,18,55);const hemi=new THREE.HemisphereLight(0xbdeaff,0x40502d,1.7);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0c2,2.6);sun.position.set(20,35,10);scene.add(sun);const HALF=14,MAXH=14,blocks=new Map(),TYPES={grass:{c:0x58b84a},dirt:{c:0x8a5b32},stone:{c:0x858b91},sand:{c:0xd9c27a},wood:{c:0x8b5a2b},leaves:{c:0x2d8b45},plank:{c:0xb27a42},glass:{c:0x7ad9e8}},palette=Object.keys(TYPES);let selected=0;const key=(x,y,z)=>`${x}|${y}|${z}`,parse=k=>k.split('|').map(Number);function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}function height(x,z){return Math.max(2,Math.min(9,Math.floor(5+(Math.sin(x*.34)+Math.cos(z*.31)+Math.sin((x+z)*.17)*.7)*1.25+hash(x,z)*1.6)))}function gen(){blocks.clear();for(let x=-HALF;x<HALF;x++)for(let z=-HALF;z<HALF;z++){let h=height(x,z);for(let y=0;y<=h;y++)blocks.set(key(x,y,z),y===h?(h<=3?'sand':'grass'):y>h-3?'dirt':'stone');if(hash(x*3,z*5)>.91&&h>4){for(let y=1;y<=3;y++)blocks.set(key(x,h+y,z),'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++)if(Math.abs(dx)+Math.abs(dz)<4)blocks.set(key(x+dx,h+dy,z+dz),'leaves')}}}const group=new THREE.Group();scene.add(group);function rebuild(){while(group.children.length)group.remove(group.children[0]);for(const[type,info]of Object.entries(TYPES)){const a=[];for(const[k,t]of blocks)if(t===type)a.push(parse(k));if(!a.length)continue;const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:info.c}),a.length),o=new THREE.Object3D();a.forEach((p,i)=>{o.position.set(...p);o.updateMatrix();m.setMatrixAt(i,o.matrix)});m.instanceMatrix.needsUpdate=true;m.userData.positions=a;group.add(m)}}function topY(x,z){let y=-1;for(const[k]of blocks){const p=parse(k);if(p[0]===x&&p[2]===z)y=Math.max(y,p[1])}return y}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),900)}function hotbar(){const h=document.querySelector('#hotbar');h.innerHTML='';palette.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===selected?' sel':'');b.innerHTML=`<i class="blockicon" style="background:#${TYPES[t].c.toString(16).padStart(6,'0')}"></i><span>${i+1}</span>`;b.onclick=()=>{selected=i;hotbar()};h.appendChild(b)})}const player={x:0,y:8,z:5,yaw:Math.PI,pitch:-.15},vel={y:0};let moveX=0,moveY=0,onGround=false;function solid(x,y,z){return blocks.has(key(Math.round(x),Math.round(y),Math.round(z)))}function canMove(x,y,z){const r=.28;for(const dx of[-r,r])for(const dz of[-r,r])if(solid(x+dx,y,z+dz)||solid(x+dx,y+1,z+dz))return false;return true}function update(dt){const speed=5,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw),dx=(sy*moveY+cy*moveX)*speed*dt,dz=(cy*moveY-sy*moveX)*speed*dt;if(canMove(player.x+dx,player.y,player.z))player.x+=dx;if(canMove(player.x,player.y,player.z+dz))player.z+=dz;vel.y-=18*dt;player.y+=vel.y*dt;const floor=topY(Math.round(player.x),Math.round(player.z));if(player.y<floor+1.01){player.y=floor+1.01;vel.y=0;onGround=true}else onGround=false;camera.position.set(player.x,player.y+1.55,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}const ray=new THREE.Raycaster();function target(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const h=ray.intersectObjects(group.children,false);if(!h.length||h[0].distance>7)return null;const x=h[0],p=x.object.userData.positions[x.instanceId];return{p,n:x.face.normal.clone().round()}}function mine(){const t=target();if(!t)return toast('Смотри на блок');const[x,y,z]=t.p;if(y<=0)return toast('Нельзя');blocks.delete(key(x,y,z));rebuild()}function place(){const t=target();if(!t)return toast('Смотри на поверхность');const[x,y,z]=t.p,n=t.n,q=[x+n.x,y+n.y,z+n.z];if(q[1]<0||q[1]>MAXH||blocks.has(key(...q)))return;blocks.set(key(...q),palette[selected]);rebuild()}document.querySelector('#mine').onclick=mine;document.querySelector('#place').onclick=place;const joy=document.querySelector('#move');let active=false,sx=0,sy=0;function reset(){active=false;moveX=moveY=0;joy.querySelector('.knob').style.transform=''}joy.addEventListener('pointerdown',e=>{active=true;sx=e.clientX;sy=e.clientY;joy.setPointerCapture(e.pointerId)});joy.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-sx,dy=e.clientY-sy,l=42,x=Math.max(-l,Math.min(l,dx))/l,y=Math.max(-l,Math.min(l,dy))/l;joy.querySelector('.knob').style.transform=`translate(${x*34}px,${y*34}px)`;moveX=x;moveY=-y});joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);let touchId=null,lastX=0,lastY=0;document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||e.target.closest('#move')||e.target.closest('.actions')||e.target.closest('.hotbar'))return;touchId=e.pointerId;lastX=e.clientX;lastY=e.clientY});document.addEventListener('pointermove',e=>{if(e.pointerId!==touchId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;player.yaw-=dx*.008;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-dy*.008))});document.addEventListener('pointerup',e=>{if(e.pointerId===touchId)touchId=null});document.addEventListener('pointercancel',e=>{if(e.pointerId===touchId)touchId=null});addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='8'){selected=+e.key-1;hotbar()}if(e.code==='Space'&&onGround)vel.y=7;if(e.code==='KeyE')mine();if(e.code==='KeyQ')place()});let time=12,last=performance.now();function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);time=(time+dt*.8)%24;const daylight=Math.max(0,Math.sin((time-6)/12*Math.PI));sun.intensity=.35+2.3*daylight;hemi.intensity=.55+1.2*daylight;const sky=new THREE.Color().setHSL(.56,.55,.28+.38*daylight);scene.background=sky;scene.fog.color.copy(sky);sun.position.set(Math.cos(time/24*Math.PI*2)*25,10+25*daylight,Math.sin(time/24*Math.PI*2)*25);document.querySelector('#clock').textContent=(daylight>.25?'☀️':'🌙')+' '+String(Math.floor(time)).padStart(2,'0')+':'+String(Math.floor(time%1*60)).padStart(2,'0');document.querySelector('#coords').textContent=`X ${Math.round(player.x)} · Y ${Math.round(player.y)} · Z ${Math.round(player.z)}`;renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#start').onclick=()=>{document.querySelector('#menu').classList.add('hidden');document.querySelector('#hud').classList.remove('hidden');gen();rebuild();hotbar();requestAnimationFrame(loop);toast('Проводи пальцем по экрану для камеры')};</script></body></html>
