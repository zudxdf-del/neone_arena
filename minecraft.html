<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VoxelCraft Mobile 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c9ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000;font-weight:700}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.pill{background:#07131dcc;border:1px solid #ffffff44;border-radius:14px;padding:8px 11px;backdrop-filter:blur(8px);font-size:13px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;font-weight:400}.hint{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.85;white-space:nowrap}.joystick{position:absolute;bottom:28px;width:145px;height:145px;border-radius:50%;border:2px solid #fff4;background:#07131d66;pointer-events:auto}.left{left:18px}.right{right:18px}.knob{position:absolute;width:62px;height:62px;left:39px;top:39px;border-radius:50%;background:#ffffff44;border:2px solid #fff8;box-shadow:0 0 20px #0005}.actions{position:absolute;right:180px;bottom:30px;display:flex;gap:8px;pointer-events:auto}.action{width:76px;height:50px;border:0;border-radius:14px;background:#111c2bdd;color:#fff;font-weight:900;border:1px solid #fff3;box-shadow:0 4px 12px #0004}.action.mine{background:#e0a72f}.action.place{background:#27a968}.hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#111a2ddd;border:1px solid #fff3;border-radius:14px;pointer-events:auto}.slot{width:47px;height:47px;border:2px solid #ffffff44;border-radius:9px;background:#ffffff12;display:grid;place-items:center;position:relative}.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #ffd43b}.slot span{font-size:9px;position:absolute;bottom:1px;right:3px}.blockicon{width:26px;height:26px;border-radius:4px;box-shadow:inset 0 3px 0 #fff3,inset 0 -4px 0 #0002}.crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.9}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff}.crosshair:before{left:8px;top:0;width:2px;height:18px}.crosshair:after{left:0;top:8px;width:18px;height:2px}.toast{position:absolute;left:50%;top:82px;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#07131dcc;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.hp{position:absolute;left:10px;bottom:10px;width:150px;height:13px;border-radius:9px;border:1px solid #fff6;background:#0006;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#2fe27d}.help{position:absolute;left:10px;bottom:32px;font-size:11px;opacity:.65}.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0b244bcc,#07131df2);padding:18px}.card{width:min(560px,94vw);padding:25px;border-radius:24px;background:#07131df5;border:1px solid #fff2;box-shadow:0 20px 70px #0008;text-align:center;color:#fff}.card h1{font-size:38px;margin:0 0 5px;letter-spacing:2px}.card p{color:#b8d4e4;margin:8px 0 18px}.start{width:100%;padding:15px;border:0;border-radius:14px;background:#39c978;color:#032313;font-size:18px;font-weight:1000}.hidden{display:none!important}@media(max-width:600px){.actions{right:165px;bottom:184px;flex-direction:column}.action{width:68px;height:44px}.hotbar{bottom:8px}.slot{width:42px;height:42px}.joystick{width:132px;height:132px;bottom:24px}.knob{left:34px;top:34px;width:60px;height:60px}.hint{top:52px}.help{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu" class="menu"><div class="card"><h1>VOXELCRAFT</h1><p>Мобильный 3D voxel sandbox — исследуй, ломай и строй.</p><p>🌲 процедурный мир · ☀️ день/ночь · ⛏️ добыча · 🧱 строительство</p><button id="start" class="start">ИГРАТЬ</button></div></div>
<div id="hud" class="hud hidden">
<div class="top"><div class="pill" id="coords">X 0 · Y 0 · Z 0</div><div class="pill" id="clock">☀️ 12:00</div></div>
<div class="hint">Левый стик — ходьба · правый — обзор · ⛏️ добыть · 🧱 поставить</div>
<div class="crosshair"></div><div class="cross">+</div><div id="toast" class="toast"></div>
<div id="move" class="joystick left"><div id="moveKnob" class="knob"></div></div>
<div id="look" class="joystick right"><div id="lookKnob" class="knob"></div></div>
<div class="actions"><button id="mine" class="action mine">⛏️</button><button id="place" class="action place">🧱</button></div>
<div id="hotbar" class="hotbar"></div><div class="hp"><i></i></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const canvas=document.querySelector('#c');
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x78c9ff,18,55);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,100);
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const hemi=new THREE.HemisphereLight(0xbdeaff,0x40502d,1.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0c2,2.6);sun.position.set(20,35,10);scene.add(sun);

const SIZE=28, HALF=SIZE/2, MAXH=14;
const blocks=new Map();
const TYPES={grass:{c:0x58b84a},dirt:{c:0x8a5b32},stone:{c:0x858b91},sand:{c:0xd9c27a},wood:{c:0x8b5a2b},leaves:{c:0x2d8b45},plank:{c:0xb27a42},glass:{c:0x7ad9e8}};
const palette=['grass','dirt','stone','sand','wood','leaves','plank','glass'];
let selected=0;
const key=(x,y,z)=>`${x}|${y}|${z}`;
const parseKey=k=>k.split('|').map(Number);
function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function height(x,z){const a=Math.sin(x*.34)+Math.cos(z*.31)+Math.sin((x+z)*.17)*.7;return Math.max(2,Math.min(9,Math.floor(5+a*1.25+hash(x,z)*1.6)))}
function add(x,y,z,t){blocks.set(key(x,y,z),t)}
function genWorld(){blocks.clear();for(let x=-HALF;x<HALF;x++)for(let z=-HALF;z<HALF;z++){const h=height(x,z);for(let y=0;y<=h;y++){let t=y===h?'grass':y>h-3?'dirt':'stone';if(h<=3&&y===h)t='sand';add(x,y,z,t)}if(hash(x*3,z*5)>.91&&h>4){for(let y=1;y<=3;y++)add(x,h+y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++){if(Math.abs(dx)+Math.abs(dz)<4&&hash(x+dx,z+dz)>-.2)add(x+dx,h+dy,z+dz,'leaves')}}}}
const group=new THREE.Group();scene.add(group);const meshes={};
function rebuild(){while(group.children.length)group.remove(group.children[0]);for(const [type,info] of Object.entries(TYPES)){const arr=[];for(const [k,t] of blocks)if(t===type)arr.push(parseKey(k));if(!arr.length)continue;const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:info.c}),arr.length);const q=new THREE.Object3D();arr.forEach((p,i)=>{q.position.set(p[0],p[1],p[2]);q.updateMatrix();m.setMatrixAt(i,q.matrix);});m.instanceMatrix.needsUpdate=true;m.userData.type=type;m.userData.positions=arr;group.add(m);meshes[type]=m}}
function topY(x,z){let y=-1;for(const [k] of blocks){const p=parseKey(k);if(p[0]===x&&p[2]===z)y=Math.max(y,p[1])}return y}
function buildHotbar(){const hb=document.querySelector('#hotbar');palette.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===selected?' sel':'');b.innerHTML=`<i class="blockicon" style="background:#${TYPES[t].c.toString(16).padStart(6,'0')}"></i><span>${i+1}</span>`;b.onclick=()=>{selected=i;buildHotbar();toast('Выбран: '+t)};hb.appendChild(b)})}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1000)}

const player={x:0,y:8,z:5,yaw:Math.PI,pitch:-.15};const vel={x:0,y:0,z:0};let onGround=false;
function solid(x,y,z){return blocks.has(key(Math.round(x),Math.round(y),Math.round(z)))}
function canStand(x,y,z){const r=.28;for(const dx of [-r,r])for(const dz of [-r,r])if(solid(x+dx,y,z+dz)||solid(x+dx,y+1,z+dz))return false;return true}
function updatePlayer(dt){const speed=5.0;const f=moveY,b=moveX;const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);let dx=(sy*f+cy*b)*speed*dt,dz=(cy*f-sy*b)*speed*dt;if(canStand(player.x+dx,player.y,player.z))player.x+=dx;if(canStand(player.x,player.y,player.z+dz))player.z+=dz;vel.y-=18*dt;player.y+=vel.y*dt;let floor=topY(Math.round(player.x),Math.round(player.z));if(player.y<floor+1.01){player.y=floor+1.01;vel.y=0;onGround=true}else onGround=false;camera.position.set(player.x,player.y+1.55,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;}

const raycaster=new THREE.Raycaster();
function target(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects(group.children,false);if(!hits.length||hits[0].distance>7)return null;const h=hits[0],m=h.object,p=m.userData.positions[h.instanceId];return {p,normal:h.face.normal.clone().round(),dist:h.distance}}
function mine(){const t=target();if(!t)return toast('Смотри на блок');const [x,y,z]=t.p;if(y<=0)return toast('Бедрок нельзя сломать');blocks.delete(key(x,y,z));rebuild();toast('Блок добыт')}
function place(){const t=target();if(!t)return toast('Смотри на поверхность');const [x,y,z]=t.p,n=t.normal;const q=[x+n.x,y+n.y,z+n.z];if(q[1]<0||q[1]>MAXH+8)return;if(Math.abs(q[0])>HALF+8||Math.abs(q[2])>HALF+8)return;if(blocks.has(key(...q)))return;if(Math.abs(q[0]-player.x)<1&&Math.abs(q[2]-player.z)<1&&Math.abs(q[1]-player.y)<2)return toast('Слишком близко');blocks.set(key(...q),palette[selected]);rebuild();toast('Поставлен: '+palette[selected])}

document.querySelector('#mine').onclick=mine;document.querySelector('#place').onclick=place;

let moveX=0,moveY=0,lookStart=null;
function joystick(el,kind){let active=false,sx=0,sy=0;el.addEventListener('pointerdown',e=>{active=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-sx,dy=e.clientY-sy;const lim=48;const x=Math.max(-lim,Math.min(lim,dx))/lim,y=Math.max(-lim,Math.min(lim,dy))/lim;el.querySelector('.knob').style.transform=`translate(${x*35}px,${y*35}px)`;if(kind==='move'){moveX=x;moveY=-y}});const end=()=>{active=false;el.querySelector('.knob').style.transform='';if(kind==='move'){moveX=moveY=0}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
joystick(document.querySelector('#move'),'move');
const look=document.querySelector('#look');let lx=0,ly=0,la=false;look.addEventListener('pointerdown',e=>{la=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(!la)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;player.yaw-=dx*.009;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-dy*.009));look.querySelector('.knob').style.transform=`translate(${Math.max(-35,Math.min(35,dx*1.8))}px,${Math.max(-35,Math.min(35,dy*1.8))}px)`});const lend=()=>{la=false;look.querySelector('.knob').style.transform=''};look.addEventListener('pointerup',lend);look.addEventListener('pointercancel',lend);

window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='8'){selected=+e.key-1;buildHotbar()}if(e.code==='Space'&&onGround)vel.y=7;if(e.code==='KeyE')mine();if(e.code==='KeyQ')place()});
window.addEventListener('wheel',e=>{selected=(selected+(e.deltaY>0?1:7))%8;buildHotbar()});

let time=12;let last=performance.now();
function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;updatePlayer(dt);time=(time+dt*.8)%24;const daylight=Math.max(0,Math.sin((time-6)/12*Math.PI));sun.intensity=.35+2.3*daylight;hemi.intensity=.55+1.2*daylight;const sky=new THREE.Color().setHSL(.56,.55,.28+.38*daylight);scene.background=sky;scene.fog.color.copy(sky);sun.position.set(Math.cos(time/24*Math.PI*2)*25,10+25*daylight,Math.sin(time/24*Math.PI*2)*25);document.querySelector('#clock').textContent=(daylight>.25?'☀️':'🌙')+' '+String(Math.floor(time)).padStart(2,'0')+':'+String(Math.floor(time%1*60)).padStart(2,'0');document.querySelector('#coords').textContent=`X ${Math.round(player.x)} · Y ${Math.round(player.y)} · Z ${Math.round(player.z)}`;renderer.render(scene,camera);requestAnimationFrame(loop)}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

document.querySelector('#start').onclick=()=>{document.querySelector('#menu').classList.add('hidden');document.querySelector('#hud').classList.remove('hidden');genWorld();rebuild();buildHotbar();camera.position.set(player.x,player.y+1.55,player.z);requestAnimationFrame(loop);toast('Добро пожаловать!')};
</script>
</body>
</html>
