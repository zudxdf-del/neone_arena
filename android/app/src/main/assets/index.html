<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA LAN</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:system-ui,Arial}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:10px;gap:8px}.panel{background:#0b1020e8;border:1px solid #35416b;border-radius:14px;padding:10px 12px}.lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);text-align:center;pointer-events:auto}h1{margin:0 0 6px;font-size:36px}p{color:#b5bfdc;line-height:1.4}.addr{font-size:18px;color:#8efcff;font-weight:800;word-break:break-all;margin:10px}button{border:0;border-radius:12px;padding:13px 16px;margin:5px;background:#6d5dfc;color:white;font-weight:800;font-size:16px}button.secondary{background:#202943}.hidden{display:none!important}.small{font-size:13px;color:#9ca9d0}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.stick{width:145px;height:145px;border-radius:50%;background:#2a365b66;border:1px solid #52618c;pointer-events:auto;touch-action:none;position:relative}.knob{width:62px;height:62px;border-radius:50%;background:#6d5dfc;position:absolute;left:41px;top:41px}.fire{width:92px;height:92px;border-radius:50%;background:#ff477e;border:1px solid #ff9ab5;pointer-events:auto;touch-action:none}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="panel" id="status">LAN-сервер запущен</div><div class="panel" id="score">Ты: 0 | Соперник: 0</div></div><div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><p><b>Без VPN, по одной Wi-Fi сети.</b><br>Первый телефон: «Создать игру». Второй: «Подключиться».</p><div class="small">Ссылка для второго телефона:</div><div id="addr" class="addr">определяется…</div><button id="copy" class="secondary">Скопировать ссылку</button><button id="create">Создать игру</button><button id="join">Подключиться</button><div id="msg" class="small"></div></div><div id="controls" class="hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="fire" class="fire">ОГОНЬ</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),status=document.getElementById('status'),score=document.getElementById('score'),lobby=document.getElementById('lobby'),controls=document.getElementById('controls'),msg=document.getElementById('msg'),addr=document.getElementById('addr');let W=innerWidth,H=innerHeight;function rs(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();const S={ws:null,host:false,started:false,me:0,players:[{x:250,y:350,hp:100,score:0},{x:750,y:350,hp:100,score:0}],bullets:[],keys:{},joy:{x:0,y:0}};const $=x=>document.getElementById(x);function url(){return 'ws://'+location.hostname+':8081'}function openws(cb){try{S.ws=new WebSocket(url());S.ws.onopen=cb;S.ws.onmessage=e=>data(JSON.parse(e.data));S.ws.onerror=()=>msg.textContent='Ошибка подключения';S.ws.onclose=()=>{if(S.started){S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');status.textContent='Сервер остановлен'}}}catch(e){msg.textContent='Ошибка сервера'}}function start(){lobby.classList.add('hidden');controls.classList.remove('hidden');S.started=true;status.textContent='Игра идёт'}$('create').onclick=()=>{S.host=true;openws(()=>{S.ws.send(JSON.stringify({type:'create'}));msg.textContent='Ждём второго игрока…';status.textContent='Ожидание игрока'})};$('join').onclick=()=>{S.host=false;openws(()=>S.ws.send(JSON.stringify({type:'join'})))};$('copy').onclick=()=>navigator.clipboard?.writeText(addr.textContent).then(()=>msg.textContent='Ссылка скопирована');async function info(){try{let j=await fetch('/info').then(r=>r.json());addr.textContent=j.addresses?.length?'http://'+j.addresses[0]+':8080':'IP не найден'}catch{addr.textContent='Откройте порт 8080'}}info();function data(d){if(d.type==='started'){S.me=d.player;start()}if(d.type==='snap'){S.players=d.players;S.bullets=d.bullets}}function send(x){if(S.ws?.readyState===1)S.ws.send(JSON.stringify(x))}addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.code==='Space')send({type:'shoot'})});addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);$('fire').onpointerdown=()=>send({type:'shoot'});setInterval(()=>{let x=((S.keys.d||S.keys.arrowright)?1:0)-((S.keys.a||S.keys.arrowleft)?1:0)+S.joy.x,y=((S.keys.s||S.keys.arrowdown)?1:0)-((S.keys.w||S.keys.arrowup)?1:0)+S.joy.y;if(!S.host)send({type:'input',x,y})},40);let jp=null;function jm(e){let r=$('stick').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=52,l=Math.hypot(dx,dy)||1,x=Math.min(m,dx/l*m),y=Math.min(m,dy/l*m);S.joy={x:x/m,y:y/m};$('knob').style.left=41+x+'px';$('knob').style.top=41+y+'px'}$('stick').onpointerdown=e=>{jp=e.pointerId;$('stick').setPointerCapture(jp);jm(e)};$('stick').onpointermove=e=>jp===e.pointerId&&jm(e);$('stick').onpointerup=$('stick').onpointercancel=()=>{jp=null;S.joy={x:0,y:0};$('knob').style.left='41px';$('knob').style.top='41px'};function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080b16';ctx.fillRect(0,0,W,H);let sx=W/1000,sy=H/700;for(let b of S.bullets){ctx.fillStyle=b.owner===S.me?'#8efcff':'#ff5b8a';ctx.beginPath();ctx.arc(b.x*sx,b.y*sy,5,0,7);ctx.fill()}for(let i=0;i<2;i++){let p=S.players[i],x=p.x*sx,y=p.y*sy,col=i===S.me?'#55e7ff':'#ff5b8a';ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,20*Math.min(sx,sy),0,7);ctx.fill();ctx.fillStyle='#11162a';ctx.beginPath();ctx.arc(x,y,12*Math.min(sx,sy),0,7);ctx.fill()}score.textContent='Ты: '+S.players[S.me].score+' | Соперник: '+S.players[1-S.me].score}function loop(){draw();requestAnimationFrame(loop)}loop();</script></body></html>
