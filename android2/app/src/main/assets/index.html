<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:system-ui,Arial}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:10px;gap:8px}.panel{background:#0b1020ee;border:1px solid #35416b;border-radius:16px;padding:10px 12px}.lobby{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);text-align:center;pointer-events:auto;max-height:92vh;overflow:auto}h1{margin:0 0 8px;font-size:36px}.sub{color:#b5bfdc;line-height:1.4}.name{width:100%;padding:16px;border:1px solid #35416b;border-radius:14px;background:#10172b;color:white;font-size:18px;text-align:center;margin:10px 0}.big{width:100%;padding:17px 16px;margin:7px 0;border:0;border-radius:15px;background:#6d5dfc;color:white;font-weight:900;font-size:19px}.secondary{background:#202943}.big:disabled{opacity:.45}.small{font-size:13px;color:#9ca9d0;margin-top:8px}.ok{color:#8efcff}.hidden{display:none!important}.game{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;margin:8px 0;border:1px solid #35416b;border-radius:14px;background:#10172b;text-align:left}.game b{font-size:17px}.game span{display:block;color:#9ca9d0;font-size:12px}.game button{width:auto;margin:0;padding:12px 16px;font-size:15px}.addr{font-size:15px;color:#8efcff;font-weight:900;word-break:break-all;margin:8px}.hidden2{display:none}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.stick{width:145px;height:145px;border-radius:50%;background:#2a365b66;border:1px solid #52618c;pointer-events:auto;touch-action:none;position:relative}.knob{width:62px;height:62px;border-radius:50%;background:#6d5dfc;position:absolute;left:41px;top:41px}.fire{width:92px;height:92px;border-radius:50%;background:#ff477e;border:1px solid #ff9ab5;pointer-events:auto;touch-action:none;color:white;font-weight:900}</style></head>
<body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="panel" id="status">Не подключён</div><div class="panel" id="score">Ты: 0 | Соперник: 0</div></div><div id="lobby" class="panel lobby"><h1>NEON ARENA</h1><div class="sub">Два телефона в одной Wi‑Fi точке.<br><b>Установите игру на оба телефона.</b></div><input id="name" class="name" maxlength="18" placeholder="Твоё имя" value="Игрок" autocomplete="off"><button id="create" class="big">🎮 СОЗДАТЬ ИГРУ</button><button id="find" class="big secondary">🔎 НАЙТИ ИГРУ</button><div id="games"></div><div id="serverBox" class="hidden"><div class="small">Если нужно подключить браузер:</div><div id="addr" class="addr">—</div></div><div id="msg" class="small"></div></div><div id="controls" class="hidden"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="fire" class="fire">ОГОНЬ</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),status=document.getElementById('status'),score=document.getElementById('score'),lobby=document.getElementById('lobby'),controls=document.getElementById('controls'),msg=document.getElementById('msg'),addr=document.getElementById('addr'),nameEl=document.getElementById('name'),gamesEl=document.getElementById('games');let W=innerWidth,H=innerHeight;function rs(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();
const S={ws:null,host:false,started:false,me:0,players:[{x:250,y:350,hp:100,score:0,name:'Игрок'},{x:750,y:350,hp:100,score:0,name:'Соперник'}],bullets:[],keys:{},joy:{x:0,y:0}};const $=x=>document.getElementById(x);let wsUrl='';
function myName(){let n=nameEl.value.trim();return n||'Игрок'}
function showServer(url){addr.textContent=url;document.getElementById('serverBox').classList.remove('hidden');}
window.serverReady=function(url){showServer(url);wsUrl=window.Android?window.Android.getWsUrl():wsUrl;connectHost();};
function startHost(){msg.textContent='Запускаем сервер…';if(window.Android){window.Android.startServer(myName());}else{msg.textContent='Создать игру можно только в APK на телефоне';}}
function connectHost(){S.host=true;openws(()=>{S.ws.send(JSON.stringify({type:'create',name:myName()}));msg.textContent='Игра создана. Ждём второго игрока…';status.textContent='Ожидание игрока'});}
$('create').onclick=startHost;
$('find').onclick=()=>{gamesEl.innerHTML='<div class="small">Ищем игры в этой сети…</div>';msg.textContent='';if(window.Android)window.Android.discoverGames();else msg.textContent='Поиск доступен в APK';};
window.discoveryResult=function(raw){try{let a=JSON.parse(raw);gamesEl.innerHTML='';if(!a.length){gamesEl.innerHTML='<div class="small">Игр не найдено. Проверь, что первый телефон уже нажал «Создать игру» и оба телефона в одной Wi‑Fi сети.</div>';return;}a.forEach((g,i)=>{let d=document.createElement('div');d.className='game';let text=document.createElement('div');text.innerHTML='<b>🎮 '+esc(g.name||'Игрок')+'</b><span>NEON ARENA • готова к игре</span>';let b=document.createElement('button');b.className='big';b.textContent='ВОЙТИ';b.onclick=()=>joinFound(g.ip,g.port,g.name);d.appendChild(text);d.appendChild(b);gamesEl.appendChild(d);});}catch(e){msg.textContent='Ошибка поиска игр';}};
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'\\\\','"':'&quot;'}[m]));}
function joinFound(ip,port,hostName){S.host=false;wsUrl='ws://'+ip+':'+port;status.textContent='Подключение';msg.textContent='Входим в игру к '+hostName+'…';openws(()=>S.ws.send(JSON.stringify({type:'join',name:myName()})));}
function openws(cb){try{if(S.ws)try{S.ws.close()}catch(e){}S.ws=new WebSocket(wsUrl);S.ws.onopen=cb;S.ws.onmessage=e=>data(JSON.parse(e.data));S.ws.onerror=()=>msg.textContent='Не удалось подключиться. Проверьте Wi‑Fi.';S.ws.onclose=()=>{if(S.started){S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');status.textContent='Соединение потеряно'}}}catch(e){msg.textContent='Ошибка соединения'}}
function game(){lobby.classList.add('hidden');controls.classList.remove('hidden');S.started=true;status.textContent='Игра идёт'}
function data(d){if(d.type==='waiting'){msg.textContent='Ждём второго игрока…';return}if(d.type==='started'){S.me=d.player;game();return}if(d.type==='snap'){S.players=d.players;S.bullets=d.bullets;score.textContent='Ты: '+S.players[S.me].score+' | '+S.players[1-S.me].name+': '+S.players[1-S.me].score;return}if(d.type==='error'){msg.textContent=d.message||'Ошибка';return}if(d.type==='opponent_left'){S.started=false;controls.classList.add('hidden');lobby.classList.remove('hidden');status.textContent='Соперник отключился';msg.textContent='Можно снова найти игру.';}}
function send(x){if(S.ws?.readyState===1)S.ws.send(JSON.stringify(x))}addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true;if(e.code==='Space')send({type:'shoot'})});addEventListener('keyup',e=>S.keys[e.key.toLowerCase()]=false);$('fire').onpointerdown=e=>{e.preventDefault();send({type:'shoot'})};setInterval(()=>{if(!S.started||S.host)return;let x=((S.keys.d||S.keys.arrowright)?1:0)-((S.keys.a||S.keys.arrowleft)?1:0)+S.joy.x,y=((S.keys.s||S.keys.arrowdown)?1:0)-((S.keys.w||S.keys.arrowup)?1:0)+S.joy.y;send({type:'input',x,y})},40);
let jp=null;function jm(e){let r=$('stick').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=52,l=Math.hypot(dx,dy)||1,x=Math.min(m,dx/l*m),y=Math.min(m,dy/l*m);S.joy={x:x/m,y:y/m};$('knob').style.left=41+x+'px';$('knob').style.top=41+y+'px'}$('stick').onpointerdown=e=>{jp=e.pointerId;$('stick').setPointerCapture(jp);jm(e)};$('stick').onpointermove=e=>{if(e.pointerId===jp)jm(e)};$('stick').onpointerup=$('stick').onpointercancel=e=>{if(e.pointerId===jp){jp=null;S.joy={x:0,y:0};$('knob').style.left='41px';$('knob').style.top='41px'}};
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080b16';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(100,120,190,.10)';for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}let sx=W/1000,sy=H/700;for(const b of S.bullets){ctx.fillStyle=b.owner===S.me?'#8efcff':'#ff5b8a';ctx.beginPath();ctx.arc(b.x*sx,b.y*sy,5,0,7);ctx.fill()}for(let i=0;i<2;i++){let p=S.players[i],x=p.x*sx,y=p.y*sy,col=i===S.me?'#55e7ff':'#ff5b8a';ctx.shadowBlur=20;ctx.shadowColor=col;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,20*Math.min(sx,sy),0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#11162a';ctx.beginPath();ctx.arc(x,y,12*Math.min(sx,sy),0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(p.name||'Игрок',x,y-27)}}function loop(){draw();requestAnimationFrame(loop)}loop();
</script></body></html>
