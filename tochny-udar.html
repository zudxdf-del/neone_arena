<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Точный удар</title><style>*{box-sizing:border-box}body{margin:0;background:#060a11;color:#eaffff;font:16px Arial;min-height:100vh}.app{max-width:900px;margin:auto;padding:18px}.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.score{background:#0b1420;border:1px solid #194154;border-radius:14px;padding:10px 14px}.score b{font-size:30px}.p2{text-align:right}.center{text-align:center}.turn{color:#00e5ff;font-weight:bold}.arena{height:330px;margin:15px 0;border:1px solid #194154;border-radius:18px;background:radial-gradient(circle,#102436,#05080d 70%);position:relative;overflow:hidden}.line{position:absolute;top:50%;width:100%;border-top:1px dashed #1c5868}.target{position:absolute;top:calc(50% - 30px);width:60px;height:60px;border-radius:50%;background:#ff2bd6;border:3px solid white;box-shadow:0 0 12px #ff2bd6,0 0 35px #ff2bd688}.target.hit{background:#24ff72;box-shadow:0 0 18px #24ff72,0 0 45px #24ff72}.target.miss{background:#ff3155;box-shadow:0 0 18px #ff3155,0 0 45px #ff3155}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:17px;border-radius:15px;border:1px solid #00e5ff88;background:#091a26;color:#eaffff;font-size:18px;font-weight:bold}.btn:disabled{opacity:.3}.overlay{position:fixed;inset:0;background:#03060ddd;display:grid;place-items:center;padding:20px;z-index:5}.card{width:min(420px,100%);background:#09111b;border:1px solid #214354;border-radius:22px;padding:26px;text-align:center;box-shadow:0 0 60px #00e5ff15}.card h1{color:#00e5ff;margin:0 0 10px}.input{width:100%;padding:13px;margin:5px 0;border-radius:11px;border:1px solid #244454;background:#050a10;color:white;font-size:16px}.row{display:flex;gap:8px}.row>*{flex:1}.info{color:#7796a4;font-size:13px;margin:12px 0}.status{min-height:20px;color:#ff7088}.hidden{display:none!important}@media(max-width:600px){.app{padding:10px}.arena{height:38vh;min-height:230px}.controls{position:fixed;bottom:10px;left:10px;right:10px;z-index:4}.hint{padding-bottom:75px}.top{grid-template-columns:1fr 1fr}.center{grid-column:1/-1;grid-row:1}}
</style></head><body><main class="app"><div class="top"><div class="score">Игрок 1<br><b id="s1">0</b></div><div class="center"><div id="round">Выстрел 1 / 10</div><div class="turn" id="turn">Ход: Игрок 1</div></div><div class="score p2">Игрок 2<br><b id="s2">0</b></div></div><div class="arena"><div class="line"></div><div class="target" id="target"></div></div><div class="hint">A — Игрок 1 · L — Игрок 2</div><div class="controls"><button class="btn" id="a">A · ВЫСТРЕЛ</button><button class="btn" id="l">L · ВЫСТРЕЛ</button></div></main><section class="overlay" id="menu"><div class="card"><h1>ТОЧНЫЙ УДАР</h1><p>Онлайн-дуэль для двух игроков</p><input class="input" id="nick" maxlength="18" value="Игрок" placeholder="Ваше имя"><button class="btn" id="create">Создать игру</button><div class="row"><input class="input" id="room" maxlength="6" placeholder="Код комнаты"><button class="btn" id="join">Войти</button></div><div class="info">Создайте комнату и передайте её код второму игроку.</div><div class="status" id="status"></div></div></section><section class="overlay hidden" id="end"><div class="card"><h1 id="result">ИГРА ОКОНЧЕНА</h1><p id="final"></p><button class="btn" onclick="location.reload()">Играть снова</button></div></section><script>const $=x=>document.getElementById(x);let ws,me=-1,turn=0,run=false,shots=0,s=[0,0];function status(x){$('status').textContent=x||''}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>status('Соединение установлено');ws.onerror=()=>status('Ошибка соединения');ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='created'){me=m.player;$('room').value=m.room;status('Код комнаты: '+m.room+' — передайте его сопернику')}if(m.type==='waiting')status('Код комнаты: '+m.room+' · ждём соперника…');if(m.type==='start'){run=true;s=[0,0];shots=0;$('menu').classList.add('hidden');update(m)}if(m.type==='state')update(m);if(m.type==='shot'){flash(m.hit);update(m)}if(m.type==='finish'){run=false;s=m.scores;$('result').textContent=s[0]===s[1]?'НИЧЬЯ!':s[me]>s[1-me]?'ПОБЕДА!':'ПОРАЖЕНИЕ';$('final').textContent='Игрок 1: '+s[0]+' — Игрок 2: '+s[1];$('end').classList.remove('hidden')}if(m.type==='error')status(m.message)}}connect();function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}function update(m){turn=m.turn;shots=m.shots;s=m.scores;$('s1').textContent=s[0];$('s2').textContent=s[1];$('round').textContent='Выстрел '+Math.min(shots+1,10)+' / 10';$('turn').textContent='Ход: '+(turn===0?'Игрок 1':'Игрок 2');$('target').style.left='calc('+(m.x*100)+'% - 30px)';$('a').disabled=!run||me!==0||turn!==0;$('l').disabled=!run||me!==1||turn!==1}function flash(hit){let t=$('target');t.classList.remove('hit','miss');void t.offsetWidth;t.classList.add(hit?'hit':'miss');setTimeout(()=>t.classList.remove('hit','miss'),180);if(hit)beep()}function beep(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.1)}catch{}}function shoot(){if(run&&turn===me)send({type:'shoot'})}$('create').onclick=()=>send({type:'create',nick:$('nick').value||'Игрок'});$('join').onclick=()=>send({type:'join',nick:$('nick').value||'Игрок',room:$('room').value.trim().toUpperCase()});$('a').onclick=shoot;$('l').onclick=shoot;document.onkeydown=e=>{if(e.repeat)return;if(e.key.toLowerCase()==='a'&&me===0)shoot();if(e.key.toLowerCase()==='l'&&me===1)shoot()};</script></body></html>
