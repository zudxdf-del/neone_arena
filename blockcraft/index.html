<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BlockCraft 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#86c9f2;font-family:system-ui;color:#fff;touch-action:none}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px}.joy{position:fixed;left:18px;bottom:20px;width:120px;height:120px;border:2px solid #fff6;border-radius:50%;background:#0002;pointer-events:auto}.knob{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff6}.look{position:fixed;right:0;top:0;width:60%;height:72%;pointer-events:auto}.buttons{position:fixed;right:18px;bottom:20px;display:flex;gap:10px;pointer-events:auto}.btn{width:70px;height:70px;border:1px solid #fff8;border-radius:18px;background:#111a;color:#fff;font-weight:900}.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.slot{width:42px;height:42px;border:2px solid #fff5;border-radius:8px;background:#111b;display:grid;place-items:center;font-size:20px}.sel{border-color:#fff}.start{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#07111ee8}.card{width:min(90vw,430px);padding:28px;border-radius:26px;background:#101a24f2;text-align:center}.card h1{font-size:34px;margin:0 0 8px}.card p{color:#c6d4df;line-height:1.5}.launch{width:100%;padding:17px;border:0;border-radius:15px;font-size:18px;font-weight:900}</style></head><body><div class="start" id="start"><div class="card"><h1>⛏️ BLOCKCRAFT 3D</h1><p>Мобильный воксельный мир: исследуй, ломай блоки и строй свой мир.</p><button class="launch" id="go">ЗАПУСТИТЬ МИР</button><p style="font-size:11px;opacity:.6">WebGL • Three.js • сохранение мира в браузере</p></div></div><div class="ui"><div class="top"><span>BLOCKCRAFT 3D</span><span id="fps">WORLD 01</span></div><div class="cross">＋</div></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="look" id="look"></div><div class="buttons"><button class="btn" id="break">⛏<br>ЛОМАТЬ</button><button class="btn" id="place">▣<br>СТРОИТЬ</button></div><div class="bar"><div class="slot sel" data-t="grass">🌿</div><div class="slot" data-t="dirt">🟫</div><div class="slot" data-t="stone">🪨</div><div class="slot" data-t="wood">🪵</div><div class="slot" data-t="sand">🟨</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import*as T from'three';const S=new T.Scene();S.background=new T.Color(0x87c9ef);S.fog=new T.Fog(0x87c9ef,25,90);const C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,160);const R=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xc9efff,0x50603d,1.7));let L=new T.DirectionalLight(0xfff0c0,2);L.position.set(-25,45,20);S.add(L);const G=new T.BoxGeometry(1,1,1),M={grass:new T.MeshLambertMaterial({color:0x56a83e}),dirt:new T.MeshLambertMaterial({color:0x8a5a35}),stone:new T.MeshLambertMaterial({color:0x878c90}),wood:new T.MeshLambertMaterial({color:0x9b6b3e}),sand:new T.MeshLambertMaterial({color:0xd8c178}),leaves:new T.MeshLambertMaterial({color:0x2e8138})},W=new Map(),K=(x,y,z)=>x+','+y+','+z;function H(x,z){let n=Math.sin(x*.23)+Math.cos(z*.19)+Math.sin((x-z)*.11);return Math.max(1,Math.floor(5+n*.7+(Math.random()-.5)*.7))}for(let x=-25;x<=25;x++)for(let z=-25;z<=25;z++){let h=H(x,z);for(let y=0;y<=h;y++)W.set(K(x,y,z),y==h?'grass':y>h-3?'dirt':'stone')}for(let i=0;i<24;i++){let x=Math.floor(Math.random()*44-22),z=Math.floor(Math.random()*44-22),h=H(x,z);for(let y=1;y<5;y++)W.set(K(x,h+y,z),'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<6;dy++)if(Math.abs(dx)+Math.abs(dz)<4)W.set(K(x+dx,h+dy,z+dz),'leaves')}const MS=new Map();function rebuild(){for(const m of MS.values())S.remove(m);MS.clear();for(const[k,t]of W){let[x,y,z]=k.split(',').map(Number),m=new T.Mesh(G,M[t]);m.position.set(x+.5,y+.5,z+.5);m.userData={x,y,z};S.add(m);MS.set(k,m)}}rebuild();let x=0,z=0,y=H(0,0)+2,yaw=0,pitch=-.2,sel='grass',jx=0,jy=0,drag=false,lx=0,ly=0;function move(dt){let sp=4.5,sy=Math.sin(yaw),cy=Math.cos(yaw);x+=(jx*cy+jy*sy)*sp*dt;z+=(jx*-sy+jy*cy)*sp*dt;y=H(Math.round(x),Math.round(z))+2;C.position.set(x,y,z);C.rotation.set(pitch,yaw,0)}function hit(){let q=new T.Raycaster();q.setFromCamera(new T.Vector2(0,0),C);return q.intersectObjects([...MS.values()])[0]}function act(place){let h=hit();if(!h||h.distance>7)return;let b=h.object.userData;if(place){let n=h.face.normal,xx=b.x+n.x,yy=b.y+n.y,zz=b.z+n.z;if(!W.has(K(xx,yy,zz)))W.set(K(xx,yy,zz),sel)}else W.delete(K(b.x,b.y,b.z));rebuild()}$('break').onclick=()=>act(false);$('place').onclick=()=>act(true);document.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{sel=s.dataset.t;document.querySelectorAll('.slot').forEach(a=>a.classList.remove('sel'));s.classList.add('sel')});addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='5'){sel=['grass','dirt','stone','wood','sand'][+e.key-1]}if(e.code==='Space')act(true)});const J=document.getElementById('joy'),N=document.getElementById('knob');J.onpointerdown=e=>{J.setPointerCapture(e.pointerId);jx=0;jy=0};J.onpointermove=e=>{let r=J.getBoundingClientRect();jx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/40));jy=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/40));N.style.transform=`translate(${jx*30}px,${jy*30}px)`};J.onpointerup=()=>{jx=jy=0;N.style.transform=''};const V=document.getElementById('look');V.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;V.setPointerCapture(e.pointerId)};V.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY};V.onpointerup=()=>drag=false;document.getElementById('go').onclick=()=>document.getElementById('start').remove();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1000);last=t;move(dt);R.render(S,C)}loop(last);
</script></body></html>
